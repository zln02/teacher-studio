<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>문화유산 탐험대</title>
<style>
:root{
  --hanji:#f6efdf; --paper:#fffaf0; --line:#d9c6a0; --ink:#2b2118;
  --indigo:#1f4e79; --indigo-d:#163a5c; --indigo-l:#dbe8f4;
  --ocher:#b5762f; --ocher-l:#f6e3c4;
  --red:#b02a22; --red-l:#fde6e3;
  --green:#1d6b3a; --green-l:#e1f3e5;
  --gold:#e0a100;
}
*{box-sizing:border-box}
html{font-size:clamp(17px,1.1vw + 13px,24px)}
body{margin:0;color:var(--ink);background:var(--hanji);
  background-image:radial-gradient(rgba(181,118,47,.10) 1px,transparent 1.5px);background-size:18px 18px;
  font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.55;min-height:100vh}
.dan{height:10px;background:repeating-linear-gradient(90deg,#1f4e79 0 28px,#2e7d5b 28px 56px,#b02a22 56px 84px,#e0b040 84px 112px)}
.topbar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:2px solid var(--line)}
.bar{max-width:960px;margin:0 auto;padding:6px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar strong{flex:1;text-align:center;color:var(--indigo-d);min-width:120px}
.wrap{max-width:960px;margin:0 auto;padding:16px 16px 48px}
h1,h2,h3{margin:.3em 0;line-height:1.3}
h1{font-size:1.9rem;color:var(--indigo-d)}
h2{font-size:1.4rem;color:var(--indigo-d)}
h2:focus,h1:focus{outline:none}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 3px 0 rgba(120,80,30,.15);margin:12px 0}
.btn{font:inherit;font-weight:700;min-height:48px;padding:8px 18px;border-radius:12px;border:2px solid var(--indigo);background:#fff;color:var(--indigo-d);cursor:pointer}
.btn:hover{background:var(--indigo-l)}
.btn.primary{background:var(--indigo);color:#fff}.btn.primary:hover{background:var(--indigo-d)}
.btn.accent{background:var(--red);border-color:var(--red);color:#fff}.btn.accent:hover{background:#8f211b}
.btn.small{min-height:44px;padding:4px 12px;font-size:.9rem}
.btn:disabled{opacity:.55;cursor:not-allowed}
button:focus-visible{outline:3px solid #111;outline-offset:2px;box-shadow:0 0 0 6px #ffd54a}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.muted{color:#5a4a38}
/* 시작 */
.hero{text-align:center;padding:12px 0}
.hero svg{width:min(380px,90%);height:auto}
.hero p{font-size:1.1rem}
/* 지도 */
.stamps{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.stamp{width:84px;height:84px;border:5px double var(--red);border-radius:50%;color:var(--red);display:grid;place-items:center;text-align:center;font-weight:800;font-size:.9rem;line-height:1.15;transform:rotate(-10deg);background:rgba(255,255,255,.5);animation:stampIn .6s cubic-bezier(.2,1.6,.4,1) both}
.stamp b{display:block;font-size:1.6rem}
.stamp.empty{border:4px dashed #b9a98c;color:#6b5b45;animation:none;transform:none;font-weight:600}
.stamp.big{width:112px;height:112px;font-size:1.05rem}
.stages{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:700px){.stages{grid-template-columns:1fr 1fr}}
.stage{display:flex;gap:12px;align-items:center;text-align:left;width:100%;font:inherit;color:inherit;background:var(--paper);border:2px solid var(--line);border-left:10px solid var(--indigo);border-radius:14px;padding:12px;cursor:pointer;min-height:92px}
.stage:hover:not(:disabled){background:#fff;border-color:var(--indigo)}
.stage:disabled{opacity:.7;cursor:not-allowed;border-left-color:#9a8b72;background:#eee6d3}
.stage .ico{font-size:2.2rem;flex:none;width:2.6rem;text-align:center}
.stage .t{font-weight:800}
.stage .k{font-size:.85rem;color:#5a4a38}
.stars{color:#9a6a00;font-weight:800;letter-spacing:2px}
/* HUD */
.hud{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;font-weight:800;background:var(--indigo);color:#fff;border-radius:12px;padding:8px 14px}
/* 문제 */
.q{font-size:1.3rem;font-weight:800;margin:6px 0 14px}
.opts{display:grid;gap:10px}
.opts.ox{grid-template-columns:1fr 1fr}
.opt,.step{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-weight:600;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;min-height:58px;cursor:pointer}
.opt:hover:not(:disabled),.step:hover:not(:disabled){border-color:var(--indigo);background:var(--indigo-l)}
.opt:disabled,.step:disabled{cursor:default}
.opt .letter,.step .num{flex:none;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--indigo);color:#fff;display:grid;place-items:center;font-weight:800}
.opts.ox .opt{flex-direction:column;text-align:center;justify-content:center;min-height:96px}
.opts.ox .letter{width:3rem;height:3rem;font-size:1.6rem}
.opt .otxt,.step .otxt{flex:1}
.mark{font-weight:800;white-space:nowrap}
.opt.correct,.step.correct{background:var(--green-l);border-color:var(--green)}
.opt.wrong,.step.wrong{background:var(--red-l);border-color:var(--red)}
.opt.dim{opacity:.6}
.step.sel{background:var(--ocher-l);border-color:var(--ocher);box-shadow:0 0 0 3px var(--ocher)}
.order{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.spark{animation:spark .7s ease-out}
.fb{margin-top:14px}
.fbbox{border-radius:12px;padding:12px 14px;border:2px solid;border-left-width:10px}
.fbbox.good{background:var(--green-l);border-color:var(--green)}
.fbbox.bad{background:var(--red-l);border-color:var(--red)}
.fbbox.info{background:var(--ocher-l);border-color:var(--ocher)}
.fbbox p{margin:.2em 0}
.fbhead{font-weight:800;font-size:1.1rem}
.tip{font-size:.95rem;color:#5a4a38;margin:0 0 10px}
/* 분류 */
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:64px;margin:8px 0}
.tcard{font:inherit;font-weight:800;display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ocher);border-radius:14px;padding:8px 14px;min-height:56px;cursor:pointer;color:var(--ink)}
.tcard .e{font-size:1.6rem}
.tcard.sel{background:var(--ocher-l);transform:translateY(-4px);box-shadow:0 0 0 4px var(--ocher)}
.baskets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.basket{font:inherit;color:var(--ink);text-align:center;border-radius:16px;border:3px dashed;padding:10px 8px;min-height:150px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center}
.basket.a{background:var(--indigo-l);border-color:var(--indigo)}
.basket.b{background:var(--red-l);border-color:var(--red)}
.basket:hover{filter:brightness(.97)}
.basket .bt{font-weight:800;font-size:1.05rem}
.basket .bs{font-size:.8rem;color:#4a3b2a}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.chip{background:#fff;border:2px solid var(--green);border-radius:999px;padding:1px 9px;font-size:.85rem;font-weight:700}
.chip.x{border-color:var(--red)}
/* 짝 맞추기 */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:720px){.mgrid{grid-template-columns:repeat(4,1fr);gap:12px}}
.mc{perspective:700px;height:124px;padding:0;border:0;background:none;font:inherit;cursor:pointer}
@media(min-width:720px){.mc{height:140px}}
.mi{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d;display:block}
.mc.flip .mi{transform:rotateY(180deg)}
.mf,.mb{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px 6px;border:3px solid}
.mb{background:var(--indigo);border-color:var(--indigo-d);color:#fff;font-size:2rem;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 8px,transparent 8px 16px)}
.mf{transform:rotateY(180deg);background:#fff;border-color:var(--ocher);font-weight:700;font-size:.88rem;line-height:1.3}
.mf.nm{font-size:1rem;font-weight:800}
.mf .e{font-size:1.6rem}
.mc.done .mf{background:var(--green-l);border-color:var(--green)}
.mc:disabled{cursor:default}
/* 결과 */
.big{font-size:2.4rem;font-weight:900;color:var(--indigo-d)}
.bigstars{font-size:2.6rem;color:#c58a00;letter-spacing:4px}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.notes li{background:#fff;border:2px solid var(--line);border-left:10px solid var(--red);border-radius:12px;padding:10px 12px}
.notes p{margin:.15em 0}
.title-badge{display:inline-block;background:var(--ocher-l);border:2px solid var(--ocher);border-radius:999px;padding:4px 16px;font-weight:800;font-size:1.15rem}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
#fx span{position:absolute;top:-20px;width:10px;height:16px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes stampIn{0%{transform:scale(3) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(-10deg);opacity:1}}
@keyframes spark{0%{box-shadow:0 0 0 0 rgba(224,161,0,.9)}100%{box-shadow:0 0 0 18px rgba(224,161,0,0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:420px){h1{font-size:1.6rem}.opts.ox .opt{min-height:84px}.baskets{gap:6px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="dan"></div>
  <div class="bar">
    <button class="btn small" id="homeBtn" type="button">🏠 처음</button>
    <strong>문화유산 탐험대</strong>
    <button class="btn small" id="mapBtn" type="button">🗺️ 지도</button>
    <button class="btn small" id="muteBtn" type="button" aria-pressed="false">🔊 소리 켬</button>
  </div>
</header>
<main class="wrap" id="app"></main>
<div id="fx" aria-hidden="true"></div>

<script>
/* ============================================================
   ★ 선생님께: 문제 고치는 방법 ★
   - 아래 DATA 안의 글만 고치면 됩니다. (따옴표 '' 와 쉼표 , 는 그대로 두세요.)
   - OX 문제: a 는 맞는 말이면 true, 틀린 말이면 false.
   - 4지선다: options 는 보기 4개, answer 는 정답의 번호(0부터 시작: 첫째 보기=0, 둘째=1...).
   - 분류 카드: type 은 '유형' 또는 '무형'.
   - 짝 맞추기: name(이름)과 desc(짧은 설명, 20자 안팎), why(정답 뒤 해설).
   - 문제는 pick 개수만큼 매번 무작위로 뽑아 냅니다. 문제를 더 넣어도 됩니다.
   ============================================================ */
const DATA = {
  stage1: { pick: 6, items: [
    { q: '문화유산은 조상들이 남겨 준 소중한 것으로, 지금도 지키고 있다.', a: true,
      why: '문화유산은 조상의 삶과 지혜가 담긴 소중한 유산이에요. 우리가 잘 지켜서 후손에게 물려주어야 해요.' },
    { q: '문화유산은 눈으로 볼 수 있고 만질 수 있는 것만 해당한다.', a: false,
      why: '탈춤이나 판소리처럼 눈에 보이는 모양이 없는 무형 문화유산도 있어요.' },
    { q: '탈춤, 판소리처럼 몸짓과 소리, 기술로 전해지는 것도 문화유산이다.', a: true,
      why: '모양이 없어도 사람을 통해 대대로 전해지는 것은 무형 문화유산이에요.' },
    { q: '문화유산은 아주 오래된 것이라서 지금 우리 생활과는 아무 관계가 없다.', a: false,
      why: '문화유산은 지금 우리 삶의 뿌리예요. 옛사람들의 생활과 지혜를 알려 주고 우리 문화에 영향을 줘요.' },
    { q: '문화유산을 살펴보면 옛사람들의 생활 모습과 지혜를 알 수 있다.', a: true,
      why: '문화유산에는 그 시대 사람들이 살아온 모습과 생각, 기술이 담겨 있어요.' },
    { q: '문화유산은 큰 도시에만 있고, 작은 마을에는 없다.', a: false,
      why: '문화유산은 전국 어느 지역에나 있어요. 우리 동네에도 찾아보면 소중한 문화유산이 있답니다.' },
    { q: '궁궐, 탑, 도자기처럼 모양이 있는 문화유산을 유형 문화유산이라고 한다.', a: true,
      why: '직접 보고 만질 수 있는 물건이나 건물은 유형 문화유산이에요.' },
    { q: '문화유산은 지금 사는 우리만 쓰고 즐기면 되므로 후손에게 물려줄 필요가 없다.', a: false,
      why: '문화유산은 앞으로 태어날 후손들도 누릴 수 있도록 잘 지켜서 물려주어야 해요.' },
    { q: '음식을 만드는 방법이나 전통 놀이도 문화유산이 될 수 있다.', a: true,
      why: '김장 문화나 강강술래, 씨름처럼 생활 속 지식과 풍습, 놀이도 무형 문화유산이에요.' },
    { q: '문화유산은 오직 우리나라에만 있고, 다른 나라에는 없다.', a: false,
      why: '나라마다 그 나라의 역사와 문화가 담긴 문화유산이 있어요.' }
  ]},

  stage2: { perBasket: 4, items: [
    { name: '석탑', emoji: '🧱', type: '유형', why: '돌을 쌓아 만든 탑이에요. 눈으로 보고 만질 수 있는 유형 문화유산이에요.' },
    { name: '궁궐', emoji: '🏛️', type: '유형', why: '임금이 살며 나랏일을 보던 건물이에요. 모양이 있는 유형 문화유산이에요.' },
    { name: '도자기', emoji: '🏺', type: '유형', why: '흙을 빚어 구운 그릇이에요. 직접 볼 수 있는 유형 문화유산이에요.' },
    { name: '고인돌', emoji: '🪨', type: '유형', why: '커다란 돌로 만든 옛 무덤이에요. 유형 문화유산이에요.' },
    { name: '옛 책', emoji: '📜', type: '유형', why: '종이에 글을 담아 만든 물건이라서 유형 문화유산이에요.' },
    { name: '성곽', emoji: '🏰', type: '유형', why: '돌이나 흙으로 쌓은 성이에요. 모양이 있는 유형 문화유산이에요.' },
    { name: '범종', emoji: '🔔', type: '유형', why: '절에서 치는 큰 쇠종이에요. 직접 볼 수 있는 유형 문화유산이에요.' },
    { name: '탈춤', emoji: '🎭', type: '무형', why: '탈을 쓰고 추는 춤과 연극이에요. 몸짓으로 전해지는 무형 문화유산이에요.' },
    { name: '판소리', emoji: '🎤', type: '무형', why: '소리꾼이 북 장단에 맞춰 이야기를 노래해요. 소리로 전해지는 무형 문화유산이에요.' },
    { name: '김장', emoji: '🥬', type: '무형', why: '겨울을 나려고 함께 김치를 담그는 풍습과 지식이에요. 무형 문화유산이에요.' },
    { name: '강강술래', emoji: '💃', type: '무형', why: '여럿이 손을 잡고 둥글게 돌며 노래하고 춤추는 놀이예요. 무형 문화유산이에요.' },
    { name: '농악', emoji: '🥁', type: '무형', why: '꽹과리, 장구, 북 등을 치며 함께 노는 공동체 놀이예요. 무형 문화유산이에요.' },
    { name: '씨름', emoji: '🤼', type: '무형', why: '두 사람이 맞붙어 힘과 기술로 겨루는 전통 놀이예요. 무형 문화유산이에요.' },
    { name: '아리랑', emoji: '🎶', type: '무형', why: '오랫동안 사람들이 불러 온 노래예요. 소리로 전해지는 무형 문화유산이에요.' }
  ]},

  stage3: { pick: 6, items: [
    { name: '불국사', emoji: '🪷', desc: '신라의 절. 석가탑과 다보탑이 있어요',
      why: '불국사는 경주에 있는 신라 시대의 절이에요. 석가탑과 다보탑이 있고 세계유산이에요.' },
    { name: '수원 화성', emoji: '🏰', desc: '조선 정조 때 쌓은 성곽',
      why: '수원 화성은 조선 정조 때 쌓은 성곽이에요. 거중기 같은 기구를 써서 쌓았어요.' },
    { name: '해인사 장경판전', emoji: '📚', desc: '팔만대장경 경판을 보관한 건물',
      why: '해인사 장경판전은 팔만대장경 경판을 보관해 온 건물이에요. 바람이 잘 통하게 지은 것으로 유명해요.' },
    { name: '종묘', emoji: '🏛️', desc: '조선 왕과 왕비의 위패를 모신 사당',
      why: '종묘는 조선 시대 왕과 왕비의 위패를 모시고 제사를 지내던 사당이에요.' },
    { name: '고인돌 유적', emoji: '🪨', desc: '큰 돌로 만든 옛 무덤 유적',
      why: '고인돌은 옛사람들이 큰 돌로 만든 무덤이에요. 고창·화순·강화의 고인돌 유적은 세계유산이에요.' },

/* 소리 (첫 입력 뒤에만 AudioContext 생성) */
let ac = null, userActed = false;
['pointerdown', 'keydown', 'touchstart'].forEach((ev) => addEventListener(ev, () => { userActed = true; }, { capture: true, once: true }));
function getAC() {
  if (!userActed || save.muted) return null;
  if (!ac) { try { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ac = new C(); } catch (e) { return null; } }
  try { if (ac.state === 'suspended') ac.resume(); } catch (e) { /* 무시 */ }
  return ac;
}
function sfx(kind) {
  const c = getAC(); if (!c) return;
  const seqs = {
    ok: [[660, 0, .1, 'sine'], [880, .1, .16, 'sine']],
    no: [[240, 0, .16, 'triangle'], [180, .15, .22, 'triangle']],
    clear: [[523, 0, .13, 'sine'], [659, .13, .13, 'sine'], [784, .26, .13, 'sine'], [1047, .39, .3, 'sine']],
    tap: [[520, 0, .05, 'sine']]
  };
  try {
    const t0 = c.currentTime;
    (seqs[kind] || []).forEach(([f, d, l, type]) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + d);
      g.gain.exponentialRampToValueAtTime(0.18, t0 + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + l);
      o.connect(g); g.connect(c.destination); o.start(t0 + d); o.stop(t0 + d + l + 0.05);
    });
  } catch (e) { /* 무시 */ }
}

let S = null;
function kindOf(src) {

  if ('options' in src) return 'mcq';
  if ('type' in src) return 'sort';
  return 'pair';
}
function prep(src) {   /* 출제용 복사본 (보기 순서 섞기) */
  const k = kindOf(src);
  if (k === 'ox') return { kind: 'ox', q: src.q, options: ['O', 'X'], ans: src.a ? 0 : 1, why: src.why, src };
  if (k === 'mcq') {
    const idx = shuffle(src.options.map((_, i) => i));
    return { kind: 'mcq', q: src.q, options: idx.map((i) => src.options[i]), ans: idx.indexOf(src.answer), why: src.why, src };
  }
  if (k === 'order') return { kind: 'order', q: src.q, steps: src.steps, why: src.why, src };
  return src;
}
function buildItems(n, retry) {
  if (retry) return retry.map(prep);
  if (n === 1) return pickN(DATA.stage1.items, DATA.stage1.pick).map(prep);
  if (n === 2) {
    const per = DATA.stage2.perBasket, it = DATA.stage2.items;
    return shuffle(pickN(it.filter((c) => c.type === '유형'), per).concat(pickN(it.filter((c) => c.type === '무형'), per)));
  }
  if (n === 3) return pickN(DATA.stage3.items, DATA.stage3.pick);
  if (n === 4) return [prep(pickN(DATA.stage4.orders, 1)[0])].concat(pickN(DATA.stage4.quiz.items, DATA.stage4.quiz.pick).map(prep));
  return pickN(DATA.stage5.items, DATA.stage5.pick).map(prep);
}
function newState(n, mode, items) {
  return { n, mode, items, idx: 0, score: 0, combo: 0, maxCombo: 0, right: 0, total: items.length, wrong: [], mistakes: 0 };
}
function award() {

}
function miss() { S.combo = 0; S.mistakes++; }
const gainText = (bonus) => '+' + (100 + bonus) + '점' + (bonus ? ' (연속 정답 보너스 +' + bonus + ')' : '');
function makeHud() {

function renderChoice(box, it, hud, go, nextLabel) {

  const fb = el('div', { class: 'fb', role: 'status', 'aria-live': 'polite' });

    el('span', { class: 'letter', 'aria-hidden': ox ? null : 'true' }, ox ? t : letters[i]),
    el('span', { class: 'otxt' }, ox ? (i === 0 ? '맞아요' : '아니에요') : t),

function renderOrder(box, it, hud, go, nextLabel) {
  let arr = shuffle(it.steps.map((t, i) => ({ t, i })));
  while (arr.every((o, k) => o.i === k)) arr = shuffle(arr);
  let sel = -1, checked = false;

  const checkBtn = el('button', { class: 'btn primary', type: 'button', style: 'margin-top:12px', onclick: check }, '✔ 순서 확인하기');
  function draw(focusK) {
    list.replaceChildren(...arr.map((o, k) => el('li', null,
      el('button', { class: 'step' + (sel === k ? ' sel' : '') + (checked ? (o.i === k ? ' correct' : ' wrong') : ''), type: 'button', 'aria-pressed': String(sel === k), disabled: checked, onclick: () => tap(k) },
        el('span', { class: 'num' }, String(k + 1)),
        el('span', { class: 'otxt' }, o.t),

    const label = c.nm ? el('span', null, el('span', { class: 'e', 'aria-hidden': 'true' }, c.p.emoji), el('br'), c.p.name) : c.p.desc;
    const b = el('button', { class: 'mc', type: 'button', 'aria-label': '카드 ' + (k + 1) + ' (뒤집지 않음)', onclick: () => flip(k) },
      el('span', { class: 'mi' }, el('span', { class: 'mb', 'aria-hidden': 'true' }, '❓'), el('span', { class: 'mf' + (c.nm ? ' nm' : '') }, label)));
    return b;
  });
  const setFace = (k, up) => {
    btns[k].classList.toggle('flip', up);
    btns[k].setAttribute('aria-label', up ? '카드: ' + (cards[k].nm ? cards[k].p.name : cards[k].p.desc) : '카드 ' + (k + 1) + ' (뒤집지 않음)');
  };
  function status() { hud.update('찾은 짝 ' + matched + ' / ' + S.total); }
  function flip(k) {
    if (mine !== S || lock || open.includes(k) || btns[k].classList.contains('done')) return;
    sfx('tap'); setFace(k, true); open.push(k);
    if (open.length < 2) return;
    const [a, b] = open, A = cards[a], B = cards[b];
    if (A.id === B.id && A.nm !== B.nm) {
      matched++; const bonus = award(); sfx('ok');
      [a, b].forEach((x) => { btns[x].classList.add('done'); btns[x].disabled = true; });
      btns[b].classList.add('spark');
      open = [];
      fb.replaceChildren(fbBox('good', '⭕ 짝이에요! ' + A.p.name + ' ' + gainText(bonus)), el('p', null, '💡 ' + A.p.why));
      status();
      if (matched === S.total) { sfx('clear'); done.replaceChildren(nextBtn('결과 보기 ▶', finish)); }
    } else {
      miss(); sfx('no'); lock = true;
      [A, B].forEach((c) => { if (!noted.has(c.id)) { noted.add(c.id); S.wrong.push({ src: c.p, q: '"' + c.p.name + '"의 설명을 찾아 보세요.', mine: null, ans: c.p.desc, why: c.p.why }); } });
      fb.replaceChildren(fbBox('bad', '❌ 짝이 아니에요. 어디에 있었는지 기억해 두세요!'));
      status();
      setTimeout(() => { if (mine !== S) return; setFace(a, false); setFace(b, false); open = []; lock = false; }, 1300);
    }
  }
  status();
  show(el('section', null, stageHeader(), hud.node,
    el('div', { class: 'panel' }, el('p', { class: 'tip' }, '같은 문화유산의 "이름 카드"와 "설명 카드"가 짝이에요.'), el('div', { class: 'mgrid' }, btns), fb, done)), 'h2');
}

/* ---------------- 결과 ---------------- */
function finish() {
  const n = S.n;
  const ratio = n === 3 ? S.total / (S.total + S.mistakes) : S.right / S.total;
  const th = n === 3 ? [0.7, 0.5] : [0.8, 0.55];
  const stars = ratio >= th[0] ? 3 : ratio >= th[1] ? 2 : 1;
  let record = false, firstClear = false;
  if (S.mode === 'normal') {
    const prev = save.best[n] || { score: 0, stars: 0 };
    record = S.score > prev.score;
    firstClear = !save.stamps[n];
    save.best[n] = { score: Math.max(prev.score, S.score), stars: Math.max(prev.stars, stars) };
    save.stamps[n] = true;
    persist();
  }
  sfx('clear');
  if (stars >= 2 || firstClear) confetti();
  renderResult(stars, record, firstClear);
}
function renderResult(stars, record, firstClear) {
  const n = S.n, st = S, s = STAGES[n - 1], tt = titleFor(totalStars());
  const normal = S.mode === 'normal';
  const notes = S.wrong.length
    ? el('ol', { class: 'notes' }, S.wrong.map((w) => el('li', null,
        el('p', null, el('b', null, '❌ ' + w.q)),
        w.mine ? el('p', null, '내가 고른 답: ' + w.mine) : null,
        el('p', null, el('b', null, '⭕ 정답: ' + w.ans)),
        el('p', null, '💡 ' + w.why))))
    : el('p', { class: 'fbbox good' }, '🎉 틀린 문제가 하나도 없어요! 완벽해요.');
  const allDone = stampCount() === 5;
  const actions = el('div', { class: 'row', style: 'justify-content:center;margin-top:12px' },
    st.wrong.length ? el('button', { class: 'btn accent', type: 'button', onclick: () => startStage(n, st.wrong.map((w) => w.src)) }, '🔁 틀린 문제만 다시 풀기') : null,
    n < 5 && isOpen(n + 1) ? el('button', { class: 'btn primary', type: 'button', onclick: () => renderIntro(n + 1) }, '다음 스테이지 ▶') : null,
    el('button', { class: 'btn', type: 'button', onclick: () => startStage(n) }, '↺ 이 스테이지 처음부터'),
    el('button', { class: 'btn', type: 'button', onclick: renderMap }, '🗺️ 지도로'),
    el('button', { class: 'btn', type: 'button', onclick: renderStart }, '🏠 처음 화면'));
  show(el('section', null,
    el('div', { class: 'panel center' },
      el('h2', { tabindex: '-1' }, s.emoji + ' ' + s.n + '단계 결과' + (normal ? '' : ' (복습)')),
      el('div', { class: 'big' }, st.score + '점'),
      record && normal ? el('div', { class: 'fbhead' }, '🏅 새 최고 점수!') : null,
      el('div', { class: 'bigstars', role: 'img', 'aria-label': '별 3개 중 ' + stars + '개' }, starText(stars)),
      el('p', null, '정답 ' + st.right + ' / ' + st.total + (n === 3 ? '  (틀린 짝 찾기 ' + st.mistakes + '번)' : '') + '  ·  최대 연속 정답 ' + st.maxCombo),
      normal
        ? el('div', { class: 'stamps' }, el('div', { class: 'stamp big' }, el('div', null, el('b', null, s.emoji), '탐험 도장')))
        : el('p', { class: 'tip' }, '복습 모드라서 점수와 별은 기록되지 않아요.'),
      el('p', null, '칭호  ', el('span', { class: 'title-badge' }, tt.e + ' ' + tt.t), '  (별 ' + totalStars() + '/15)'),
      allDone && normal && n === 5 ? el('p', { class: 'fbbox good' }, '🎊 다섯 개의 탐험 도장을 모두 모았어요! 별을 더 모아 "문화유산 박사"에 도전해 보세요.') : null),
    el('div', { class: 'panel' }, el('h3', null, '📒 오답 노트'), notes),
    actions), 'h2');
}

/* ---------------- 시작 ---------------- */
$('#homeBtn').addEventListener('click', renderStart);
$('#mapBtn').addEventListener('click', renderMap);
$('#muteBtn').addEventListener('click', () => { save.muted = !save.muted; persist(); syncMute(); if (!save.muted) sfx('tap'); });
syncMute();
renderStart();
</script>
</body>
</html>
