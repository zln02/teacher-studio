<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 반 1인 1역할 정하기</title>
<style>
:root{
  --bg:#f5f3ec; --card:#ffffff; --ink:#1f2a27; --sub:#4d5b57; --line:#d9d5c7;
  --pri:#23695a; --pri-d:#1a5145; --pri-l:#e2f1ec; --warn:#8a4b00; --warn-bg:#fff3dc;
  --bad:#b42318; --bad-bg:#fdeceb; --ok:#14623a; --ok-bg:#e3f5ea; --focus:#1a56db;
}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#printArea{display:none}
header.top{background:var(--pri);color:#fff;padding:14px 20px}
header.top h1{margin:0;font-size:1.5rem}
header.top p{margin:2px 0 0;font-size:.9rem;opacity:.95}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 20px 0;max-width:1240px;margin:0 auto}
nav.tabs button{border:2px solid var(--line);border-bottom:none;background:#ebe7d9;padding:10px 16px;border-radius:12px 12px 0 0;cursor:pointer;font-weight:600;min-height:46px}
nav.tabs button[aria-current="step"]{background:var(--card);border-color:var(--pri);color:var(--pri-d)}
main{max-width:1240px;margin:0 auto;padding:0 20px 30px}
.panel{background:var(--card);border:2px solid var(--pri);border-radius:0 12px 12px 12px;padding:22px}
.panel h2{margin:0 0 6px;font-size:1.5rem}
.panel h3{margin:22px 0 8px;font-size:1.2rem}
.hint{color:var(--sub);margin:0 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 18px;border-radius:10px;border:2px solid var(--pri);background:#fff;color:var(--pri-d);font-weight:700;cursor:pointer}
.btn:hover{background:var(--pri-l)}
.btn.primary{background:var(--pri);color:#fff}
.btn.primary:hover{background:var(--pri-d)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.big{font-size:1.25rem;padding:12px 28px;min-height:54px}
.btn.small{min-height:36px;padding:4px 12px;font-size:.95rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.spacer{flex:1}
textarea.names{width:100%;min-height:300px;border:2px solid var(--line);border-radius:10px;padding:12px;font-size:1.1rem;resize:vertical}
input[type=text],input[type=number],select{border:2px solid var(--line);border-radius:8px;padding:7px 10px;min-height:42px;background:#fff;max-width:100%}
.box{border-radius:10px;padding:12px 16px;margin:12px 0;border:2px solid var(--line);background:#faf9f4}
.box.ok{background:var(--ok-bg);border-color:#8fcfa8;color:var(--ok)}
.box.warn{background:var(--warn-bg);border-color:#e5b660;color:var(--warn)}
.box.bad{background:var(--bad-bg);border-color:#e49a94;color:var(--bad);font-weight:600}
.box.demo{background:var(--pri-l);border-color:var(--pri);text-align:center;padding:22px}
.count{font-size:1.3rem;font-weight:800}
.scroll{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:#f0ede2;font-size:.95rem;white-space:nowrap}
td input[type=text]{width:100%}
td input.cap{width:80px}
.roletbl td:nth-child(2){width:110px}
.roletbl td:nth-child(1){min-width:170px}
.roletbl td:nth-child(3){min-width:260px}
.bad-in{border-color:var(--bad)!important;background:var(--bad-bg)}
.modes{display:grid;gap:10px;margin:10px 0}
.mode{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.mode:has(input:checked){border-color:var(--pri);background:var(--pri-l)}
.mode input{width:22px;height:22px;margin-top:4px;flex:none}
.mode b{display:block;font-size:1.1rem}
.mode span{color:var(--sub)}
.seedbox{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seedbox input{width:190px;font-size:1.4rem;font-weight:800;letter-spacing:.08em;text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin:12px 0}
.rcard{border:2px solid var(--pri);border-radius:12px;background:#fbfdfc;padding:12px 14px}
.rcard.none{border-color:var(--bad);background:var(--bad-bg)}
.rname{font-size:1.2rem;font-weight:800;color:var(--pri-d)}
.rcap{font-size:.9rem;color:var(--sub)}
.rmem{list-style:none;margin:8px 0 0;padding:0}
.rmem li{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:1.6rem;font-weight:800;padding:3px 0;border-top:1px dashed var(--line)}
.rmem li:first-child{border-top:none}
.vacant{color:var(--warn);font-weight:600;margin-top:6px}
.badge{display:inline-block;font-size:.85rem;font-weight:700;border-radius:999px;padding:1px 10px;white-space:nowrap;border:1.5px solid}
.b1{background:#e3f5ea;color:#14623a;border-color:#14623a}
.b2{background:#e6efff;color:#1d4ba3;border-color:#1d4ba3}
.b3{background:#f0e8ff;color:#5b34a0;border-color:#5b34a0}
.b0{background:#fff3dc;color:#8a4b00;border-color:#8a4b00}
.bn{background:#eee;color:#444;border-color:#777}
.bx{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.stu td.nm{font-size:1.4rem;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}
.stat{border:2px solid var(--line);border-radius:10px;padding:8px 12px;text-align:center;background:#fff}
.stat .n{font-size:1.9rem;font-weight:800;line-height:1.1}
.stat .l{font-size:.95rem;color:var(--sub)}
details.log{border:2px solid var(--line);border-radius:10px;padding:8px 14px;margin:14px 0;background:#faf9f4}
details.log summary{cursor:pointer;font-weight:700;padding:6px 0}
.logbox{max-height:420px;overflow:auto;font-size:.98rem}
.logbox p{margin:6px 0;padding-left:10px;border-left:4px solid var(--line)}
.logbox p.head{font-weight:800;border-left-color:var(--pri);margin-top:14px}
.logbox p.lot{border-left-color:#d38b00}
.logbox p.manual{border-left-color:var(--bad);color:var(--bad);font-weight:700}
.seg{display:inline-flex;border:2px solid var(--pri);border-radius:10px;overflow:hidden}
.seg button{border:none;background:#fff;padding:8px 18px;cursor:pointer;font-weight:700;min-height:42px}
.seg button[aria-pressed=true]{background:var(--pri);color:#fff}
#overlay{position:fixed;inset:0;background:rgba(18,40,35,.94);color:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
#overlay .seedtxt{font-size:1.3rem;opacity:.9}
#overlay .shuf{font-size:clamp(3rem,10vw,6.5rem);font-weight:900;min-height:1.3em;margin:14px 0}
#overlay .shuf.lock{color:#ffe08a}
#overlay .prog{font-size:1.2rem;margin-bottom:10px}
#overlay ul{list-style:none;padding:0;margin:8px 0 18px;font-size:1.3rem;min-height:8.5em}
#overlay .btn{background:#fff}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f2a27;color:#fff;padding:10px 20px;border-radius:10px;z-index:60;display:none;max-width:90vw}
footer.util{max-width:1240px;margin:0 auto;padding:0 20px 40px}
footer.util .row{border-top:2px solid var(--line);padding-top:14px}
.small{font-size:.92rem;color:var(--sub)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.pp-title{text-align:center;font-size:30pt;margin:0}
.pp-sub{text-align:center;font-size:16pt;margin:4px 0 14px}
.pp-table{width:100%;border-collapse:collapse;font-size:15pt}
.pp-table th,.pp-table td{border:1.5px solid #000;padding:6px 10px;color:#000;background:#fff}
.pp-table th{background:#eee}
@media print{
  body{background:#fff}
  body > *:not(#printArea){display:none!important}
  #printArea{display:block}
  .pp-table tr{break-inside:avoid}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<header class="top">
  <h1>우리 반 1인 1역할 정하기</h1>
  <p>학생 이름과 희망은 이 컴퓨터의 브라우저에만 저장돼요. 인터넷으로 전송되지 않아요.</p>
</header>
<nav class="tabs" id="tabs" aria-label="단계"></nav>
<main><div class="panel" id="view" tabindex="-1"></div></main>
<footer class="util">
  <div class="row">
    <button class="btn small" id="btnBackup">전체 백업 파일 저장(JSON)</button>
    <button class="btn small" id="btnRestore">백업 불러오기</button>
    <input type="file" id="fileRestore" accept=".json,application/json" hidden>
    <button class="btn small danger" id="btnReset">전부 초기화</button>
    <span class="small">백업 파일에는 학생 이름이 들어 있으니 보관에 주의하세요.</span>
  </div>
</footer>
<div id="toast" role="status" aria-live="polite"></div>
<div id="printArea"></div>

<script>
"use strict";
// ==== PURE START (DOM 없는 배정 로직) ====
function hashSeed(seed){
  const s=String(seed==null?'':seed).trim();
  if(/^\d{1,15}$/.test(s)) return (Number(s)%4294967296)>>>0;
  let h=2166136261>>>0;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
  return h>>>0;
}
function mulberry32(a){
  return function(){
    a|=0;a=(a+0x6D2B79F5)|0;
    let t=Math.imul(a^(a>>>15),1|a);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return((t^(t>>>14))>>>0)/4294967296;
  };
}
function shuffle(arr,rng){ // Fisher-Yates
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}
function rankOf(prefList,roleId){
  if(!Array.isArray(prefList)||prefList.length===0) return null;
  const i=prefList.indexOf(roleId);
  return i>=0&&i<3?i+1:0;
}
function computeStats(assignments,lotteryRoles){
  const c={r1:0,r2:0,r3:0,out:0,none:0,unassigned:0};
  assignments.forEach(a=>{
    if(a.roleId==null){c.unassigned++;return;}
    if(a.rank===1)c.r1++;else if(a.rank===2)c.r2++;else if(a.rank===3)c.r3++;
    else if(a.rank===0)c.out++;else c.none++;
  });
  return {counts:c,lotteryRoles:lotteryRoles==null?null:lotteryRoles,total:assignments.length};
}
function parseNames(text){
  const names=[];
  String(text||'').split(/\r?\n/).forEach(line=>{
    let cells=line.split('\t').map(c=>c.trim()).filter(c=>c!==''&&!/^\d+$/.test(c));
    let n=cells[0];
    if(!n)return;
    n=n.replace(/^\d+\s*(번|[.)\]:,\-])?\s*/,'').replace(/\s+/g,' ').trim();
    if(n)names.push(n);
  });
  const seen={},dups=[];
  names.forEach(n=>{seen[n]=(seen[n]||0)+1;if(seen[n]===2)dups.push(n);});
  return {names,dups};
}
const MODE_LABEL={pref:'희망 반영 추첨',random:'완전 무작위 추첨',rotate:'순환(돌아가며)'};
function assign(input){
  input=input||{};
  const students=(Array.isArray(input.students)?input.students:[]).filter(s=>s&&s.id!=null&&String(s.name==null?'':s.name).trim()!=='');
  const roles=[];const rseen={};
  (Array.isArray(input.roles)?input.roles:[]).forEach(r=>{
    if(!r||r.id==null||rseen[r.id])return;
    const cap=Math.floor(Number(r.cap));
    if(!(cap>=1)||String(r.name==null?'':r.name).trim()==='')return;
    rseen[r.id]=1;roles.push({id:r.id,name:String(r.name).trim(),cap:cap});
  });
  const mode=MODE_LABEL[input.mode]?input.mode:'pref';
  const avoid=!!(input.options&&input.options.avoidRepeat);
  const rng=mulberry32(hashSeed(input.seed));
  const roleById={};roles.forEach(r=>{roleById[r.id]=r;});
  const prefsIn=input.prefs&&typeof input.prefs==='object'?input.prefs:{};
  const prefs={};
  students.forEach(s=>{
    const raw=Array.isArray(prefsIn[s.id])?prefsIn[s.id]:[];
    const out=[];
    raw.forEach(id=>{if(id!=null&&roleById[id]&&out.indexOf(id)<0)out.push(id);});
    prefs[s.id]=out.slice(0,3);
  });
  // 이력 분석
  const done={},unmet={};let hasHistory=false;
  (Array.isArray(input.history)?input.history:[]).forEach(rec=>{
    if(!rec||!Array.isArray(rec.assignments))return;
    rec.assignments.forEach(a=>{
      if(!a||a.studentId==null)return;
      if(a.roleId!=null){(done[a.studentId]=done[a.studentId]||{})[a.roleId]=1;hasHistory=true;}
      if(a.rank===0)unmet[a.studentId]=(unmet[a.studentId]||0)+1;
    });
  });
  const did=(s,rid)=>!!(done[s.id]&&done[s.id][rid]);
  const um=s=>unmet[s.id]||0;
  const rem={};roles.forEach(r=>{rem[r.id]=r.cap;});
  const got={}; // studentId -> {roleId,how}
  const log=[];const L=(kind,text)=>log.push({kind,text});
  const nm=list=>list.map(s=>s.name).join(', ');
  const give=(s,rid,how)=>{got[s.id]={roleId:rid,how};rem[rid]--;};
  const totalCap=roles.reduce((a,r)=>a+r.cap,0);
  L('head','추첨 시작 — 추첨 번호 '+String(input.seed==null?'':input.seed).trim()+' · 방식 '+MODE_LABEL[mode]+' · 학생 '+students.length+'명 · 총 정원 '+totalCap+'명'+(avoid?' · 이전에 한 역할 양보/피하기 켬':'')+(hasHistory?'':' · 지난 기록 없음'));
  if(students.length>totalCap)L('info','정원이 학생 수보다 '+(students.length-totalCap)+'자리 부족해서 일부 학생은 배정되지 못해요.');
  let lotteryRoles=null;
  const freeSlots=()=>{const a=[];roles.forEach(r=>{for(let i=0;i<rem[r.id];i++)a.push(r.id);});return a;};
  function fillRandom(list,preferNew,label){
    if(list.length===0)return;
    L('head',label);
    shuffle(list,rng).forEach(s=>{
      const slots=freeSlots();
      if(slots.length===0){L('info',s.name+' — 남은 자리가 없어 미배정');return;}
      let cand=slots,note='';
      if(preferNew){
        const nw=slots.filter(rid=>!did(s,rid));
        if(nw.length>0&&nw.length<slots.length){cand=nw;note=' (안 해 본 역할 우선)';}
        else if(nw.length===0&&hasHistory){note=' (안 해 본 역할이 남아 있지 않아 반복)';}
      }
      const rid=cand[Math.floor(rng()*cand.length)];
      give(s,rid,'random');
      L('fill',s.name+' → '+roleById[rid].name+note);
    });
  }
  if(mode==='pref'){
    lotteryRoles=0;const lotSet={};
    for(let round=0;round<3;round++){
      const rname=(round+1)+'지망 라운드';
      let headDone=false;const H=()=>{if(!headDone){L('head','['+rname+']');headDone=true;}};
      roles.forEach(role=>{
        const cands=students.filter(s=>!got[s.id]&&prefs[s.id][round]===role.id);
        if(cands.length===0)return;
        H();
        const left=rem[role.id];
        if(left<=0){L('round',rname+': '+role.name+' — 지원 '+cands.length+'명이지만 정원이 이미 찼어요 → 다음 지망으로 (대상: '+nm(cands)+')');return;}
        if(cands.length<=left){
          cands.forEach(s=>give(s,role.id,'r'+(round+1)));
          L('round',rname+': '+role.name+' — 지원 '+cands.length+'명, 남은 정원 '+left+'명 → 추첨 없이 전원 확정: '+nm(cands));
          return;
        }
        // 추첨
        const keyOf=s=>um(s)*2+(avoid&&did(s,role.id)?0:1); // 클수록 우선
        const groups={};cands.forEach(s=>{(groups[keyOf(s)]=groups[keyOf(s)]||[]).push(s);});
        const keys=Object.keys(groups).map(Number).sort((a,b)=>b-a);
        const label=k=>{const u=Math.floor(k/2),fresh=k%2===1;return '못 이룬 희망 '+u+'회'+((avoid&&!fresh)?'·이전에 한 역할':'');};
        const tierTxt=keys.map(k=>label(k)+'('+nm(groups[k])+')').join(' > ');
        const winners=[];let need=left,drawn=null;
        for(const k of keys){
          const g=groups[k];
          if(g.length<=need){g.forEach(s=>winners.push(s));need-=g.length;}
          else{const sh=shuffle(g,rng);sh.slice(0,need).forEach(s=>winners.push(s));drawn=label(k);need=0;}
          if(need===0)break;
        }
        winners.forEach(s=>give(s,role.id,'r'+(round+1)));
        lotSet[role.id]=1;
        L('lot',rname+': '+role.name+' — 지원 '+cands.length+'명, 정원 '+left+'명 → 추첨(우선 등급: '+(keys.length>1?tierTxt:'모두 같은 등급')+(drawn?'; "'+drawn+'" 등급 안에서 무작위':'')+') → 당첨 '+nm(winners));
      });
      if(!headDone)L('info','['+rname+'] 해당하는 지원이 없어요.');
    }
    lotteryRoles=Object.keys(lotSet).length;
    const rest=students.filter(s=>!got[s.id]);
    if(rest.length>0)fillRandom(rest,true,'[남은 학생 무작위 배정] 희망이 없거나 희망 자리를 얻지 못한 '+rest.length+'명을 남은 자리에 배정해요 (가능하면 안 해 본 역할로)');
    else L('info','[남은 학생] 없음 — 모두 희망한 역할을 맡았어요.');
  }else if(mode==='random'||(mode==='rotate'&&!hasHistory)){
    if(mode==='rotate')L('info','지난 배정 기록이 없어 완전 무작위와 같게 진행해요.');
    fillRandom(students.slice(),avoid&&mode==='random',mode==='random'?'[완전 무작위 배정] 희망은 보지 않아요':'[무작위 배정]');
  }else{ // rotate with history
    L('head','[순환 배정] 각 학생이 아직 안 해 본 역할을 최대한 맡도록 짝지어요');
    const order=shuffle(students,rng);
    const slots=shuffle(freeSlots(),rng);
    const slotOwner=new Array(slots.length).fill(null);
    const tryS=(si,seen)=>{
      const s=order[si];
      for(let k=0;k<slots.length;k++){
        if(seen[k]||did(s,slots[k]))continue;
        seen[k]=true;
        if(slotOwner[k]===null||tryS(slotOwner[k],seen)){slotOwner[k]=si;return true;}
      }
      return false;
    };
    for(let si=0;si<order.length;si++)tryS(si,{});
    const matched={};
    slotOwner.forEach((si,k)=>{if(si!==null)matched[si]=k;});
    const usedSlot={};
    order.forEach((s,si)=>{
      if(matched[si]!==undefined){usedSlot[matched[si]]=1;give(s,slots[matched[si]],'rotate');L('fill',s.name+' → '+roleById[slots[matched[si]]].name+' (안 해 본 역할)');}
    });
    order.forEach((s,si)=>{
      if(matched[si]!==undefined)return;
      let k=-1;for(let j=0;j<slots.length;j++){if(!usedSlot[j]){k=j;break;}}
      if(k<0){L('info',s.name+' — 남은 자리가 없어 미배정');return;}
      usedSlot[k]=1;give(s,slots[k],'rotate');
      L('fill',s.name+' → '+roleById[slots[k]].name+' (안 해 본 역할을 모두 채울 수 없어 이전에 한 역할 반복)');
    });
  }
  const assignments=students.map(s=>{
    const g=got[s.id];const roleId=g?g.roleId:null;
    return {studentId:s.id,roleId:roleId,rank:roleId==null?null:rankOf(prefs[s.id],roleId),how:g?g.how:'none'};
  });
  const stats=computeStats(assignments,lotteryRoles);
  stats.totalCap=totalCap;
  return {assignments,log,stats};
}

// ---------- helpers ----------
function h(tag,attrs,...kids){
  const e=document.createElement(tag);let val;
  if(attrs)for(const k in attrs){
    const v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='text')e.textContent=v;
    else if(k==='value')val=v;
    else if(k==='checked')e.checked=true;
    else if(k==='disabled')e.disabled=true;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat(2)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}
  if(val!==undefined)e.value=val;
  return e;
}

function syncStudents(names){
  const old=state.students;const pool={};
  old.forEach((s,i)=>{(pool[s.name]=pool[s.name]||[]).push(i);});
  const used={};const res=new Array(names.length);
  names.forEach((n,i)=>{if(pool[n]&&pool[n].length){const oi=pool[n].shift();used[oi]=1;res[i]={id:old[oi].id,name:n};}});
  names.forEach((n,i)=>{
    if(res[i])return;
    if(old[i]&&!used[i]){used[i]=1;res[i]={id:old[i].id,name:n};} // 이름 고침 → 같은 학생으로 간주
    else res[i]={id:uid('s'),name:n};
  });
  state.students=res;
}

  const rng=mulberry32(20241104);
  const w=state.roles.map((r,i)=>[0,1,3,8].indexOf(i)>=0?5:1);
  state.students.forEach((s,i)=>{
    const x=rng();if(x<0.15)return; // 15%는 비워 둠
    const n=x<0.3?1:3;const list=[];
    let guard=0;
    while(list.length<n&&guard++<200){
      const tot=w.reduce((a,b)=>a+b,0);let t=rng()*tot,k=0;
      for(;k<w.length;k++){t-=w[k];if(t<0)break;}
      k=Math.min(k,w.length-1);
      const id=state.roles[k].id;if(list.indexOf(id)<0)list.push(id);
    }

function autoFit(){
  const n=state.students.length;let guard=0;
  const vr=()=>state.roles.filter(r=>String(r.name).trim()!==''&&Math.floor(Number(r.cap))>=1);
  if(vr().length===0)return;
  while(totalCap()<n&&guard++<5000){
    const list=vr();let min=Infinity;list.forEach(r=>{min=Math.min(min,Math.floor(Number(r.cap)));});
    const tgt=list.find(r=>Math.floor(Number(r.cap))===min);tgt.cap=Math.floor(Number(tgt.cap))+1;
  }
  save();render();toast('정원을 학생 수에 맞췄어요.');
}

    assignments:res.assignments,log:res.log,stats:res.stats,

function animateDraw(cur,done){
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rIdx={};cur.roles.forEach((r,i)=>{rIdx[r.id]=i;});
  const nameOf={};cur.studentOrder.forEach(s=>{nameOf[s.id]=s.name;});
  const roleName={};cur.roles.forEach(r=>{roleName[r.id]=r.name;});
  const seq=cur.assignments.map((a,i)=>({a,i})).filter(x=>x.a.roleId!=null).sort((x,y)=>(rIdx[x.a.roleId]-rIdx[y.a.roleId])||(x.i-y.i)).map(x=>x.a);
  if(reduce||seq.length===0){done();return;}
  const pool=cur.studentOrder.map(s=>s.name);
  const shuf=h('div',{class:'shuf','aria-hidden':'true',text:'?'});
  const prog=h('div',{class:'prog'});const ul=h('ul');
  const skip=h('button',{class:'btn',type:'button',text:'애니메이션 건너뛰기'});
  const ov=h('div',{id:'overlay',role:'dialog','aria-modal':'true','aria-label':'추첨 중'},
    h('div',{class:'seedtxt',text:'추첨 번호 '+cur.seed}),shuf,prog,ul,skip);
  document.body.append(ov);
  let i=0,k=0,spin=null,t1=null,t2=null,fin=false;
  const per=Math.max(120,Math.min(520,6500/seq.length));
  function finish(){if(fin)return;fin=true;clearInterval(spin);clearTimeout(t1);clearTimeout(t2);ov.remove();done();}
  skip.addEventListener('click',finish);
  function next(){
    if(i>=seq.length){t2=setTimeout(finish,500);return;}
    const a=seq[i];
    prog.textContent=(i+1)+' / '+seq.length;
    shuf.classList.remove('lock');
    spin=setInterval(()=>{k=(k+7)%pool.length;shuf.textContent=pool[k];},60);
    t1=setTimeout(()=>{
      clearInterval(spin);shuf.textContent=nameOf[a.studentId]||'';shuf.classList.add('lock');
      ul.append(h('li',{text:(roleName[a.roleId]||'')+' ← '+(nameOf[a.studentId]||'')}));
      while(ul.children.length>5)ul.removeChild(ul.firstChild);
      i++;t2=setTimeout(next,per*0.4);
    },per*0.6);
  }
  skip.focus();next();
}
function vmFromCurrent(c){

  const rows=c.studentOrder.map((s,i)=>{const a=aBy[s.id]||{roleId:null,rank:null};

      const v=period.value.trim();if(!v){msg.textContent='기간 이름을 적어 주세요. (예: 11월 4주)';period.focus();return;}
      if(k.unassigned&&!confirm('미배정 학생이 있어요. 그래도 기록에 저장할까요?'))return;
      saveCurrent(v);render();toast('기록에 저장했어요.');},text:saved?'기록에 저장됨':'이 결과 확정하고 기록에 저장'}),msg),
    h('p',{class:'small',text:'확정하면 다음 추첨의 "지난 기록"(우선 등급, 양보)에 반영돼요. 확정하기 전에는 반영되지 않아요.'}));
  sec.append(renderLog(c.log));
  return sec;
}

// ---------- 5. 지난 기록 ----------
function viewHistory(){
  const root=h('div',null,h('h2',{text:'지난 기록'}),h('p',{class:'hint',text:'확정해서 저장한 회차만 여기에 나타나요. 다음 추첨에서 "희망을 못 이룬 횟수"와 "이전에 한 역할"을 계산하는 데 쓰여요.'}));
  const H=state.history;
  if(H.length===0){root.append(h('div',{class:'box warn',text:'아직 확정된 기록이 없어요. 4단계에서 결과를 확정하면 여기에 쌓여요.'}),navRow(4,null));return root;}
  const list=h('div',{class:'scroll'},h('table',null,h('thead',null,h('tr',null,h('th',{text:'회차'}),h('th',{text:'날짜'}),h('th',{text:'방식'}),h('th',{text:'추첨 번호'}),h('th',{text:''}))),
    h('tbody',null,H.map((r,i)=>h('tr',null,h('td',{text:(i+1)+'. '+r.label}),h('td',{text:r.createdAt?r.createdAt.slice(0,10):''}),h('td',{text:MODE_LABEL[r.mode]}),h('td',{text:r.seed}),
      h('td',null,h('button',{class:'btn small',type:'button',onclick:()=>{ui.histView=r.id;render();},text:'보기'}),' ',
        h('button',{class:'btn small danger',type:'button',onclick:()=>{if(confirm('"'+r.label+'" 기록을 삭제할까요? 되돌릴 수 없어요.')){state.history=state.history.filter(x=>x!==r);if(ui.histView===r.id)ui.histView=null;state.current&&state.current.savedId===r.id&&(state.current.savedId=null);save();render();}},text:'삭제'})))))));
  root.append(list);
  const rec=H.find(r=>r.id===ui.histView);
  if(rec){
    const vm=vmFromRecord(rec);
    root.append(h('h3',{text:'"'+rec.label+'" 결과'}),h('p',{class:'small',text:'추첨 번호 '+rec.seed+' · '+MODE_LABEL[rec.mode]}),
      exportBar(vm,rec.label,'1인1역할_'+rec.label.replace(/[\\\/:*?"<>|]/g,'_')),
      vm.roles.length?renderRoleCards(vm):'',renderLog(rec.log));
  }
  // 학생 x 회차
  const ids=[],nm={};
  state.students.forEach(s=>{ids.push(s.id);nm[s.id]=s.name;});
  H.forEach(r=>r.assignments.forEach(a=>{if(nm[a.studentId]===undefined){ids.push(a.studentId);nm[a.studentId]=a.studentName+' (명단에 없음)';}}));
  const head=h('tr',null,h('th',{text:'이름'}),H.map(r=>h('th',{text:r.label})));
  const body=ids.map(id=>h('tr',null,h('td',{text:nm[id],style:'font-weight:700'}),H.map(r=>{
    const a=r.assignments.find(x=>x.studentId===id);
    return h('td',null,a?[a.roleId==null?'(미배정)':a.roleName,' ',a.roleId==null?null:badge(a.rank,a.roleId)]:'-');})));
  root.append(h('h3',{text:'학생 × 회차 이력'}),h('div',{class:'scroll'},h('table',null,h('thead',null,head),h('tbody',null,body))),navRow(4,null));
  return root;
}

// ---------- 백업 / 초기화 ----------
document.getElementById('btnBackup').addEventListener('click',()=>{download('1인1역할_백업_'+dateStr()+'.json',JSON.stringify(state,null,1),'application/json');toast('백업 파일을 저장했어요.');});
document.getElementById('btnRestore').addEventListener('click',()=>document.getElementById('fileRestore').click());
document.getElementById('fileRestore').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{const ns=sanitizeState(JSON.parse(rd.result));
      if(!confirm('현재 내용을 모두 이 백업으로 바꿀까요?'))return;
      state=ns;ui.histView=null;save();render();toast('백업을 불러왔어요.');}
    catch(err){alert('백업 파일을 읽을 수 없어요. 이 도구에서 저장한 JSON 파일인지 확인해 주세요.');}
  };
  rd.onerror=()=>alert('파일을 읽지 못했어요.');
  rd.readAsText(f,'utf-8');
});
document.getElementById('btnReset').addEventListener('click',()=>{
  if(!confirm('학생·역할·희망·지난 기록을 전부 지울까요? 되돌릴 수 없어요. (먼저 백업을 저장해 두세요)'))return;
  if(!confirm('정말 전부 초기화할까요?'))return;
  state=defaultState();ui.histView=null;try{localStorage.removeItem(KEY);}catch(e){}render();toast('초기화했어요.');
});
window.addEventListener('beforeunload',saveNow);

load();
if(!state.settings.seed)state.settings.seed=newSeed();
render();
</script>
