  Single-file classroom game engine: 1920x1080 stage, scenes, touch input,

  teacher controls and test hooks. ES2017-safe (no ?. ?? #private).

<style>
:root{
  --bg1:#0b1026;--bg2:#1b2a6b;--primary:#eece73;--accent:#7be0f2;--good:#76dca9;--bad:#ff5a5f;
  --text:#ffffff;--muted:rgba(255,255,255,.72);--card:rgba(255,255,255,.10);--cardBorder:rgba(255,255,255,.28);
  --cardText:#ffffff;--btnText:#1a1a1a;--glow:none;
  --font-display:"TS Sans","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"TS Sans","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans CJK KR",sans-serif;
  --radius:28px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05060f;overscroll-behavior:none}
body{font-family:var(--font-body);color:var(--text);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2))}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;touch-action:none}
#bg,#fx{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#fx{z-index:40}
#scene{position:absolute;left:0;top:0;width:100%;height:100%;z-index:10}
#hud{position:absolute;left:0;top:0;width:100%;height:100%;z-index:30;pointer-events:none}
#hud>*{pointer-events:auto}
#overlay{position:absolute;left:0;top:0;width:100%;height:100%;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
#overlay.show{display:flex}
.screen{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.screen>*+*{margin-top:24px}
.screen>.abs,.screen>[style*="position:absolute"],.screen>[style*="position: absolute"]{margin-top:0}
.title{font-family:var(--font-display);font-size:150px;line-height:1.05;text-align:center;letter-spacing:2px;color:var(--text);text-shadow:0 8px 0 rgba(0,0,0,.25),var(--glow)}
.title .ch{display:inline-block;animation:chIn .6s cubic-bezier(.34,1.56,.64,1) both}
.title{-webkit-text-stroke:0;paint-order:stroke fill}
.shine{position:relative;overflow:hidden}
.shine:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out 1.2s infinite}
@keyframes shine{0%{left:-60%}35%,100%{left:130%}}
.mascot{position:absolute;pointer-events:none}
.ng-char{overflow:visible}.ng-char *{transform-box:fill-box;transform-origin:center}
.vignette{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,var(--vig,.35)) 100%)}
.subtitle{font-size:46px;color:var(--text);opacity:.8;font-weight:700;text-align:center}
.h1{font-family:var(--font-display);font-size:96px;text-align:center;line-height:1.15}
.h2{font-family:var(--font-display);font-size:64px;text-align:center;line-height:1.2}
.big{font-size:56px;font-weight:900}
.btn{font-family:var(--font-display);font-size:56px;padding:26px 72px;min-width:240px;min-height:110px;border:none;border-radius:999px;background:var(--primary);color:var(--btnText);cursor:pointer;box-shadow:0 10px 0 rgba(0,0,0,.28),0 0 0 6px rgba(255,255,255,.18);transition:transform .08s ease-out,box-shadow .08s ease-out;touch-action:manipulation}
.btn:active,.btn.pressed{transform:translateY(6px) scale(.97);box-shadow:0 4px 0 rgba(0,0,0,.28),0 0 0 6px rgba(255,255,255,.18)}
.btn.secondary{background:rgba(255,255,255,.16);color:var(--text);box-shadow:0 10px 0 rgba(0,0,0,.25),inset 0 0 0 4px var(--cardBorder)}
.btn.small{font-size:38px;padding:16px 40px;min-height:84px;min-width:0}
.pulse{animation:pulse 1.4s ease-in-out infinite}
.card{background:var(--card);border:4px solid var(--cardBorder);border-radius:var(--radius);color:var(--cardText);box-shadow:0 8px 0 rgba(0,0,0,.22)}
.row{display:flex;flex-direction:row;align-items:center;justify-content:center}
.row>*+*{margin-left:28px}
.choice{font-family:var(--font-body);font-weight:900;font-size:46px;line-height:1.2;min-height:130px;padding:18px 32px;border-radius:var(--radius);border:5px solid var(--cardBorder);background:var(--card);color:var(--cardText);box-shadow:0 8px 0 rgba(0,0,0,.25);cursor:pointer;display:flex;align-items:center;justify-content:flex-start;text-align:left;transition:transform .08s ease-out,background .2s,border-color .2s}
.choice .mark{flex:0 0 auto;width:78px;height:78px;border-radius:50%;margin-right:28px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:52px;color:var(--btnText);background:var(--primary)}
.choice:active{transform:scale(.97)}
.choice.correct{background:var(--good);border-color:#fff;color:#08301f!important;box-shadow:0 0 40px var(--good)}
.choice.wrong{background:var(--bad);border-color:#fff;color:#fff!important}
.choice.dim{opacity:.35}
.badge{position:absolute;font-family:var(--font-display);font-size:120px;padding:10px 60px;border-radius:999px;color:#fff;white-space:nowrap;pointer-events:none;z-index:45}
.badge.good{background:var(--good);color:#08301f;box-shadow:0 0 60px var(--good)}
.badge.bad{background:var(--bad);box-shadow:0 0 60px var(--bad)}
.badge.info{background:var(--primary);color:var(--btnText);box-shadow:0 0 60px var(--primary)}
.toast{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);font-size:44px;font-weight:900;padding:18px 44px;border-radius:999px;background:rgba(0,0,0,.65);color:#fff;z-index:46;pointer-events:none}
.float{position:absolute;font-family:var(--font-display);font-size:72px;pointer-events:none;z-index:44;text-shadow:0 4px 0 rgba(0,0,0,.35)}
/* HUD */
.hud-top{position:absolute;left:0;top:0;width:100%;height:120px;display:flex;align-items:center;justify-content:space-between;padding:0 36px}
.hud-progress{position:absolute;left:0;top:0;height:12px;background:var(--accent);box-shadow:var(--glow);transition:width .4s ease-out}
.icon-btn{width:88px;height:88px;border-radius:50%;border:none;background:rgba(0,0,0,.35);color:#fff;font-size:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-left:16px}
.icon-btn:active{transform:scale(.92)}
.scoreboard{display:flex;flex-direction:row}
.team{display:flex;align-items:center;padding:10px 26px 10px 14px;border-radius:999px;background:rgba(0,0,0,.35);margin-right:16px;border:4px solid transparent;transition:transform .2s,border-color .2s}
.team.turn{border-color:#fff;transform:scale(1.08);box-shadow:0 0 30px rgba(255,255,255,.5)}
.team .dot{width:54px;height:54px;border-radius:50%;margin-right:14px;display:flex;align-items:center;justify-content:center;font-size:34px}
.team .tname{font-size:32px;font-weight:900;margin-right:16px}
.team .tscore{font-family:var(--font-display);font-size:52px;min-width:70px;text-align:right}
.timer{position:absolute;left:50%;top:104px;transform:translateX(-50%);width:900px;height:20px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden}
.timer>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--good),var(--primary));border-radius:999px;transform-origin:0 50%}
.timer.warn>i{background:var(--bad);animation:blink .5s steps(2) infinite}
.timer-num{position:absolute;left:1430px;top:82px;font-family:var(--font-display);font-size:44px;line-height:1}
.combo{position:absolute;right:48px;top:106px;font-family:var(--font-display);font-size:44px;color:var(--primary);text-shadow:var(--glow)}
/* teacher panel */
.panel{width:1100px;padding:56px;border-radius:40px;background:#141a33;border:4px solid rgba(255,255,255,.2);color:#fff}
.panel h3{font-family:var(--font-display);font-size:64px;margin-bottom:28px}
.panel .grid{display:grid;grid-template-columns:1fr 1fr;grid-gap:22px}
.panel .btn{font-size:40px;min-height:96px;padding:18px 24px;width:100%}
.panel .teamrow{display:flex;align-items:center;justify-content:space-between;font-size:40px;font-weight:900;margin-top:16px}
/* result */
.stars{font-size:150px;letter-spacing:20px}
.stars span{display:inline-block;opacity:.2;filter:grayscale(1)}
.stars span.on{opacity:1;filter:none;animation:starIn .5s cubic-bezier(.34,1.56,.64,1) both}
.bars{display:flex;align-items:flex-end;height:330px}
.bar{width:170px;margin:0 22px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.bar i{display:block;width:100%;border-radius:22px 22px 8px 8px;height:0;transition:height 1.1s cubic-bezier(.22,1,.36,1)}
.bar b{font-family:var(--font-display);font-size:56px;margin-bottom:10px}
.bar span{font-size:32px;font-weight:900;margin-top:12px;white-space:nowrap}
.review{width:1500px;max-height:230px;overflow:auto;padding:24px 36px;text-align:left}
.review li{font-size:30px;line-height:1.4;margin:6px 0 6px 36px}

/* ===== SKINS: each theme changes shapes, frames, type and texture — not only colors ===== */
/* arcade: CRT scanlines, square pixel frames, hard offset shadows, neon */
[data-skin="arcade"] .card,[data-skin="arcade"] .choice{border-radius:6px;border-width:6px;box-shadow:8px 8px 0 #000,0 0 22px var(--accent)}
[data-skin="arcade"] .btn{border-radius:6px;box-shadow:8px 8px 0 #000;text-transform:none}
[data-skin="arcade"] .btn:active,[data-skin="arcade"] .btn.pressed{transform:translate(6px,6px);box-shadow:2px 2px 0 #000}
[data-skin="arcade"] .choice .mark{border-radius:4px}
[data-skin="arcade"] .title{color:var(--primary);text-shadow:6px 6px 0 var(--accent),12px 12px 0 #000}
[data-skin="arcade"] .team{border-radius:6px}
[data-skin="arcade"] #stage:after{content:"";position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:60;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 5px);mix-blend-mode:multiply}
/* hanok: hanji paper, ink borders, brush title, seal-stamp badges, dancheong bands */
[data-skin="hanok"] #app{background:#efe2c4}
[data-skin="hanok"] .card,[data-skin="hanok"] .choice{border-radius:10px;border:5px solid #2b2118;box-shadow:6px 6px 0 rgba(43,33,24,.25);background-image:radial-gradient(rgba(139,107,62,.10) 1px,transparent 1.5px),linear-gradient(#fffaf0,#fbf1dc);background-size:9px 9px,100% 100%}
[data-skin="hanok"] .choice .mark{border-radius:8px;background:#c8372d;color:#fff8e7;font-family:"Noto Serif KR",serif}
[data-skin="hanok"] .title{font-family:"Noto Serif KR","Noto Serif KR",serif;color:#2b2118;text-shadow:none;letter-spacing:12px}
[data-skin="hanok"] .h1,[data-skin="hanok"] .h2{font-family:"Noto Serif KR","Noto Serif KR",serif}
[data-skin="hanok"] .btn{border-radius:12px;background:#c8372d;color:#fff8e7;box-shadow:0 8px 0 #7d1f18}
[data-skin="hanok"] .btn.secondary{background:#fffaf0;color:#2b2118;box-shadow:0 8px 0 #8b6b3e,inset 0 0 0 4px #2b2118}
[data-skin="hanok"] .badge{border-radius:14px;transform-origin:center;border:8px double #fff8e7;font-family:"Noto Serif KR",serif}
[data-skin="hanok"] .badge.good{background:#c8372d;color:#fff8e7;box-shadow:none}
[data-skin="hanok"] .badge.bad{background:#2b2118;box-shadow:none}
[data-skin="hanok"] .team{background:rgba(43,33,24,.85);color:#fff8e7}
[data-skin="hanok"] .vignette{background:linear-gradient(90deg,#1f5f8b 0 14px,#c8372d 14px 28px,#2e8b57 28px 42px,#e8b04a 42px 56px,transparent 56px) top/100% 24px no-repeat,linear-gradient(90deg,#1f5f8b 0 14px,#c8372d 14px 28px,#2e8b57 28px 42px,#e8b04a 42px 56px,transparent 56px) bottom/100% 24px no-repeat;background-size:56px 18px;background-repeat:repeat-x}
/* ocean: white buoy cards, navy ink, wave shadows */
[data-skin="ocean"] .card,[data-skin="ocean"] .choice{border-radius:40px;border:5px solid #ffffff;background:rgba(255,255,255,.94);color:#0b3a5b;box-shadow:0 10px 0 #0a5c8a,0 18px 30px rgba(0,30,60,.35)}
[data-skin="ocean"] .choice .mark{background:#ff7a3d;color:#fff}
[data-skin="ocean"] .title{color:#fff;text-shadow:0 8px 0 #0a5c8a,0 0 40px rgba(120,220,255,.8)}
[data-skin="ocean"] .btn{background:#ff7a3d;color:#fff;box-shadow:0 10px 0 #b44a17}
[data-skin="ocean"] .team{background:rgba(255,255,255,.9);color:#0b3a5b}
/* detective: case-file manila cards, typewriter type, stamp badges */
[data-skin="detective"] .card,[data-skin="detective"] .choice{border-radius:4px;border:none;background:linear-gradient(#e9d7a8,#dcc48a);color:#2a2017;box-shadow:6px 8px 0 rgba(0,0,0,.45)}
[data-skin="detective"] .choice .mark{border-radius:50%;background:#8b1e1e;color:#f3e6c4}
[data-skin="detective"] .title{font-family:"Nanum Myeongjo","Noto Serif KR",serif;color:#e8b04a;text-shadow:0 4px 0 #000;letter-spacing:6px}
[data-skin="detective"] .badge{border-radius:6px;border:8px solid currentColor;background:transparent!important;box-shadow:none!important;transform-origin:center}
[data-skin="detective"] .badge.good{color:#69e3a0}[data-skin="detective"] .badge.bad{color:#ff6a5f}
/* fairytale: storybook — puffy rounded, dashed stitch borders */
[data-skin="fairytale"] .card,[data-skin="fairytale"] .choice{border-radius:46px;border:5px dashed #ff9ec7;box-shadow:0 10px 0 #ffc2dc}
[data-skin="fairytale"] .btn{border-radius:999px;box-shadow:0 10px 0 #e05e98}
/* sports: LED scoreboard digits, jersey stripes */
[data-skin="sports"] .card,[data-skin="sports"] .choice{border-radius:16px;border:6px solid #fff;box-shadow:0 8px 0 #073d1d}
[data-skin="sports"] .team .tscore{font-family:"TS Sans",monospace;color:#ffd400;text-shadow:0 0 12px #ffd400}
[data-skin] .choice.correct{background:var(--good)!important;border-color:#fff!important;color:#08301f!important}
[data-skin] .choice.wrong{background:var(--bad)!important;border-color:#fff!important;color:#fff!important}
@keyframes chIn{from{transform:translateY(-120px) scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes blink{50%{opacity:.45}}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
@keyframes floatIn{from{transform:translateY(40px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.enter{animation:floatIn .35s cubic-bezier(.22,1,.36,1) both}
@media (prefers-reduced-motion:reduce){.title .ch,.pulse,.enter,.stars span.on{animation:none!important}}
.reduce .title .ch,.reduce .pulse,.reduce .enter,.reduce .stars span.on{animation:none!important}
/* a phone held upright with a game that has no portrait layout: ask to turn it (outside the stage, always readable) */
body[data-rotate="1"] #app:after{content:"폰을 가로로 돌려 주세요 ↻";position:absolute;left:0;right:0;top:0;padding:14px 12px;text-align:center;font:700 18px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#fff;background:rgba(0,0,0,.78);z-index:99;pointer-events:none}
</style>

window.GAME = {
  title: "게임 제목",
  subtitle: "과목 · 단원",

<!--TS:VOICE-->
<script>
/* ===================== ENGINE (do not edit; extend via NG API) ===================== */
(function(){
"use strict";
var NG = window.NG = {};
var W = 1920, H = 1080;
var stage = document.getElementById("stage");
var sceneEl = document.getElementById("scene");
var hudEl = document.getElementById("hud");
var overlayEl = document.getElementById("overlay");
NG.W = W; NG.H = H; NG.el = {stage:stage, scene:sceneEl, hud:hudEl, overlay:overlayEl};

/* ---------- utils ---------- */
var U = NG.util = {
  $: function(sel, root){ return (root||document).querySelector(sel); },
  h: function(tag, attrs, html){
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs){ if (k === "class") e.className = attrs[k]; else if (k === "style") e.style.cssText = attrs[k]; else e.setAttribute(k, attrs[k]); }
    if (html != null) e.innerHTML = html;
    return e;
  },
  esc: function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); },
  rand: function(a, b){ return a + Math.random() * (b - a); },
  randInt: function(a, b){ return Math.floor(a + Math.random() * (b - a + 1)); },
  pick: function(arr){ return arr[Math.floor(Math.random() * arr.length)]; },
  shuffle: function(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; },
  clamp: function(v, a, b){ return v < a ? a : (v > b ? b : v); },
  lerp: function(a, b, t){ return a + (b - a) * t; },
  center: function(el){ var r = el.getBoundingClientRect(), s = NG.scale || 1, sr = stage.getBoundingClientRect(); return {x:(r.left + r.width/2 - sr.left)/s, y:(r.top + r.height/2 - sr.top)/s}; }
};
NG.store = {
  get: function(k, d){ try { var v = localStorage.getItem("ngs." + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set: function(k, v){ try { localStorage.setItem("ngs." + k, JSON.stringify(v)); } catch(e){} }
};

/* ---------- stage scaling ----------
   Landscape / board / tablet: a fixed 1920x1080 stage, letterboxed.
   Phone held upright (GAME.portrait = this game has a portrait layout): a portrait stage PW units wide and as tall as the screen
   (PW*vh/vw), so text stays >= 16 CSS px. body[data-orient="portrait"] switches the portrait CSS on. Never rotated. */
var PW = 600;
function fit(){
  var vw = window.innerWidth, vh = window.innerHeight, G = window.GAME || {};
  var phone = !!(G.spec && G.spec.device === "phone");
  var por = phone && G.portrait === true && vh > vw * 1.1;
  var nw = por ? PW : 1920, nh = por ? Math.max(PW, Math.min(1500, Math.round(PW * vh / vw))) : 1080;
  var s = por ? vw / PW : Math.min(vw / 1920, vh / 1080);
  if (por && nh * s > vh + 0.5) s = vh / nh;
  W = nw; H = nh; NG.W = W; NG.H = H; NG.scale = s; NG.portrait = por;
  stage.style.width = W + "px"; stage.style.height = H + "px";
  if (cvBg && (cvBg.width !== W || cvBg.height !== H)){ cvBg.width = W; cvBg.height = H; if (cvFx){ cvFx.width = W; cvFx.height = H; } }
  document.body.setAttribute("data-orient", por ? "portrait" : "landscape");
  document.body.setAttribute("data-rotate", (phone && !por && vh > vw * 1.1) ? "1" : "0");
  document.body.setAttribute("data-device", (phone && vw < 900) ? "phone" : ((G.spec && G.spec.device) || "board"));  /* phone rules only on a phone-sized screen */
  stage.style.transform = "translate(" + ((vw - W * s) / 2) + "px," + (por ? 0 : (vh - H * s) / 2) + "px) scale(" + s + ")";
}
var cvBg = document.getElementById("bg"), cvFx = document.getElementById("fx");
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", function(){ setTimeout(fit, 200); });
fit();
function noPinch(){ var G = window.GAME || {}; return !(G.spec && G.spec.device === "phone"); }  /* phones may zoom (WCAG 1.4.4) */
document.addEventListener("touchmove", function(e){ if (noPinch() && e.touches && e.touches.length > 1) e.preventDefault(); }, {passive:false});

/* ---------- clock (virtual time so advanceTime() can drive it) ---------- */
var clock = {t:0, timers:[], manual:false};
NG.now = function(){ return clock.t; };
NG.after = function(ms, fn){ var id = {at:clock.t + ms, fn:fn, dead:false}; clock.timers.push(id); return id; };
NG.cancel = function(id){ if (id) id.dead = true; };
NG.wait = function(ms){ return new Promise(function(res){ NG.after(ms, res); }); };
var updaters = [];
NG.onUpdate = function(fn){ updaters.push(fn); return fn; };
NG.offUpdate = function(fn){ var i = updaters.indexOf(fn); if (i >= 0) updaters.splice(i, 1); };
var hitstopUntil = 0;
function step(dt){
  clock.t += dt;
  var due = clock.timers.filter(function(x){ return !x.dead && x.at <= clock.t; });
  clock.timers = clock.timers.filter(function(x){ return !x.dead && x.at > clock.t; });
  due.sort(function(a, b){ return a.at - b.at; }).forEach(function(x){ try { x.fn(); } catch(e){ console.error(e); } });
  var frozen = clock.t < hitstopUntil;
  for (var i = 0; i < updaters.length; i++){ try { updaters[i](frozen ? 0 : dt / 1000, clock.t); } catch(e){ console.error(e); } }
  FX._update(dt / 1000);
  BG._update(dt / 1000);
}
var last = 0;
function loop(ts){
  if (!clock.manual){
    var dt = last ? Math.min(50, ts - last) : 16;
    if (!NG.paused) step(dt); else { FX._update(0); }
  }
  last = ts;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

var A = NG.audio = {ctx:null, master:null, sfxGain:null, musicGain:null, muted:NG.store.get("muted", false)};

    A.sfxGain = A.ctx.createGain(); A.sfxGain.gain.value = 0.55; A.sfxGain.connect(A.master);
    A.musicGain = A.ctx.createGain(); A.musicGain.gain.value = 0.22; A.musicGain.connect(A.master);
    var len = A.ctx.sampleRate; var buf = A.ctx.createBuffer(1, len, A.ctx.sampleRate); var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

  fanfare: function(){ [[67,0],[67,.12],[67,.24],[72,.4],[76,.7],[79,1.0]].forEach(function(x){ tone({type:"square", freq:note(x[0]), dur:0.3, vol:0.25, delay:x[1], jitter:0}); tone({type:"triangle", freq:note(x[0] - 12), dur:0.3, vol:0.2, delay:x[1], jitter:0}); }); },

NG.sfx = function(name, arg){

/* BGM: 16-step chiptune sequencer, one pattern per mood */
var MOODS = {
  upbeat:   {bpm:132, chords:[[60,64,67],[57,60,64],[53,57,60],[55,59,62]], arp:[0,1,2,1], bass:"oct", drums:"pop"},
  space:    {bpm:100, chords:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]], arp:[0,2,1,2], bass:"long", drums:"soft", wave:"sine"},
  cute:     {bpm:120, chords:[[65,69,72],[62,65,69],[58,62,65],[60,64,67]], arp:[0,1,2,1], bass:"bounce", drums:"soft", wave:"triangle"},
  korean:   {bpm:96,  chords:[[62,64,67],[60,62,67],[57,60,62],[60,62,64]], arp:[0,1,2,1], bass:"long", drums:"janggu", wave:"triangle"},
  sports:   {bpm:140, chords:[[60,64,67],[60,64,67],[65,69,72],[67,71,74]], arp:[0,0,2,1], bass:"oct", drums:"pop"},
  mystery:  {bpm:92,  chords:[[57,60,64],[57,60,65],[56,59,64],[55,58,62]], arp:[0,2,1,2], bass:"long", drums:"soft", wave:"triangle"},
  nature:   {bpm:104, chords:[[60,64,67],[65,69,72],[62,65,69],[67,71,74]], arp:[0,1,2,1], bass:"bounce", drums:"soft", wave:"sine"},
  tension:  {bpm:150, chords:[[57,60,64],[57,60,64],[58,62,65],[56,59,64]], arp:[0,1,0,2], bass:"oct", drums:"pop"}
};
var music = NG.music = {on:false, mood:null, step:0, next:0, timer:null};
music.start = function(mood){
  var ctx = ensureAudio(); if (!ctx) return;
  music.stop(); music.mood = MOODS[mood] ? mood : "upbeat"; music.on = true; music.step = 0; music.next = ctx.currentTime + 0.1;
  music.timer = setInterval(schedule, 25);
};
music.stop = function(){ music.on = false; if (music.timer) clearInterval(music.timer); music.timer = null; };
music.setTempo = function(mult){ music.tempoMult = mult; };
function schedule(){
  if (!music.on || !A.ctx) return;
  var m = MOODS[music.mood]; var spb = 60 / (m.bpm * (music.tempoMult || 1)) / 4; // 16th note
  while (music.next < A.ctx.currentTime + 0.12){
    if (!NG.paused && !A.muted){
      var s = music.step % 16, bar = Math.floor(music.step / 16) % 4, ch = m.chords[bar], d = music.next - A.ctx.currentTime;
      var arpN = ch[m.arp[s % 4]] + 12;
      if (s % 2 === 0) tone({type:m.wave || "square", freq:note(arpN), dur:spb * 1.6, vol:0.18, delay:d, jitter:0, bus:A.musicGain});
      if (m.bass === "oct" && s % 4 === 0) tone({type:"triangle", freq:note(ch[0] - 24 + (s % 8 ? 12 : 0)), dur:spb * 3.5, vol:0.5, delay:d, jitter:0, bus:A.musicGain});
      if (m.bass === "long" && s === 0) tone({type:"triangle", freq:note(ch[0] - 24), dur:spb * 15, vol:0.45, delay:d, jitter:0, bus:A.musicGain, attack:0.05});
      if (m.bass === "bounce" && s % 4 === 0) tone({type:"triangle", freq:note(ch[s % 8 ? 2 : 0] - 24), dur:spb * 2, vol:0.45, delay:d, jitter:0, bus:A.musicGain});
      if (m.drums === "pop"){ if (s % 8 === 0) tone({type:"sine", freq:150, slide:40, dur:0.15, vol:0.7, delay:d, jitter:0, bus:A.musicGain}); if (s % 8 === 4) tone({type:"noise", freq:1800, dur:0.1, vol:0.35, delay:d, bus:A.musicGain}); if (s % 2 === 1) tone({type:"noise", freq:7000, dur:0.03, vol:0.12, delay:d, filter:"highpass", bus:A.musicGain}); }
      if (m.drums === "soft"){ if (s % 8 === 0) tone({type:"sine", freq:110, slide:40, dur:0.2, vol:0.45, delay:d, jitter:0, bus:A.musicGain}); if (s % 4 === 2) tone({type:"noise", freq:6000, dur:0.03, vol:0.08, delay:d, filter:"highpass", bus:A.musicGain}); }
      if (m.drums === "janggu"){ if (s === 0 || s === 6 || s === 10) tone({type:"sine", freq:180, slide:90, dur:0.18, vol:0.5, delay:d, jitter:0, bus:A.musicGain}); if (s === 4 || s === 12 || s === 14) tone({type:"noise", freq:2500, dur:0.06, vol:0.25, delay:d, bus:A.musicGain}); }
    }
    music.next += spb; music.step++;
  }
}

/* ---------- boot ---------- */
NG.startGame = function(){ if (window.GAME_LOGIC && GAME_LOGIC.start) GAME_LOGIC.start(); else console.error("GAME_LOGIC.start missing"); };
NG.boot = function(){ var G = window.GAME; NG.calm = !!G.calm; NG.setTheme(G.theme, G.themeOverride); document.title = G.title || document.title; NG.go("title"); };
})();
</script>

<script>
/* ===================== GAME LOGIC (Claude writes this block) =====================
   Required: window.GAME_LOGIC = { start(), toText() }
   Use: NG.go/finish, NG.feedback, NG.addScore, NG.nextTurn, NG.timer.start,
        NG.fx.*, NG.sfx, NG.teacher.hooks = {next, skip, reveal}, NG.hud.setProgress
*/
window.GAME_LOGIC = {
  start: function(){ NG.finish({}); },
  toText: function(){ return {}; }
};
</script>
<script>NG.boot();</script>
