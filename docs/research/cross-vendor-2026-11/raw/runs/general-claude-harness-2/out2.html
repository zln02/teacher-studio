<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>월례 배드민턴 대회 점수판</title>
<style>/* TS:CSS BEGIN */:root{--bg1:#fff4e0;--bg2:#ffe2b8;--text:#3a2410;--card:#fffdf7;--cardText:#3a2410;--cardBorder:#d9a05b;--primary:#b83c0a;--btnText:#ffffff;--accent:#1c6e8c;--good:#005c75;--bad:#cb4a2a;--fs-h:64px;--fs-btn:52px;--fs-body:38px;--fs-small:34px;--btn-h:110px;--btn-sm:64px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg1)}
body{font-family:'TS Sans','Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-synthesis:none;font-kerning:normal;color:var(--text);word-break:keep-all;overflow-wrap:break-word;line-height:1.25;-webkit-tap-highlight-color:transparent;user-select:none}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;display:flex;flex-direction:column;padding:36px 56px 44px;background:radial-gradient(1200px 800px at 20% 0%,var(--bg2),transparent 70%),linear-gradient(135deg,var(--bg1),var(--bg2))}
header{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:var(--btn-sm);margin-bottom:20px}
h1{font-size:var(--fs-h);font-weight:760;letter-spacing:-.035em;text-wrap:balance;flex:1 1 420px;min-width:0}
.tools{display:flex;gap:12px 16px;flex-wrap:wrap;justify-content:flex-end;flex:0 1 auto}
/* portrait */
.port header{flex-direction:column;align-items:flex-start;gap:12px}
.port .tools{flex-wrap:wrap}
main{flex:1;min-height:0;position:relative;display:flex}
.btn{min-height:var(--btn-h);padding:0 32px;font-family:inherit;font-size:var(--fs-btn);font-weight:800;border-radius:28px;border:4px solid var(--cardBorder);background:var(--card);color:var(--cardText);cursor:pointer;white-space:nowrap;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn:focus-visible,.ta:focus-visible,.num:focus-visible{outline:6px solid var(--accent);outline-offset:3px}
.btn.main{background:var(--primary);color:var(--btnText);border-color:transparent}
.btn.sm{min-height:var(--btn-sm);font-size:var(--fs-body);padding:0 24px;border-radius:22px}
.hint{font-size:var(--fs-small);opacity:.95}
.card{background:var(--card);color:var(--cardText);border:4px solid var(--cardBorder);border-radius:36px}
.row{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:20px}
/* timer */
.timer{flex:1;display:flex;gap:56px;align-items:center;justify-content:center}
.port .timer{flex-direction:column;gap:32px}
.ringbox{position:relative;width:800px;height:800px;flex:none}
.port .ringbox{width:900px;height:900px}
.ringbox svg{width:100%;height:100%;display:block}
.trk{fill:none;stroke:var(--cardBorder);stroke-width:36;opacity:.55}
.prog{fill:none;stroke:var(--primary);stroke-width:36;stroke-linecap:round;transform:rotate(-90deg);transform-origin:400px 400px}
.warn .prog{stroke:var(--bad)}
.orbit-dot{fill:var(--accent);stroke:var(--text);stroke-width:6}
.outer{fill:none;stroke:var(--accent);stroke-width:4;stroke-dasharray:4 22;stroke-linecap:round;transform-origin:400px 400px}
.running .outer{animation:spin 40s linear infinite}
.running .orbit-dot{animation:glow 1.6s ease-in-out infinite}
.digits{position:absolute;left:0;right:0;top:50%;transform:translateY(-58%);text-align:center;font-size:230px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.state{position:absolute;left:0;right:0;top:66%;text-align:center;font-size:var(--fs-h);font-weight:800}
.warn .state{font-weight:800}
.ended .digits{animation:endpulse 1.2s ease-in-out 3}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:640px}
.port .controls{width:900px}
.controls .wide{grid-column:1/3}
.ended .state{top:62%;left:0;right:0;margin:0 auto;width:max-content;padding:0 56px;font-size:120px;font-weight:800;background:var(--primary);color:var(--btnText);border-radius:44px;border:6px solid var(--text);white-space:nowrap;animation:slam .5s cubic-bezier(.2,1.4,.4,1)}
/* picker */
.picker{flex:1;display:flex;flex-direction:column;gap:24px}
.reveal{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
.reveal .lab{position:absolute;top:28px;left:0;right:0;text-align:center;font-size:var(--fs-btn);font-weight:800}
.picked{font-weight:800;line-height:1.05;text-align:center;max-width:94%;font-size:340px}
.picked.slam{animation:slam .5s cubic-bezier(.2,1.5,.4,1)}
.picked.spin{opacity:.75}
.fade{animation:fadein .3s ease-out}
.chips{display:flex;gap:12px;flex-wrap:wrap}
.chip{padding:8px 24px;border-radius:999px;background:var(--card);color:var(--cardText);border:3px solid var(--cardBorder);font-size:var(--fs-small);font-weight:700}
.picker .bar{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
/* teams */
.teams{flex:1;display:flex;flex-direction:column;gap:20px;min-height:0}
.tgrid{flex:1;display:grid;gap:20px;min-height:0;align-content:start}
.tcard{padding:24px 24px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.tcard h3{font-size:var(--fs-btn);font-weight:800}
.tcard .chips{align-content:flex-start}
.pop{animation:popin .45s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i)*90ms)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;font-size:var(--fs-h);font-weight:800}
/* bracket */
.bracket{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.champ{min-height:90px;display:flex;align-items:center;justify-content:center;font-size:var(--fs-h);font-weight:800}
.champ.on{background:var(--primary);color:var(--btnText);border-radius:28px;animation:slam .5s cubic-bezier(.2,1.5,.4,1)}
.cols{flex:1;display:flex;gap:16px;min-height:0}
.rcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:space-around}
.rcol.fin{flex:1.25}
.rlab{font-size:var(--fs-small);font-weight:800;text-align:center;margin-bottom:8px}
.match{display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:22px;background:var(--card);border:3px solid var(--cardBorder)}
.slot{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:var(--btn-sm);padding:0 12px;border-radius:14px;font-family:inherit;font-size:var(--fs-small);font-weight:800;background:var(--bg1);color:var(--text);border:3px solid transparent;text-align:left;overflow:hidden;white-space:nowrap}
button.slot{cursor:pointer}
.slot span{overflow:hidden;text-overflow:ellipsis}
.slot.win{background:var(--primary);color:var(--btnText)}
.slot.wait{border-style:dashed;border-color:var(--cardBorder)}
/* scoreboard */
.score{flex:1;display:grid;gap:20px;min-height:0}
.scard{padding:20px 24px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:12px;position:relative;min-height:0}
.scard h3{font-size:var(--fs-h);font-weight:800;text-align:center}
.sval{font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.badge{position:absolute;top:14px;right:16px;padding:4px 20px;border-radius:999px;background:var(--primary);color:var(--btnText);font-size:var(--fs-small);font-weight:800}
.sbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
/* editor */
.ov{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:20;padding:40px}
.ovcard{width:1300px;max-width:100%;max-height:100%;padding:36px 44px;display:flex;flex-direction:column;gap:20px;overflow:auto}
.ovcard h2{font-size:var(--fs-h)}
.ta{width:100%;height:360px;resize:none;font-family:inherit;font-size:var(--fs-btn);padding:16px 24px;border-radius:22px;border:4px solid var(--cardBorder);background:var(--bg1);color:var(--text);line-height:1.4;user-select:text}
.num{width:150px;min-height:var(--btn-sm);font-family:inherit;font-size:var(--fs-btn);font-weight:800;text-align:center;border-radius:22px;border:4px solid var(--cardBorder);background:var(--bg1);color:var(--text)}
.impact{position:absolute;left:0;top:0;right:0;bottom:0;z-index:30;pointer-events:none;animation:impact .32s ease-out forwards}
.shake{animation:shake .4s linear}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{50%{r:40}}
@keyframes endpulse{50%{transform:translateY(-58%) scale(1.07)}}
@keyframes slam{0%{transform:scale(2.6);opacity:0}60%{transform:scale(.94);opacity:1}100%{transform:scale(1)}}
@keyframes popin{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes impact{0%{background:var(--text);opacity:.12}100%{background:transparent;opacity:0}}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-14px,8px)}40%{transform:translate(12px,-10px)}60%{transform:translate(-8px,6px)}80%{transform:translate(6px,-4px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.pbox{min-height:440px;display:flex;align-items:flex-end;justify-content:center}
:root{--on-podium:var(--btnText)}
/* TS:JUICE CSS v1 - styles for the Game Wow kit. No animation here flashes: nothing loops faster than 1/s. */
.juice-fx{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:9500}
.juice-flash{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:9400;opacity:0}
.juice-impact{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:9400;opacity:0;
  background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.0) 0deg 5deg,rgba(255,255,255,.22) 5deg 6.5deg);
  -webkit-mask-image:radial-gradient(circle at 50% 50%,transparent 38%,#000 85%);mask-image:radial-gradient(circle at 50% 50%,transparent 38%,#000 85%)}
.juice-live{position:fixed;left:0;top:0;right:0;height:0;pointer-events:none;z-index:9600}
.juice-banner{position:fixed;left:50%;top:15%;transform:translate(-50%,0);padding:12px 40px;border-radius:999px;font-weight:800;font-size:clamp(34px,4vw,76px);line-height:1.2;white-space:nowrap;
  background:var(--card,#fff);color:var(--cardText,#222);border:6px solid var(--accent,#ffd447);box-shadow:0 10px 30px rgba(0,0,0,.28);word-break:keep-all}
.juice-banner.t2{border-color:var(--primary,#4a8);font-size:clamp(40px,4.6vw,88px)}
.juice-banner.t3{border-color:var(--good,#3c8);font-size:clamp(44px,5.2vw,100px);padding:16px 56px}
.juice-paper{position:fixed;left:0;top:0;right:0;bottom:0;z-index:9300;pointer-events:none;filter:drop-shadow(0 0 10px rgba(0,0,0,.3))}
.juice-slash{position:fixed;height:6px;border-radius:3px;background:#fff;box-shadow:0 0 12px #fff;z-index:9100;pointer-events:none;transform-origin:left center}
.juice-orbit,.juice-dial{display:block;color:var(--text,#222)}
.juice-sketch{z-index:1}
/* press feel: hover 1.05 / press 0.95, back-out 120ms. Responds on pointerdown (no JS in the way). */
.juice-on .btn,.juice-on .choice,.juice-on .juice-toggle{transition:transform 120ms cubic-bezier(.34,1.56,.64,1),box-shadow 120ms ease}
@media (hover:hover){.juice-on .btn:hover:not(:active),.juice-on .choice:hover:not(:active):not(.correct):not(.wrong){transform:scale(1.05)}}
.juice-on .btn:active,.juice-on .choice:active,.juice-on .juice-toggle:active{transform:scale(.95)!important}
.juice-on .timer.warn>i{animation:none!important} /* gentle pulse on the number instead of blinking */
.juice-toggles{display:flex;gap:12px;flex-wrap:wrap}
.juice-toggle{min-height:56px;min-width:56px;padding:8px 24px;border-radius:14px;border:3px solid currentColor;background:transparent;color:inherit;font:inherit;font-weight:800;font-size:34px;cursor:pointer}
/* podium (teams only; 3rd -> 2nd -> 1st) */
.juice-podium{display:flex;flex-direction:column;align-items:center;gap:16px}
.jp-stage{display:flex;align-items:flex-end;justify-content:center;gap:28px;min-height:420px}
.jp-rest{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;visibility:hidden}
.jp-chip{padding:8px 24px;border-radius:999px;background:var(--card,#fff);color:var(--cardText,#222);border:3px solid var(--cardBorder,#ccc);font-size:34px;font-weight:800}
.jp-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:260px}
.jp-who{display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:40px;line-height:1.2;margin-bottom:8px;word-break:keep-all}
.jp-ico{font-size:72px;line-height:1}
.jp-block{width:240px;border-radius:18px 18px 6px 6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:16px;color:var(--on-podium,#fff);font-weight:800;box-shadow:inset 0 -10px 0 rgba(0,0,0,.18);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.jp-rank{font-size:64px;line-height:1}
.jp-score{font-size:40px;line-height:1.3}
.jp-col.r1 .jp-who{font-size:48px}
.jp-col.r1 .jp-block{width:280px}
/* reduced motion / "효과 줄이기": nothing moves or loops; effects become still states */
.juice-reduce .juice-banner,.juice-reduce .juice-paper,.juice-reduce .juice-impact{animation:none!important}
.juice-reduce *{scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){.juice-on .btn,.juice-on .choice{transition:none}.juice-on .btn:hover,.juice-on .choice:hover{transform:none}}

<script>/* TS:JUICE v1 - Game Wow kit (core). Vanilla ES2017, no dependencies, no network, no storage. Own code (MIT-compatible).

(function (root) {
  'use strict';
  var doc = root.document;
  var J = root.Juice = { version: 1, hooks: {}, camera: null };

    wrong: { shakePx: 6, ms: 250 },
    score: { countMs: 650, minMs: 500, maxMs: 800 },
    timer: { pulseFrom: 5, pulseScale: 1.08 },
    streak: { tiers: [3, 5, 10], repeatEvery: 5 },
    reveal: { tensionMs: 2200, minTensionMs: 1500, maxTensionMs: 3000, podiumStepMs: 1200 },
    lowEnd: { cores: 4, memory: 4, fpsProbe: true, probeMs: 600, minFps: 40, burstScale: 0.5 },
    particles: { max: 80 },

        var c = h('div', 'tcard card' + (anim && !RM && !J ? ' pop' : '')); c.style.setProperty('--i', i);
        c.appendChild(h('h3', '', (tn[i] || ((i + 1) + '모둠')) + ' · ' + g.length + '명'));
        var ch = h('div', 'chips'); g.forEach(function (n) { ch.appendChild(h('span', 'chip', n)); }); c.appendChild(ch);
        area.appendChild(c);
      });
      if (anim) {
        if (J) { snd('whoosh'); if (!RM && !API.instant) { J.fx.layerExplode(area, { mode: 'in', radius: 160, ms: 560 }); J.kick(); setTimeout(function () { snd('pop'); }, 420); } }
        else { impact(); beep(660, 0.1); beep(880, 0.2, 0.12); }
      }
    }
    function edit() {
      editor({ title: '모둠 명단 (한 줄에 한 명)', lines: names, fill: true, limit: 60, min: 2, onSave: function (ls) { names = ls; groups = null; k = Math.min(k, Math.max(2, ls.length)); draw(); } });
    }
    API.step = function () { split(); return true; };
    API.action = split;
    API.state = function () { return { tool: 'teams', teams: groups ? groups.map(function (g) { return g.slice(); }) : null, total: names.length, k: k }; };
    draw();
  }

  /* ---------- bracket ---------- */
  function seedOrder(n) {
    var a = [1];
    while (a.length < n) { var m = a.length * 2 + 1; a = a.reduce(function (r, s) { r.push(s, m - s); return r; }, []); }
    return a;
  }
  function bracket() {
    var names = D.items.slice(), size, R, slots, W, hist = [];
    var root = h('div', 'bracket'), champ = h('div', 'champ'), cols = h('div', 'cols'), bar = h('div', 'row');
    var tb = document.getElementById('tb');
    tb.insertBefore(btn('명단 바꾸기', 'sm', edit), tb.firstChild);
    var undoB = btn('되돌리기', 'sm', function () { if (hist.length) { W = JSON.parse(hist.pop()); draw(); } });
    bar.appendChild(btn('자리 섞기', 'sm', function () { names = shuffle(names); init(); }));
    bar.appendChild(undoB);
    bar.appendChild(h('span', 'hint', '이긴 쪽을 눌러요.'));
    root.appendChild(champ); root.appendChild(cols); root.appendChild(bar); main.appendChild(root);
    function init() {
      size = 2; while (size < names.length) size *= 2;
      R = Math.round(Math.log(size) / Math.LN2);
      slots = seedOrder(size).map(function (s) { return s <= names.length ? names[s - 1] : null; });
      W = [];
      for (var r = 0; r < R; r++) { W.push([]); for (var m = 0; m < size / Math.pow(2, r + 1); m++) W[r].push(null); }
      for (var m2 = 0; m2 < size / 2; m2++) { if (slots[2 * m2] === null) W[0][m2] = slots[2 * m2 + 1]; else if (slots[2 * m2 + 1] === null) W[0][m2] = slots[2 * m2]; }
      hist = []; draw();
    }
    function players(r, m) { return r === 0 ? [slots[2 * m], slots[2 * m + 1]] : [W[r - 1][2 * m], W[r - 1][2 * m + 1]]; }
    function pick(r, m, who) {
      if (W[r][m] === who) return;
      hist.push(JSON.stringify(W));
      W[r][m] = who;
      var j = m; for (var rr = r + 1; rr < R; rr++) { j = j >> 1; W[rr][j] = null; }
      snd('pop'); draw(r === R - 1);
    }
    function label(r) { var n = size / Math.pow(2, r); return n === 2 ? '결승' : n + '강'; }
    function matchEl(r, m) {
      var p = players(r, m), bye = r === 0 && (p[0] === null || p[1] === null), active = !bye && p[0] !== null && p[1] !== null, box = h('div', 'match');
      p.forEach(function (name) {
        var win = name !== null && W[r][m] === name;
        var el = active ? h('button', 'slot', null, { type: 'button' }) : h('div', 'slot');
        if (name === null) el.classList.add('wait');
        if (win) el.classList.add('win');
        el.appendChild(h('span', '', name === null ? (bye ? '부전승' : '…') : name));
        if (win) el.appendChild(h('span', '', '승'));
        if (active) el.addEventListener('click', function () { pick(r, m, name); });
        box.appendChild(el);
      });
      return box;
    }
    function colEl(r, from, to, fin) {
      var c = h('div', 'rcol' + (fin ? ' fin' : ''));
      c.appendChild(h('div', 'rlab', label(r)));
      var wrap = h('div', ''); wrap.style.cssText = 'flex:1;display:flex;flex-direction:column;justify-content:space-around';
      for (var m = from; m < to; m++) wrap.appendChild(matchEl(r, m));
      c.appendChild(wrap); return c;
    }
    function draw(celebrate) {
      cols.textContent = '';
      var mirror = size >= 8 && stage.className !== 'port';
      for (var r = 0; r < R; r++) {
        var cnt = size / Math.pow(2, r + 1);
        if (r === R - 1) { cols.appendChild(colEl(r, 0, 1, true)); if (mirror) break; continue; }
        cols.appendChild(colEl(r, 0, mirror ? cnt / 2 : cnt, false));
      }
      if (mirror) for (var r2 = R - 2; r2 >= 0; r2--) { var c2 = size / Math.pow(2, r2 + 1); cols.appendChild(colEl(r2, c2 / 2, c2, false)); }
      var w = W[R - 1][0];
      champ.className = 'champ' + (w ? ' on' : ''); champ.textContent = w ? '우승: ' + w : ('대진표 · ' + names.length + '명');
      if (w && celebrate) {
        impact(); snd('fanfare');
        if (J && !RM && !API.instant) { var bc = J.center(champ); J.burst(bc.x, bc.y, { count: 22, scale: 1.2 }); J.confetti({ count: 50 }); J.squash(champ); }
        if (!J) { beep(784, 0.15); beep(1046, 0.15, 0.15); beep(1318, 0.4, 0.3); }
      }
      undoB.style.opacity = hist.length ? '1' : '.6';
    }
    function edit() {
      editor({ title: '대진표 명단 (2~16명, 한 줄에 하나)', lines: names, fill: true, limit: 16, min: 2, onSave: function (ls) { names = D.shuffle_on_edit ? shuffle(ls) : ls; init(); } });
    }
    API.step = function () {
      for (var r = 0; r < R; r++) for (var m = 0; m < W[r].length; m++) {
        var p = players(r, m);
        if (!W[r][m] && p[0] !== null && p[1] !== null) { pick(r, m, p[0]); return true; }
      }
      return false;
    };
    API.relayout = function () { draw(); };
    API.state = function () { return { tool: 'bracket', champion: W[R - 1][0], rounds: W.map(function (x) { return x.slice(); }), entries: names.length }; };
    init();
  }

  /* ---------- scoreboard ---------- */
  function scoreboard() {
    var names = D.teams.slice(), score = [], shown = [], hist = [], steps = D.steps, armed = 0, anim = {};
    var root = h('div', 'score'), vals = [], badges = [];
    names.forEach(function () { score.push(D.start); shown.push(D.start); });
    var tb = document.getElementById('tb');
    var reset = btn('0점으로', 'sm', function () {
      if (!armed) { armed = 1; reset.textContent = '한 번 더 누르면 0점'; setTimeout(function () { armed = 0; reset.textContent = '0점으로'; }, 3000); return; }
      armed = 0; reset.textContent = '0점으로'; hist.push(score.slice()); score = names.map(function () { return D.start; }); update();
    });
    tb.insertBefore(reset, tb.firstChild);
    if (J) tb.insertBefore(btn('🏆 시상식', 'sm', podium), tb.firstChild);
    tb.insertBefore(btn('되돌리기', 'sm', function () { if (hist.length) { score = hist.pop(); update(); } }), tb.firstChild);
    tb.insertBefore(btn('모둠 이름', 'sm', function () {
      editor({ title: '모둠 이름 (한 줄에 하나, 2~8개)', lines: names, fill: false, limit: 8, min: 2, hint: '모둠 이름은 이 화면에만 있고 저장하거나 어디로 보내지 않아요.', onSave: function (ls) {
        var old = names; names = ls; score = ls.map(function (_, i) { return i < old.length ? score[i] : D.start; }); shown = score.slice(); hist = []; build(); } });
    }), tb.firstChild);
    main.appendChild(root);
    function sizes() {
      var n = names.length, cols = n <= 4 ? n : Math.ceil(n / 2), rows = n <= 4 ? 1 : 2;
      var sv = n <= 3 ? 300 : n === 4 ? 220 : n <= 6 ? 150 : 120;
      if (stage.className === 'port') { cols = n <= 4 ? 1 : 2; rows = Math.ceil(n / cols); sv = n <= 2 ? 260 : n <= 4 ? 190 : 130; }
      return { cols: cols, rows: rows, sv: sv };
    }
    function build() {
      var z = sizes(); root.textContent = ''; vals = []; badges = [];
      root.style.gridTemplateColumns = 'repeat(' + z.cols + ',1fr)'; root.style.gridTemplateRows = 'repeat(' + z.rows + ',1fr)';
      names.forEach(function (nm, i) {
        var c = h('div', 'scard card'), v = h('div', 'sval', String(shown[i])), b = h('div', 'badge', '1위');
        v.style.fontSize = z.sv + 'px'; b.style.display = 'none';
        c.appendChild(h('h3', '', nm)); c.appendChild(b); c.appendChild(v);
        var sb = h('div', 'sbtns');
        steps.forEach(function (s) { sb.appendChild(btn('+' + s, 'main sm', function () { add(i, s); })); });
        sb.appendChild(btn('−1', 'sm', function () { add(i, -1); }));
        c.appendChild(sb); root.appendChild(c); vals.push(v); badges.push(b);
      });
      update(true);
    }
    function add(i, d) {
      hist.push(score.slice()); score[i] += d; update();
      if (d > 0) { snd('correct', { streak: Math.min(8, 1 + d) }); if (J && !RM && !API.instant && vals[i]) { J.squash(vals[i]); var sc = J.center(vals[i]); J.burst(sc.x, sc.y, { count: 12 + Math.min(10, d) }); } } else snd('click');
    }
    function update(skip) {
      var max = Math.max.apply(null, score), top = score.filter(function (s) { return s === max; }).length;
      badges.forEach(function (b, i) { b.style.display = max > D.start && score[i] === max ? '' : 'none'; b.textContent = top > 1 ? '공동 1위' : '1위'; });
      score.forEach(function (s, i) { countTo(i, s, skip); });
    }
    function countTo(i, target, skip) {
      var from = shown[i], t0 = performance.now(), dur = 600;
      anim[i] = (anim[i] || 0) + 1; var id = anim[i];
      if (RM || API.instant || skip || from === target) { shown[i] = target; vals[i].textContent = String(target); return; }
      (function f(t) {
        if (anim[i] !== id) return;
        var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
        shown[i] = Math.round(from + (target - from) * e); vals[i].textContent = String(shown[i]);
        if (p < 1) requestAnimationFrame(f); else { shown[i] = target; vals[i].textContent = String(target); }
      })(t0);
    }
    /* podium: teams only, 3rd -> 2nd -> 1st (never individuals); a drumroll first, tap anywhere to skip */
    function podium() {
      var max = Math.max.apply(null, score), ov = h('div', 'ov'), card = h('div', 'ovcard card'), host = h('div', 'pbox'), ctl = null, tm = 0;
      function close() { clearTimeout(tm); if (ctl) ctl.skip(); if (ov.parentNode) ov.parentNode.removeChild(ov); API.podiumEl = null; }
      card.appendChild(h('h2', '', '🏆 시상식'));
      if (max <= D.start) { card.appendChild(h('p', 'hint', '아직 점수가 없어요. 점수를 올린 뒤 다시 눌러 주세요.')); }
      else card.appendChild(host);
      var row = h('div', 'row'); row.appendChild(btn('닫기', 'main', close)); card.appendChild(row); ov.appendChild(card); main.appendChild(ov); API.podiumEl = host;
      if (max > D.start) {
        var teamsArr = names.map(function (n, i) { return { name: n, icon: ICONS[n] || '⭐', color: TEAMC[i % TEAMC.length], score: score[i] }; });
        var go = function () { ctl = J.podium(host, teamsArr, { onDone: function () { if (!RM && !API.instant) { J.fx.impactFrame(); } } }); };
        if (RM || API.instant) go(); else { host.appendChild(h('div', 'hint', '🥁 결과를 발표해요!')); snd('drumroll', { ms: 1500 }); tm = setTimeout(go, 1500); }
        card.addEventListener('pointerdown', function (e) { if (!/BUTTON/.test(e.target.tagName)) { if (ctl) ctl.skip(); else { clearTimeout(tm); host.textContent = ''; go(); if (ctl) ctl.skip(); } } });
      }
    }
    API.podium = podium;
    API.step = function () { add(0, steps[0]); return true; };
    API.state = function () { return { tool: 'scoreboard', teams: names.slice(), scores: score.slice(), shown: vals.map(function (v) { return v.textContent; }) }; };
    API.relayout = build;
    build();
  }

  /* ---------- shell ---------- */
  function resize() {
    var w = window.innerWidth, hh = window.innerHeight, port = hh > w * 1.15, W = port ? 1080 : 1920, H = port ? 1920 : 1080, s = Math.min(w / W, hh / H);
    stage.style.width = W + 'px'; stage.style.height = H + 'px'; stage.style.transform = 'scale(' + s + ')';
    stage.style.left = ((w - W * s) / 2) + 'px'; stage.style.top = ((hh - H * s) / 2) + 'px';
    var was = stage.className; stage.className = port ? 'port' : 'land';
    if (was !== stage.className && API.relayout) API.relayout();
  }
  var tb = document.getElementById('tb');
  var sndB = btn('', 'sm', function () { soundOn = !soundOn; paintSnd(); snd('click'); });
  function paintSnd() { sndB.textContent = soundOn ? '🔇 소리 끄기' : '🔊 소리 켜기'; sndB.setAttribute('aria-pressed', soundOn ? 'false' : 'true'); }
  var fxB = btn('', 'sm', function () { if (OSRM) return; userRM = !userRM; RM = userRM; if (J) J.setReduce(userRM); paintFx(); });
  function paintFx() { fxB.textContent = RM ? '✨ 효과 켜기' : '🌙 효과 줄이기'; fxB.setAttribute('aria-pressed', RM ? 'true' : 'false'); if (OSRM) { fxB.title = '기기 설정에서 이미 효과가 줄어 있어요'; } }
  paintSnd(); paintFx(); tb.appendChild(fxB); tb.appendChild(sndB);
  tb.appendChild(btn('전체화면', 'sm', function () {
    var d = document, el = d.documentElement;
    try { if (d.fullscreenElement) d.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen(); } catch (e) { /* not allowed */ }
  }));
  window.addEventListener('resize', resize);
  resize();
  ({ timer: timer, picker: picker, teams: teams, bracket: bracket, scoreboard: scoreboard })[T.tool]();
  document.addEventListener('keydown', function (e) {
    if (e.target !== document.body) return;
    if ((e.key === ' ' || e.key === 'Enter') && API.action) { e.preventDefault(); API.action(); }
  });
  window.render_tool_to_text = function () { return JSON.stringify(API.state()); };
  window.advanceTime = function (ms) { API.advance(ms); };
})();
</script>
