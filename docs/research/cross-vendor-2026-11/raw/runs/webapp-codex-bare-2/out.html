<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><span class="brand-icon" aria-hidden="true"><i></i></span><div><strong>경우의 수 실험실</strong><small>중학교 2학년 수학</small></div></div>
  <div class="nav-label">학습 단계</div>
  <nav class="nav" aria-label="학습 단계" id="navigation"></nav>
  <div class="progress-card">
    <div class="progress-title">나의 학습 진도 <span id="progress-count"></span></div>
    <div class="progress-track" role="progressbar" aria-label="학습 진도" aria-valuemin="0" aria-valuemax="3"><div id="progress-bar"></div></div>
    <p id="progress-text"></p>
  </div>
</aside>
<main class="main">
  <div class="topbar"><div class="topbar-inner"><div class="crumb">중학교 2학년 <span aria-hidden="true">›</span> <b>경우의 수</b></div><span class="badge">체험형 수학 수업</span><span class="mobile-progress" id="mobile-progress"></span></div></div>
  <div class="content">
    <header class="hero">
      <div class="hero-text"><span class="badge" id="hero-badge"></span><h1 id="page-title" tabindex="-1"></h1><p id="hero-copy"></p></div>
      <div class="art" aria-hidden="true"><div class="orbit"></div><div class="orbit second"></div><span class="spark s1">✦</span><span class="spark s2">✦</span><span class="spark s3">✧</span><span class="spark s4">✧</span><div class="tile one"><i style="grid-area:1 / 1"></i><i style="grid-area:1 / 3"></i><i style="grid-area:2 / 2"></i><i style="grid-area:3 / 1"></i><i style="grid-area:3 / 3"></i></div><div class="tile two"><i style="grid-area:1 / 1"></i><i style="grid-area:2 / 2"></i><i style="grid-area:3 / 3"></i></div></div>
    </header>
    <div id="activity"></div>
  </div>
</main>
</div>
<script>
"use strict";
const steps = [
  { label: "조합 실험", icon: "⊞", title: "경우의 수 실험실", copy: "상의와 하의를 하나씩 골라 조합을 만들어 보세요.<br>빠짐없이 세다 보면 경우의 수가 보여요!" },
  { label: "원리 탐구", icon: "±", title: "더할까, 곱할까?", copy: "선택하는 방법에 따라 경우의 수를 구하는 식이 달라져요.<br>선택지의 수를 바꾸고 어떤 규칙이 보이는지 살펴보세요." },
  { label: "실력 확인", icon: "✓", title: "경우의 수 퀴즈", copy: "옷차림, 간식, 주사위 문제를 풀며 배운 내용을 확인해 보세요.<br>한 문제씩 풀고 해설로 풀이를 확인할 수 있어요." }
];
const tops = [
  { label: "보라 티셔츠", short: "보라", color: "#ae8be8", shape: "shirt" },
  { label: "분홍 티셔츠", short: "분홍", color: "#ee9ab3", shape: "shirt" },
  { label: "노랑 티셔츠", short: "노랑", color: "#f5c66a", shape: "shirt" }
];
const bottoms = [
  { label: "청바지", short: "청바지", color: "#79a5de", shape: "pants" },
  { label: "검정 바지", short: "검정 바지", color: "#5c5874", shape: "pants" },
  { label: "초록 치마", short: "초록 치마", color: "#81bc9e", shape: "pants skirt" }
];
const questions = [
  { prompt: "상의가 4벌, 하의가 3벌 있어요. 상의와 하의를 한 벌씩 골라 입는 방법은 몇 가지인가요?", options: [7, 10, 12, 16], answer: 12, hint: "상의 한 벌에 하의 3벌을 각각 짝지을 수 있어요.", explanation: "상의 4벌 각각에 하의 3벌을 짝지으므로 4 × 3 = 12가지예요." },
  { prompt: "빵 3종류와 떡 5종류 중에서 간식을 한 개만 사려면 몇 가지 방법이 있나요?", options: [2, 8, 12, 15], answer: 8, hint: "간식 한 개는 빵이거나 떡이에요.", explanation: "빵을 고르는 3가지와 떡을 고르는 5가지가 겹치지 않으므로 3 + 5 = 8가지예요." },
  { prompt: "동전 한 개와 주사위 한 개를 동시에 던져요. 나올 수 있는 (동전 면, 주사위 눈)의 조합은 몇 가지인가요?", options: [6, 8, 10, 12], answer: 12, hint: "동전은 앞면과 뒷면, 주사위는 1부터 6까지 나올 수 있어요.", explanation: "동전의 두 면 각각에 주사위 눈 6개를 짝지으므로 2 × 6 = 12가지예요." },
  { prompt: "주사위 한 개를 던질 때, 짝수의 눈 또는 5의 눈이 나오는 경우는 몇 가지인가요?", options: [3, 4, 5, 6], answer: 4, hint: "짝수인 눈을 적고, 그 목록에 5가 있는지 확인해 보세요.", explanation: "짝수인 눈은 2, 4, 6이고 5와 겹치지 않으므로 3 + 1 = 4가지예요." },
  { prompt: "주사위 한 개를 던질 때, 짝수의 눈 또는 4 이상의 눈이 나오는 경우는 몇 가지인가요?", options: [3, 4, 5, 6], answer: 4, hint: "짝수인 눈과 4 이상인 눈에 공통으로 들어 있는 수를 찾아보세요.", explanation: "짝수인 눈은 2, 4, 6이고 4 이상인 눈은 4, 5, 6이에요. 겹치는 4와 6을 한 번씩만 세면 3 + 3 − 2 = 4가지예요." }
];

const storageKey = "counting-lab-progress-v1";
let completed = new Set();
try {
  const saved = JSON.parse(localStorage.getItem(storageKey));
  if (Array.isArray(saved)) completed = new Set(saved.filter(value => [0, 1, 2].includes(value)));
} catch {}
let active = 0;
let selectedTop = null;
let selectedBottom = null;
const results = new Set();
let exploreMessage = "";
let rule = "product";
const quantities = { product: [3, 2], sum: [3, 2] };
const triedRules = new Set();
let questionIndex = 0;
let chosen = null;
let checked = false;
let hintVisible = false;
let score = 0;
const activity = document.querySelector("#activity");
const navigation = document.querySelector("#navigation");

function renderProgress() {
  navigation.innerHTML = steps.map((step, index) => `<button type="button" data-action="navigate" data-value="${index}" ${active === index ? 'aria-current="step"' : ""}><span class="nav-icon" aria-hidden="true">${step.icon}</span>${step.label}${completed.has(index) ? '<span class="check" role="img" aria-label="완료">✓</span>' : ""}</button>`).join("");
  document.querySelector("#progress-count").textContent = `${completed.size} / ${steps.length}`;
  document.querySelector("#mobile-progress").textContent = `학습 진도 ${completed.size} / ${steps.length}`;
  const bar = document.querySelector("#progress-bar");
  bar.style.width = `${completed.size / steps.length * 100}%`;
  bar.parentElement.setAttribute("aria-valuenow", completed.size);
  document.querySelector("#progress-text").textContent = completed.size === steps.length ? "모든 학습 단계를 완료했어요!" : "세 단계를 차례로 체험해 보세요.";
}

function markComplete(index) {
  if (completed.has(index)) return;
  completed.add(index);
  try { localStorage.setItem(storageKey, JSON.stringify([...completed])); } catch {}
  renderProgress();
}

function navigate(index) {
  active = index;
  const step = steps[index];
  document.querySelector("#hero-badge").textContent = `${index + 1}단계 · ${step.label}`;
  document.querySelector("#page-title").textContent = step.title;
  document.querySelector("#hero-copy").innerHTML = step.copy;
  renderProgress();
  renderActivity();
}

function sectionHead(title, copy) {
  return `<div class="section-head"><span class="step-icon" aria-hidden="true">${steps[active].icon}</span><div><h2>${title}</h2><p>${copy}</p></div></div>`;
}

function garment(item) {
  return `<span class="garment ${item.shape}" style="--garment:${item.color}" aria-hidden="true"></span>`;
}

function choiceGroup(label, items, selected, action) {
  return `<div class="group" role="group" aria-label="${label}"><div class="group-title">${label}<span>${items.length}가지 중 1개</span></div><div class="options">${items.map((item, index) => `<button type="button" class="option" data-action="${action}" data-value="${index}" aria-pressed="${selected === index}">${garment(item)}${item.label}</button>`).join("")}</div></div>`;
}

function listResults() {
  if (results.size === 0) return '<div class="empty"><span class="empty-icon" aria-hidden="true">⊞</span><strong>아직 만든 조합이 없어요</strong><p>상의와 하의를 골라 첫 조합을 만들어 보세요.</p></div>';
  const combinations = [...results].sort().map(key => {
    const [top, bottom] = key.split("-").map(Number);
    return `<li class="combination"><span class="mini">${garment(tops[top])}${garment(bottoms[bottom])}</span><span>${tops[top].short} + ${bottoms[bottom].short}</span></li>`;
  });
  return `<ul class="combinations">${combinations.join("")}</ul>`;
}

function renderExplore() {
  const total = tops.length * bottoms.length;
  const allFound = results.size === total;
  activity.innerHTML = sectionHead("옷차림 조합 만들기", "상의 3가지와 하의 3가지로 만들 수 있는 옷차림을 빠짐없이 찾아보세요.") + `
    <div class="experiment">
      <section class="card" aria-labelledby="selection-heading">
        <div class="card-top"><h3 id="selection-heading">아이템 고르기</h3><span class="counter">상의 1개 + 하의 1개</span></div>
        ${choiceGroup("상의", tops, selectedTop, "top")}
        ${choiceGroup("하의", bottoms, selectedBottom, "bottom")}
        <div class="actions">
          <button type="button" class="primary" data-action="add" ${selectedTop === null || selectedBottom === null ? "disabled" : ""}>＋ 조합 추가</button>
          <button type="button" class="secondary" data-action="all" ${allFound ? "disabled" : ""}>모든 조합 보기</button>
          <button type="button" class="plain" data-action="reset-explore">초기화</button>
        </div>
        <p class="helper" role="status">${exploreMessage || "상의와 하의를 하나씩 선택해 보세요."}</p>
      </section>
      <section class="card" aria-labelledby="results-heading">
        <div class="card-top"><h3 id="results-heading">만든 옷차림</h3><span class="counter">${results.size} / ${total}가지</span></div>
        <div class="result-area">${listResults()}</div>
        <div class="formula"><span class="formula-symbol" aria-hidden="true">×</span><div><b>${allFound ? `상의 ${tops.length} × 하의 ${bottoms.length} = ${total}가지` : "상의의 수 × 하의의 수"}</b><small>상의 하나마다 모든 하의를 짝지을 수 있어요.</small></div></div>
      </section>
    </div>
    ${allFound ? '<div class="actions"><button type="button" class="primary" data-action="navigate" data-value="1">원리 탐구로 이동 →</button></div>' : ""}
    <div class="bottom-note"><span aria-hidden="true">✦</span><div><strong>세는 요령</strong>　상의 하나를 고정하고 하의만 하나씩 바꿔 보세요.</div></div>`;
}

function quantityControl(label, amount, group) {
  return `<div class="quantity"><h3>${label}</h3><div class="stepper" role="group" aria-label="${label} 종류 수"><button type="button" class="secondary" data-action="change" data-value="${group},-1" aria-label="${label} 한 종류 줄이기" ${amount <= 1 ? "disabled" : ""}>−</button><output>${amount}</output><button type="button" class="secondary" data-action="change" data-value="${group},1" aria-label="${label} 한 종류 늘리기" ${amount >= 5 ? "disabled" : ""}>＋</button></div></div>`;
}

function renderRule() {
  const product = rule === "product";
  const [first, second] = quantities[rule];
  const total = product ? first * second : first + second;
  const labels = product ? ["음료", "디저트"] : ["빵", "떡"];
  const firstChoices = Array.from({ length: first }, (_, index) => `${labels[0]} ${index + 1}`);
  const secondChoices = Array.from({ length: second }, (_, index) => `${labels[1]} ${index + 1}`);
  const chip = (value, alt = false) => `<span class="chip${alt ? " alt" : ""}">${value}</span>`;
  const diagram = product
    ? firstChoices.map(left => `<div class="diagram-row">${secondChoices.map(right => chip(`${left} + ${right}`)).join("")}</div>`).join("")
    : `<div class="diagram-row">${firstChoices.map(value => chip(value)).join("")}</div><div class="diagram-row">${secondChoices.map(value => chip(value, true)).join("")}</div>`;
  activity.innerHTML = sectionHead("선택 방법 바꾸기", "두 원리에서 종류의 수를 바꿔 보고 식과 목록이 어떻게 달라지는지 살펴보세요.") + `
    <div class="rule-tabs" role="group" aria-label="경우의 수 원리">
      <button type="button" class="secondary" data-action="rule" data-value="product" aria-pressed="${product}">곱의 법칙 · 각각 하나씩</button>
      <button type="button" class="secondary" data-action="rule" data-value="sum" aria-pressed="${!product}">합의 법칙 · 모두 중 하나만</button>
    </div>
    <div class="experiment">
      <section class="card"><h3>${product ? "음료와 디저트 세트 만들기" : "빵 또는 떡 고르기"}</h3>
        <p class="lesson-copy">${product ? "음료와 디저트를 각각 하나씩 골라요. 어떤 음료를 골라도 모든 디저트와 짝지을 수 있어요." : "빵과 떡 중 간식 하나만 골라요. 빵을 고르는 경우와 떡을 고르는 경우는 서로 겹치지 않아요."}</p>
        <div class="quantity-row">${quantityControl(labels[0], first, 0)}${quantityControl(labels[1], second, 1)}</div>
        <p class="helper">${completed.has(1) ? "합과 곱의 법칙을 모두 체험했어요." : "두 원리에서 각각 한 번 이상 종류 수를 바꾸면 이 단계가 완료돼요."}</p>
      </section>
      <section class="card"><div class="card-top"><h3>가능한 선택</h3><span class="counter">${total}가지</span></div>
        <div class="formula rule-formula" role="status"><span class="formula-symbol" aria-hidden="true">${product ? "×" : "+"}</span><div><b>${first} ${product ? "×" : "+"} ${second} = ${total}가지</b><small>${product ? "두 종류에서 각각 하나씩" : "서로 겹치지 않는 두 종류에서 하나만"}</small></div></div>
        <div class="diagram">${diagram}</div>
      </section>
    </div>
    ${completed.has(1) ? '<div class="actions"><button type="button" class="primary" data-action="navigate" data-value="2">실력 확인으로 이동 →</button></div>' : ""}
    <div class="bottom-note"><span aria-hidden="true">✦</span><div><strong>겹치는 경우</strong>　두 선택에 모두 들어 있는 경우는 한 번씩만 세어요.</div></div>`;
}

function renderQuiz() {
  if (questionIndex === questions.length) {
    activity.innerHTML = sectionHead("퀴즈 결과", "다시 풀면서 어떤 원리를 적용할지 연습해 보세요.") + `
      <section class="card quiz-card"><h3>맞힌 문제</h3><p class="summary-score">${score} / ${questions.length}</p>
      <div class="actions"><button type="button" class="primary" data-action="retry">다시 풀기</button><button type="button" class="secondary" data-action="navigate" data-value="1">원리 다시 보기</button></div></section>`;
    return;
  }
  const question = questions[questionIndex];
  const isCorrect = chosen === question.answer;
  const options = question.options.map(value => {
    const feedbackClass = checked && value === question.answer ? " correct" : checked && value === chosen ? " wrong" : "";
    return `<button type="button" class="answer${feedbackClass}" data-action="answer" data-value="${value}" aria-pressed="${chosen === value}" ${checked ? "disabled" : ""}>${value}가지</button>`;
  });
  activity.innerHTML = sectionHead("한 문제씩 풀어 보기", "답을 고르고 정답 확인을 누르면 풀이가 나와요.") + `
    <section class="card quiz-card">
      <div class="card-top"><h3 id="question-heading" tabindex="-1">문제 ${questionIndex + 1}</h3><span class="counter">${questionIndex + 1} / ${questions.length}</span></div>
      <p>${question.prompt}</p><div class="quiz-options" role="group" aria-labelledby="question-heading">${options.join("")}</div>
      ${checked ? `<div class="feedback ${isCorrect ? "good" : "bad"}" role="status"><strong>${isCorrect ? "정답이에요!" : `정답은 ${question.answer}가지예요.`}</strong> ${question.explanation}</div>` : ""}
      ${!checked && hintVisible ? `<div class="feedback" id="quiz-hint" role="status"><strong>힌트</strong>　${question.hint}</div>` : ""}
      <div class="actions">${checked
        ? `<button type="button" class="primary" data-action="next">${questionIndex === questions.length - 1 ? "결과 보기" : "다음 문제 →"}</button>`
        : `<button type="button" class="primary" data-action="check" ${chosen === null ? "disabled" : ""}>정답 확인</button><button type="button" class="secondary" data-action="hint" aria-expanded="${hintVisible}">${hintVisible ? "힌트 접기" : "힌트 보기"}</button>`}</div>
    </section>`;
}

function renderActivity() {
  [renderExplore, renderRule, renderQuiz][active]();
}

function afterChange(action, value, fallback) {
  renderActivity();
  const button = [...activity.querySelectorAll("button")].find(item =>
    !item.disabled && item.dataset.action === action && (value === undefined || item.dataset.value === value)
  );
  (button || (fallback && activity.querySelector(fallback)))?.focus({ preventScroll: true });
}

document.addEventListener("click", event => {
  const button = event.target.closest("button[data-action]");
  if (!button || button.disabled) return;
  const { action, value } = button.dataset;
  if (action === "navigate") {
    navigate(Number(value));
    const title = document.querySelector("#page-title");
    title.focus({ preventScroll: true });
    window.scrollTo(0, 0);
    return;
  }
  if (action === "top" || action === "bottom") {
    if (action === "top") selectedTop = Number(value);
    else selectedBottom = Number(value);
    exploreMessage = selectedTop !== null && selectedBottom !== null ? "조합 추가를 눌러 목록에 넣어 보세요." : "다른 종류의 아이템도 하나 골라 보세요.";
  } else if (action === "add") {
    const key = `${selectedTop}-${selectedBottom}`;
    const name = `${tops[selectedTop].label} + ${bottoms[selectedBottom].label}`;
    exploreMessage = results.has(key) ? `이미 만든 옷차림이에요. ${name}` : `${name} 조합을 추가했어요.`;
    results.add(key);
    if (results.size === tops.length * bottoms.length) markComplete(0);
  } else if (action === "all") {
    tops.forEach((_, top) => bottoms.forEach((_, bottom) => results.add(`${top}-${bottom}`)));
    exploreMessage = "가능한 옷차림 9가지를 모두 펼쳤어요.";
    markComplete(0);
  } else if (action === "reset-explore") {
    selectedTop = null;
    selectedBottom = null;
    exploreMessage = "선택과 옷차림 목록을 비웠어요.";
    results.clear();
  } else if (action === "rule") {
    rule = value;
  } else if (action === "change") {
    const [group, delta] = value.split(",").map(Number);
    quantities[rule][group] += delta;
    triedRules.add(rule);
    if (triedRules.size === 2) markComplete(1);
    afterChange(action, value, `[data-value="${group},${-delta}"]`);
    return;
  } else if (action === "answer") {
    chosen = Number(value);
  } else if (action === "check") {
    checked = true;
    if (chosen === questions[questionIndex].answer) score++;
    afterChange("next");
    return;
  } else if (action === "hint") {
    hintVisible = !hintVisible;
  } else if (action === "next" || action === "retry") {
    if (action === "retry") {
      questionIndex = 0;
      score = 0;
    } else {
      questionIndex++;
      if (questionIndex === questions.length) markComplete(2);
    }
    chosen = null;
    checked = false;
    hintVisible = false;
    afterChange("retry", undefined, "#question-heading");
    return;
  }
  afterChange(action, value, action === "all" ? '[data-action="navigate"]' : undefined);
});

navigate(0);
</script>
</body>
</html>
