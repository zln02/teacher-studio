<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="초등학교 4학년 사회. 우리 지역의 공공 기관이 하는 일을 세 가지 미션으로 복습해요.">
<title>우리 동네 탐험대 | 초등 4학년 사회</title>
<style>
  :root {
    color-scheme: light;
    --ink: #1d3026;
    --muted: #53645b;
    --green: #24643e;
    --line: #e4eae2;
    --paper: #fafbf7;
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
    font-synthesis: none;
    word-break: keep-all;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; }
  button { font: inherit; cursor: pointer; color: inherit; }
  button:focus-visible, summary:focus-visible { outline: 3px solid #246db3; outline-offset: 4px; }
  button:disabled { cursor: default; }
  h1, h2, h3, p { margin: 0; }
  [hidden] { display: none !important; }
  .wrap { width: min(1120px, calc(100% - 56px)); margin-inline: auto; }
  .site-header { background: #fff; border-bottom: 1px solid var(--line); }
  .bar { min-height: 74px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .brand { display: inline-flex; gap: 11px; align-items: center; padding: 0; border: 0; background: none; font-size: 1.15rem; font-weight: 850; letter-spacing: -.055em; text-align: left; white-space: nowrap; }
  .brand-icon { width: 38px; height: 38px; display: grid; place-items: center; background: #daedbe; border-radius: 12px; font-size: 1.28rem; }
  .nav { display: flex; gap: 6px; }
  .nav button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 13px; border: 1px solid transparent; border-radius: 10px; background: none; color: #4c5d53; font-size: .91rem; font-weight: 750; white-space: nowrap; }
  .nav button:hover, .nav button[aria-current="page"] { color: #245b36; background: #edf5e6; }
  .nav-symbol { font-size: 1.12rem; line-height: 1; }
  main { min-height: calc(100vh - 149px); padding-block: 29px 32px; }
  .hero { position: relative; min-height: 378px; display: flex; align-items: center; isolation: isolate; overflow: hidden; border: 1px solid #dfebcd; border-radius: 25px; background: #edf6d9; }
  .hero::after { position: absolute; z-index: -1; inset: 0; content: ""; background: linear-gradient(90deg, #edf6d9 0%, #edf6d9 32%, #edf6d9 38%, #edf6d900 55%); pointer-events: none; }
  .hero-art { position: absolute; z-index: -2; inset: 0 0 0 auto; width: 61%; height: 100%; object-fit: cover; object-position: center 48%; }
  .hero-copy { padding: 33px 0 34px 44px; width: 51%; }
  .subject { display: inline-flex; align-items: center; gap: 7px; margin-bottom: 15px; padding: 6px 12px; background: #fbfff2; border: 1px solid #d6e5bd; border-radius: 999px; color: #3a613b; font-size: .86rem; font-weight: 800; }
  .subject::before { content: ""; width: 8px; height: 8px; background: #63a157; border-radius: 50%; }
  .hero h1 { font-size: clamp(2.55rem, 4.2vw, 4rem); line-height: 1.13; font-weight: 900; letter-spacing: -.09em; }
  .hero h1 span { color: #286942; }
  .hero p { margin-top: 16px; color: #425a48; font-size: 1.02rem; line-height: 1.7; }
  .primary, .secondary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 11px; min-height: 47px; padding: 10px 20px; font-weight: 800; }
  .primary { background: #24643e; color: white; border: 1px solid #24643e; box-shadow: 0 3px 0 #174d2d; }
  .primary:hover:not(:disabled) { background: #1b5333; }
  .primary:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #174d2d; }
  .secondary { background: white; color: var(--green); border: 1px solid #d6e3d7; }
  .secondary:hover { background: #edf5e6; }
  .hero .primary { margin-top: 23px; }
  .missions { margin-top: 30px; }
  .section-title { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .section-title h2 { font-size: 1.53rem; letter-spacing: -.06em; }
  .section-title p { color: var(--muted); font-size: .91rem; margin-top: 5px; line-height: 1.5; }
  .progress-count { align-self: center; color: var(--green); border-radius: 999px; background: #eaf3e4; font-size: .87rem; font-weight: 800; padding: 8px 12px; white-space: nowrap; }
  .mission-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; }
  .mission { --tile: #e8f3df; --accent: #3d6837; border: 1px solid #e0e8dd; background: #fff; border-radius: 17px; text-align: left; padding: 17px 18px 15px; transition: border-color .16s, transform .16s, box-shadow .16s; }
  .mission:nth-child(2) { --tile: #e5efff; --accent: #315e98; }
  .mission:nth-child(3) { --tile: #fff1d6; --accent: #865a10; }
  .mission:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 8px 18px #213c2410; }
  .mission-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 6px; }
  .mission-icon { display: grid; place-items: center; width: 47px; height: 47px; border-radius: 13px; background: var(--tile, #e8f3df); font-size: 1.52rem; }
  .mission-label { color: var(--accent); background: var(--tile); border-radius: 999px; padding: 4px 9px; font-size: .82rem; font-weight: 800; }
  .mission h3 { font-size: 1.15rem; letter-spacing: -.055em; }
  .mission p { color: var(--muted); margin-top: 5px; font-size: .92rem; line-height: 1.5; }
  .mission-bottom { display: flex; justify-content: space-between; align-items: center; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 13px; font-size: .86rem; color: var(--muted); }
  .mission-bottom strong { color: var(--accent); }
  footer { border-top: 1px solid var(--line); }
  .footer-row { display: flex; align-items: center; justify-content: space-between; min-height: 73px; gap: 10px; color: var(--muted); font-size: .84rem; }
  .footer-row strong { color: #3b5144; }
  .panel { width: min(100%, 770px); margin-inline: auto; }
  .back { border: 0; padding: 6px 2px; background: none; color: var(--green); font-weight: 800; margin-bottom: 11px; }
  .back:hover { text-decoration: underline; }
  .quiz-card, .result-card { background: #fff; border: 1px solid var(--line); border-radius: 23px; padding: clamp(20px, 4vw, 36px); }
  .quiz-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: .93rem; font-weight: 850; color: var(--green); }
  progress { appearance: none; display: block; width: 100%; height: 9px; margin-block: 11px 24px; border: 0; border-radius: 999px; overflow: hidden; background: #eef2e9; color: #64a559; }
  progress::-webkit-progress-bar { background: #eef2e9; border-radius: 999px; }
  progress::-webkit-progress-value { background: #64a559; border-radius: 999px; }
  progress::-moz-progress-bar { background: #64a559; border-radius: 999px; }
  .quiz-card h1, .result-card h1, .guide h2 { font-size: clamp(1.55rem, 3vw, 2.15rem); line-height: 1.35; letter-spacing: -.065em; }
  .question-note { margin-block: 9px 17px; color: var(--muted); line-height: 1.6; }
  .options { display: grid; gap: 9px; }
  .option { display: flex; align-items: center; gap: 11px; min-height: 53px; padding: 9px 14px; border: 1px solid #dce7dd; border-radius: 11px; background: #fcfdfb; text-align: left; line-height: 1.45; }
  .option:hover:not([aria-disabled="true"]) { border-color: #659d60; background: #f1f9ed; }
  .option[aria-disabled="true"] { cursor: default; }
  .option-key { flex: 0 0 28px; height: 28px; display: grid; place-items: center; background: #eaf1e6; color: #345c3d; border-radius: 7px; font-size: .87rem; font-weight: 800; }
  .option.correct { border-color: #6aa36a; background: #eaf7e8; }
  .option.incorrect { border-color: #cf8374; background: #fff0eb; }
  .mark { margin-left: auto; flex-shrink: 0; font-size: .84rem; font-weight: 850; }
  .feedback { margin-top: 15px; padding: 12px 15px; background: #edf7e9; border-radius: 10px; color: #295137; line-height: 1.6; }
  .feedback.try-again { background: #fff3e2; color: #754b1d; }
  .feedback strong { display: block; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 17px; }
  .quiz-actions { justify-content: end; }
  .result-icon { font-size: 2.5rem; margin-bottom: 10px; }
  .overline { color: var(--green); font-size: .93rem; font-weight: 850; margin-bottom: 5px; }
  .result-summary { margin-top: 10px; line-height: 1.65; color: var(--muted); }
  .score { color: var(--green); font-weight: 900; }
  .review { margin-top: 20px; padding-top: 13px; border-top: 1px solid var(--line); }
  .review summary { cursor: pointer; font-weight: 850; }
  .review ol { padding-left: 23px; margin-bottom: 0; }
  .review li { margin-top: 12px; line-height: 1.65; }
  .review li p { color: var(--muted); }
  dialog { width: min(730px, calc(100% - 28px)); max-height: calc(100dvh - 32px); padding: 0; border: 1px solid var(--line); border-radius: 21px; color: var(--ink); background: #fff; box-shadow: 0 18px 65px #152b2450; }
  dialog::backdrop { background: #1d322775; }
  .guide { padding: clamp(19px, 4vw, 31px); }
  .guide-heading { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
  .close { border: 1px solid var(--line); border-radius: 9px; background: #f6f9f3; min-height: 37px; padding: 6px 10px; font-size: .88rem; font-weight: 800; }
  .close:hover { background: #eaf3e4; }
  .guide-intro { color: var(--muted); margin-top: 8px; line-height: 1.65; }
  .guide-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 17px; }
  .guide-item { background: #f5f9ef; padding: 14px; border-radius: 12px; }
  .guide-item h3 { font-size: 1rem; }
  .guide-item p { margin-top: 5px; color: var(--muted); font-size: .93rem; line-height: 1.6; }
  @media (max-width: 850px) {
    .wrap { width: calc(100% - 40px); }
    .hero { min-height: 344px; }
    .hero-copy { padding-left: 28px; }
    .hero h1 { font-size: clamp(2.45rem, 6vw, 3.25rem); }
    .mission { padding-inline: 13px; }
  }
  @media (max-width: 620px) {
    .wrap { width: calc(100% - 28px); }
    .bar { min-height: 62px; }
    .brand { font-size: 1rem; gap: 7px; }
    .brand-icon { width: 31px; height: 31px; font-size: 1.03rem; border-radius: 9px; }
    .nav { gap: 2px; }
    .nav button { padding: 8px 7px; font-size: .8rem; }
    .nav-symbol { display: none; }
    main { padding-block: 15px 24px; }
    .hero { flex-direction: column; align-items: stretch; border-radius: 18px; }
    .hero::after { display: none; }
    .hero-copy { width: 100%; padding: 22px 22px 20px; }
    .hero h1 { font-size: clamp(2.23rem, 8.9vw, 3.25rem); }
    .hero p { margin-top: 11px; }
    .hero .primary { margin-top: 15px; }
    .subject { margin-bottom: 11px; }
    .hero-art { position: static; width: 100%; height: auto; aspect-ratio: 3 / 2; }
    .missions { margin-top: 22px; }
    .mission-grid { grid-template-columns: 1fr; gap: 9px; }
    .mission { padding-inline: 16px; }
    .section-title { align-items: start; }
    .progress-count { align-self: start; }
    .footer-row { min-height: 60px; font-size: .78rem; }
  }
  @media (max-width: 390px) {
    .guide-grid { grid-template-columns: 1fr; }
    .footer-row { flex-wrap: wrap; justify-content: start; column-gap: 12px; row-gap: 0; padding-block: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>

<header class="site-header">
  <div class="wrap bar">
    <button id="brand" class="brand" type="button"><span class="brand-icon" aria-hidden="true">🧭</span>우리 동네 탐험대</button>
    <nav class="nav" aria-label="게임 메뉴">
      <button id="home-tab" type="button" aria-current="page"><span class="nav-symbol" aria-hidden="true">⌂</span> 탐험 지도</button>
      <button id="open-guide" type="button"><span class="nav-symbol" aria-hidden="true">▤</span> 기관 도감</button>

  </div>
</header>

  <section id="result" class="panel" hidden></section>
</main>
<footer>
  <div class="wrap footer-row"><strong>🧭 우리 동네 탐험대</strong><span>초등 4학년 사회 복습 게임</span></div>
</footer>
<dialog id="guide" aria-labelledby="guide-title">
  <div class="guide">
    <div class="guide-heading"><h2 id="guide-title">기관 도감</h2><form method="dialog"><button class="close" autofocus>닫기</button></form></div>
    <p class="guide-intro">공공 기관은 주민의 생활을 돕고 지역의 문제를 해결해요. 어떤 일을 하는지 살펴봐요.</p>
    <div id="guide-grid" class="guide-grid"></div>
  </div>
</dialog>
<script>
  "use strict";

  const institutions = [
    ["🚒", "소방서", "불을 끄고, 화재나 사고로 위험에 처한 사람을 구조해요."],
    ["🚓", "경찰서", "범죄를 예방하고 사건을 수사하며, 교통안전을 지켜요."],
    ["📚", "공공 도서관", "주민이 책을 읽고 빌릴 수 있도록 돕고, 독서 프로그램을 운영해요."],
    ["🩺", "보건소", "예방 접종과 건강 교육 등으로 주민의 건강을 돌봐요."],
    ["🏛️", "시청", "시의 살림을 맡아 공원과 도로 등 주민에게 필요한 시설을 관리해요."],
    ["🏘️", "행정복지센터", "주민등록 관련 서류를 발급하고, 주민이 필요한 복지 서비스를 안내해요."]
  ];

  const missions = [
    {
      icon: "🔎", title: "어떤 일을 할까요?", description: "공공 기관이 하는 일을 알아봐요.",
      questions: [
        { prompt: "불을 끄고 위험에 처한 사람을 구조하는 기관은 어디일까요?", answer: "소방서", others: ["시청", "공공 도서관", "보건소"], explanation: "소방서는 불을 끄고 화재나 사고 현장에서 사람을 구조해요." },
        { prompt: "공공 도서관이 하는 일은 무엇일까요?", answer: "주민에게 책을 빌려줘요.", others: ["교통사고를 조사해요.", "예방 접종을 해요.", "주민등록등본을 발급해요."], explanation: "공공 도서관에서는 책을 읽거나 빌리고 독서 활동에 참여할 수 있어요." },
        { prompt: "예방 접종과 건강 교육으로 주민의 건강을 돕는 곳은 어디일까요?", answer: "보건소", others: ["소방서", "경찰서", "공공 도서관"], explanation: "보건소는 주민이 병을 예방하고 건강을 지킬 수 있도록 도와요." },
        { prompt: "경찰서가 하는 일은 무엇일까요?", answer: "범죄를 예방하고 사건을 수사해요.", others: ["예방 접종을 해요.", "독서 프로그램을 열어요.", "화재 현장에서 불을 꺼요."], explanation: "경찰서는 범죄 예방과 수사, 교통안전 등의 일을 맡아요." }
      ]
    },
    {
      icon: "🗺️", title: "어디로 가야 할까요?", description: "생활 속 상황에 맞는 기관을 찾아요.",
      questions: [
        { prompt: "하린이네가 이사한 뒤 전입 신고를 하려고 해요. 어디를 방문하면 될까요?", answer: "새 주소를 맡는 행정복지센터", others: ["공공 도서관", "경찰서", "소방서"], explanation: "이사한 곳을 맡는 읍·면·동 주민센터나 행정복지센터에서 전입 신고를 할 수 있어요." },
        { prompt: "민재가 도둑맞은 자전거를 신고하고 싶어요. 어디에 도움을 요청해야 할까요?", answer: "경찰서", others: ["보건소", "시청", "공공 도서관"], explanation: "물건을 도둑맞았을 때는 경찰에 신고할 수 있어요. 경찰은 어떤 일이 있었는지 조사해요." },
        { prompt: "수아가 탐험에 관한 책을 집에 가져가 읽고 싶어요. 어느 기관에서 빌릴 수 있을까요?", answer: "공공 도서관", others: ["행정복지센터", "소방서", "보건소"], explanation: "공공 도서관은 주민이 책을 읽고 빌릴 수 있도록 도와요." },
        { prompt: "시에서 관리하는 공원의 그네가 고장 났어요. 어느 기관에 수리를 요청하면 좋을까요?", answer: "시청", others: ["보건소", "소방서", "공공 도서관"], explanation: "시청의 공원 담당 부서는 시에서 관리하는 공원 시설을 점검하고 수리해요." }
      ]
    },
    {
      icon: "🏅", title: "우리 동네 해결사", description: "지역의 문제를 어떻게 해결할지 생각해요.",
      questions: [
        { prompt: "주민들이 안전한 동네를 만들기 위해 할 수 있는 일은 무엇일까요?", answer: "고장 난 가로등을 발견하면 담당 기관에 알려요.", others: ["고장 난 가로등을 혼자 고쳐요.", "가로등 아래에 쓰레기를 버려요.", "가로등 스위치를 함부로 만져요."], explanation: "주민이 문제를 발견해 알리면 공공 기관에서 문제를 살펴보고 해결할 수 있어요." },
        { prompt: "동네에서 화재 예방 교육과 교통안전 교육을 열어요. 두 교육을 맡을 기관을 순서대로 고르세요.", answer: "소방서 → 경찰서", others: ["보건소 → 공공 도서관", "경찰서 → 소방서", "시청 → 보건소"], explanation: "소방서는 화재 예방을, 경찰서는 안전한 길 건너기와 같은 교통안전을 교육할 수 있어요." },
        { prompt: "시청이 누구나 쓰는 공원을 만들려고 해요. 어떻게 하면 주민에게 필요한 공원을 만들 수 있을까요?", answer: "여러 주민의 의견을 듣고 계획에 반영해요.", others: ["공원을 이용할 주민의 의견을 아예 듣지 않아요.", "담당자 한 사람이 좋아하는 시설만 만들어요.", "어린이와 어르신의 의견은 빼고 들어요."], explanation: "여러 주민의 의견을 들으면 나이와 생활 방식이 다른 사람들이 무엇을 필요로 하는지 알 수 있어요." },
        { prompt: "공공 기관이 우리 지역에 필요한 가장 큰 이유는 무엇일까요?", answer: "주민의 생활을 돕고 지역의 문제를 해결하기 위해서예요.", others: ["기관에서 일하는 사람만 돕기 위해서예요.", "모든 동네에 똑같은 건물을 짓기 위해서예요.", "주민이 모일 수 있는 곳을 줄이기 위해서예요."], explanation: "공공 기관은 안전, 건강, 문화 등 여러 분야에서 주민의 생활을 돕고 지역의 문제를 해결해요." }
      ]
    }
  ];

  const $ = (id) => document.getElementById(id);
  const storageKey = "public-institutions-explorer-v1";
  let records = loadRecords();
  let game = null;

  function loadRecords() {
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));
      return missions.map((mission, index) => {
        const score = saved?.[index];
        return Number.isInteger(score) && score >= 0 && score <= mission.questions.length ? score : null;
      });
    } catch {
      return missions.map(() => null);
    }
  }

  function nextMission(from = -1) {
    return missions.findIndex((_, index) => records[index] === null && index > from);
  }

  function show(screen) {
    for (const id of ["home", "play", "result"]) $(id).hidden = id !== screen;
    if (screen === "home") $("home-tab").setAttribute("aria-current", "page");
    else $("home-tab").removeAttribute("aria-current");
  }

  function renderHome(focus = true) {
    game = null;
    const count = records.filter((score) => score !== null).length;
    $("completed").textContent = `${count} / ${missions.length} 완료`;
    $("start-label").textContent = count === missions.length ? "탐험 기록 보기" : count ? "탐험 계속하기" : "탐험 시작하기";
    $("mission-grid").innerHTML = missions.map((mission, index) => {
      const score = records[index];
      return `<button class="mission" type="button" data-mission="${index}">
        <div class="mission-head"><span class="mission-icon" aria-hidden="true">${mission.icon}</span><span class="mission-label">미션 ${index + 1}</span></div>
        <h3>${mission.title}</h3><p>${mission.description}</p>
        <div class="mission-bottom"><span>${score === null ? `${mission.questions.length}문제` : `최고 ${score} / ${mission.questions.length}`}</span><strong>${score === null ? "도전하기" : "다시 도전"}</strong></div>
      </button>`;
    }).join("");
    show("home");
    if (focus) focusHeading("home-title");
  }

  function focusHeading(id) {
    window.scrollTo(0, 0);
    $(id).focus({ preventScroll: true });
  }

  function shuffle(choices) {
    const result = [...choices];
    for (let index = result.length - 1; index > 0; index--) {
      const other = Math.floor(Math.random() * (index + 1));
      [result[index], result[other]] = [result[other], result[index]];
    }
    return result;
  }

  function startMission(index) {
    game = { mission: index, question: 0, answers: [] };
    renderQuestion();
  }

  function renderQuestion() {
    const mission = missions[game.mission];
    const question = mission.questions[game.question];
    const last = game.question === mission.questions.length - 1;
    game.choices = shuffle([question.answer, ...question.others]);
    $("play").innerHTML = `
      <button class="back" type="button" data-home>탐험 지도로</button>
      <article class="quiz-card">
        <div class="quiz-top"><span>${mission.icon} 미션 ${game.mission + 1} · ${mission.title}</span><span>${game.question + 1} / ${mission.questions.length}</span></div>
        <progress aria-label="미션 진행률" value="${game.question + 1}" max="${mission.questions.length}"></progress>
        <h1 id="question-title" tabindex="-1">${question.prompt}</h1>
        <p class="question-note">알맞은 답을 하나 골라요.</p>
        <div class="options">${game.choices.map((choice, index) => `<button type="button" class="option" data-choice="${index}"><span aria-hidden="true" class="option-key">${index + 1}</span><span>${choice}</span></button>`).join("")}</div>
        <div id="feedback" role="status" aria-live="polite"></div>
        <div class="actions quiz-actions"><button type="button" id="next-question" class="primary" data-next hidden>${last ? "미션 결과 보기" : "다음 문제"}</button></div>
      </article>`;
    show("play");
    focusHeading("question-title");
  }

  function checkAnswer(index) {
    if (!game || game.answers.length > game.question) return;
    const question = missions[game.mission].questions[game.question];
    const chosen = game.choices[index];
    const correct = chosen === question.answer;
    game.answers.push(chosen);

    for (const option of $("play").querySelectorAll("[data-choice]")) {
      option.setAttribute("aria-disabled", "true");
      if (Number(option.dataset.choice) !== index) option.tabIndex = -1;
      const choice = game.choices[Number(option.dataset.choice)];
      if (choice === question.answer) {
        option.classList.add("correct");
        option.insertAdjacentHTML("beforeend", '<span class="mark">✓ 정답</span>');
      } else if (choice === chosen) {
        option.classList.add("incorrect");
        option.insertAdjacentHTML("beforeend", '<span class="mark">내 답</span>');
      }
    }
    const feedback = $("feedback");
    feedback.className = correct ? "feedback" : "feedback try-again";
    feedback.innerHTML = `<strong>${correct ? "정답이에요!" : `정답은 ‘${question.answer}’`}</strong><p>${question.explanation}</p>`;
    $("next-question").hidden = false;
  }

  function advance() {
    if (!game || game.answers.length <= game.question) return;
    const mission = missions[game.mission];
    if (game.question + 1 < mission.questions.length) {
      game.question++;
      renderQuestion();
      return;
    }
    const missed = mission.questions.filter((question, index) => question.answer !== game.answers[index]);
    const score = mission.questions.length - missed.length;
    records[game.mission] = Math.max(records[game.mission] ?? 0, score);
    try {
      localStorage.setItem(storageKey, JSON.stringify(records));
    } catch {
      // In-memory progress still works when the browser blocks local storage.
    }
    const upcoming = nextMission(game.mission);
    const next = upcoming === -1 ? nextMission() : upcoming;
    const followup = next === -1
      ? '<button type="button" class="primary" data-record>탐험 기록 보기</button>'
      : `<button type="button" class="primary" data-mission="${next}">미션 ${next + 1} 도전하기</button>`;
    $("result").innerHTML = `
      <button class="back" type="button" data-home>탐험 지도로</button>
      <article class="result-card">
        <div class="result-icon" aria-hidden="true">${missed.length ? "🌱" : "🏅"}</div>
        <p class="overline">미션 ${game.mission + 1} · ${mission.title}</p>
        <h1 id="result-title" tabindex="-1">미션을 마쳤어요!</h1>
        <p class="result-summary">${mission.questions.length}문제 중 <span class="score">${score}문제</span>를 맞혔어요. ${missed.length ? "아래에서 헷갈린 문제를 다시 살펴봐요." : "모든 문제를 맞혔어요!"}</p>
        ${missed.length ? `<details class="review" open><summary>틀린 문제 다시 보기 (${missed.length})</summary><ol>${missed.map((question) =>
          `<li><strong>${question.prompt}</strong><p>내 답 · ${game.answers[mission.questions.indexOf(question)]}</p><p>정답 · ${question.answer}</p><p>${question.explanation}</p></li>`).join("")}</ol></details>` : ""}
        <div class="actions">${followup}<button type="button" class="secondary" data-mission="${game.mission}">다시 도전하기</button></div>
      </article>`;
    show("result");
    focusHeading("result-title");
  }

  function renderRecords() {
    game = null;
    const total = missions.reduce((sum, mission) => sum + mission.questions.length, 0);
    const best = records.reduce((sum, score) => sum + (score ?? 0), 0);
    $("result").innerHTML = `
      <button class="back" type="button" data-home>탐험 지도로</button>
      <article class="result-card">
        <div class="result-icon" aria-hidden="true">🏆</div>
        <p class="overline">탐험 기록</p>
        <h1 id="result-title" tabindex="-1">우리 동네 탐험 완료!</h1>
        <p class="result-summary">세 미션의 최고 기록을 합하면 <span class="score">${total}문제 중 ${best}문제</span>를 맞혔어요.</p>
        <ol class="review">${missions.map((mission, index) => `<li>${mission.title} <strong class="score">${records[index]} / ${mission.questions.length}</strong></li>`).join("")}</ol>
        <div class="actions"><button type="button" class="primary" data-home>미션 다시 고르기</button></div>
      </article>`;
    show("result");
    focusHeading("result-title");
  }

  $("guide-grid").innerHTML = institutions.map(([icon, name, role]) =>
    `<article class="guide-item"><h3><span aria-hidden="true">${icon}</span> ${name}</h3><p>${role}</p></article>`).join("");
  $("open-guide").addEventListener("click", () => $("guide").showModal());
  $("home-tab").addEventListener("click", () => renderHome());
  $("brand").addEventListener("click", () => renderHome());
  $("start").addEventListener("click", () => {
    const next = nextMission();
    if (next === -1) renderRecords();
    else startMission(next);
  });
  document.querySelector("main").addEventListener("click", (event) => {
    const button = event.target.closest("button");
    if (!button) return;
    if ("home" in button.dataset) renderHome();
    if ("mission" in button.dataset) startMission(Number(button.dataset.mission));
    if ("choice" in button.dataset) checkAnswer(Number(button.dataset.choice));
    if ("next" in button.dataset) advance();
    if ("record" in button.dataset) renderRecords();
  });
  renderHome(false);
</script>
</body>
</html>
