<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="교사 스튜디오" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8ec"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
<linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#ffb000"/><stop offset=".5" stop-color="#ff4f7b"/><stop offset="1" stop-color="#3ec9ff"/></linearGradient>
<style>
.f{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif}
.t{font-weight:900;font-size:76px;fill:#141a33;letter-spacing:-1px}
.s{font-weight:600;font-size:28px;fill:#4a5480}
.k{font-weight:800;font-size:18px;letter-spacing:4px;fill:#4a5480}
.up{animation:up 1s cubic-bezier(.2,.9,.2,1) both}
.d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.fl{animation:fl 6s ease-in-out infinite}.fl2{animation:fl 7.5s ease-in-out infinite reverse}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(8deg)}}
.bar{transform-origin:110px 248px;animation:bar 1.2s .6s cubic-bezier(.2,.9,.2,1) both}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tw{animation:tw 2.4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
</style>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<g opacity="0.35">
<circle class="tw" cx="980" cy="70" r="3" fill="#ffd23f"/><circle class="tw" style="animation-delay:.8s" cx="1080" cy="140" r="2.5" fill="#3ec9ff"/><circle class="tw" style="animation-delay:1.4s" cx="900" cy="300" r="3" fill="#ff4f7b"/>
</g>
<g class="fl" style="transform-box:fill-box;transform-origin:center"><rect x="905" y="105" width="120" height="120" rx="26" fill="#ffb000"/><text class="f" x="965" y="186" text-anchor="middle" font-size="64">🎮</text></g>
<g class="fl2" style="transform-box:fill-box;transform-origin:center"><rect x="1040" y="180" width="100" height="100" rx="22" fill="#3ec9ff"/><text class="f" x="1090" y="248" text-anchor="middle" font-size="52">🎬</text></g>
<g class="fl" style="transform-box:fill-box;transform-origin:center;animation-delay:1s"><rect x="1010" y="40" width="80" height="80" rx="18" fill="#ff4f7b"/><text class="f" x="1050" y="96" text-anchor="middle" font-size="42">📚</text></g>
<text class="f k up" x="110" y="100">TEACHER STUDIO</text>
<text class="f t up d1" x="106" y="186">교사 스튜디오</text>
<rect class="bar" x="110" y="240" width="520" height="8" rx="4" fill="url(#hl)"/>
<text class="f s up d2" x="110" y="292">말 한 줄이면, 수업 자료가 상용 품질로.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>