.ts-big{font-family:var(--font-display);font-size:var(--t-q);text-align:center;line-height:1.2}
.ts-lockstrip{position:absolute;left:160px;top:180px;width:1600px;display:flex;gap:16px;justify-content:center}
.ts-lockstrip .ts-lock{width:200px;height:130px;flex-direction:row;gap:12px;border-radius:22px;border-width:5px}
.ts-lockstrip .ts-lock .ico{font-size:64px}
/* ---- theme layer: host character, bubble, side decoration (behind the scene, never blocks input) ---- */
#ts-deco{position:absolute;left:0;top:0;width:100%;height:100%;z-index:5;pointer-events:none;overflow:hidden}
.ts-host{position:absolute;left:-18px;bottom:-14px;width:300px;height:440px;transform-origin:0 100%;transform:scale(.64);transition:left .6s,bottom .6s,transform .6s}
.ts-host .f{display:none}
.ts-host[data-mood=idle] .f-idle,.ts-host[data-mood=happy] .f-happy,.ts-host[data-mood=sad] .f-sad,.ts-host[data-mood=wow] .f-wow{display:inline}
.ts-bob{width:300px;height:440px;animation:tsbob 3.2s ease-in-out infinite;transform-origin:50% 100%}
.ts-host.hop .ts-bob{animation:tshop .75s ease-out}
.ts-host svg{display:block;overflow:visible}
@keyframes tsbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes tshop{0%{transform:translateY(0) scale(1,1)}25%{transform:translateY(-46px) scale(.96,1.05)}55%{transform:translateY(0) scale(1.06,.94)}100%{transform:translateY(0) scale(1,1)}}
#ts-deco[data-scene=title] .ts-host,#ts-deco[data-scene=countdown] .ts-host{left:1400px;bottom:20px;transform:scale(1.02)}
#ts-deco[data-scene=result] .ts-host{left:70px;bottom:10px;transform:scale(.9)}
#ts-bubble{position:absolute;left:2px;bottom:318px;width:176px;max-width:176px;z-index:22;padding:8px 12px;border-radius:26px 26px 26px 6px;background:#fff;color:#1a1a1a;border:4px solid #1a1a1a;font-size:var(--t-s);font-weight:800;line-height:1.25;pointer-events:none;box-shadow:0 6px 0 rgba(0,0,0,.25);font-family:var(--font-body);text-align:center}
#ts-bubble.empty{display:none}
#ts-deco[data-scene=title]~#ts-bubble{display:none}
#ts-deco[data-scene=countdown]~#ts-bubble{left:1180px;bottom:480px;width:auto;max-width:480px}
#ts-deco[data-scene=result]~#ts-bubble{left:200px;bottom:430px;width:auto;max-width:420px}
/* ---- no flat title shine box on dark themes ---- */
.title.shine:after{display:none}
/* ---- themed cards: pattern + coloured edge (auto theme sets --ts-pat), card backs with emblem ---- */
body[data-auto] .card,body[data-auto] .ts-tile,body[data-auto] .ts-bin,body[data-auto] .choice{background-image:var(--ts-pat);background-size:44px 44px}
body[data-auto] .choice.correct,body[data-auto] .choice.wrong,body[data-auto] .ts-tile.done{background-image:none}
.ts-tile.back{background-color:var(--primary);background-image:var(--ts-pat-back,none);background-size:44px 44px;border-color:var(--text);box-shadow:inset 0 0 0 7px rgba(255,255,255,.4),0 8px 0 rgba(0,0,0,.28)}
.ts-emblem{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.ts-emblem svg{width:112px;height:112px;max-height:86%;filter:drop-shadow(0 4px 0 rgba(0,0,0,.28))}
/* ---- sort: big bins with a coloured lid, counters and a dragging cue ---- */
.ts-bin{position:relative;border-radius:14px 14px 44px 44px!important;border-style:solid!important;border-color:var(--bc,var(--cardBorder))!important;border-top-width:40px!important;border-bottom-width:12px!important;box-shadow:0 10px 0 rgba(0,0,0,.28);transition:transform .2s}
.ts-bin:before{content:"";position:absolute;left:50%;top:-58px;width:90px;height:14px;margin-left:-45px;border-radius:8px;background:var(--bc,var(--cardBorder))}
.ts-bin .ts-bin-n{position:absolute;right:62px;bottom:62px;font-size:var(--t-s);font-weight:800;opacity:.85}
.ts-bin.done{transform:scale(1.04)}
.ts-bin .ts-bin-k{position:absolute;left:24px;top:16px;min-width:56px;height:56px;line-height:52px;border:3px solid var(--cardBorder);border-radius:8px;font-size:var(--t-s);font-weight:800;text-align:center;opacity:.9;font-variant-numeric:tabular-nums}
.ts-hand{position:absolute;left:50%;margin-left:340px;top:100px;font-size:var(--t-c);animation:tsdrag 1.6s ease-in-out infinite;pointer-events:none}
@keyframes tsdrag{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,50px)}}
/* ---- TV parts: team podium row (bottom band) and wide host column (quiz/survival/escape on a board) ---- */
.ts-podiums{position:absolute;left:330px;bottom:0;width:1300px;height:56px;display:flex;gap:16px;justify-content:center}
.ts-pod{flex:1;max-width:340px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px;border-radius:14px 14px 0 0;background:rgba(10,6,32,.82);border:3px solid var(--tc);border-bottom:0;color:#fff;font-size:var(--t-s);font-weight:800;line-height:1;overflow:hidden;white-space:nowrap}
.ts-pod.on{box-shadow:0 0 24px var(--tc);background:rgba(40,20,70,.95)}
.ts-lamps{display:flex;gap:4px}
.ts-lamps i{display:block;width:12px;height:18px;border-radius:3px;background:#2d2440}
.ts-lamps i.lit{background:var(--tc);box-shadow:0 0 10px var(--tc)}
#ts-deco[data-scene=title] .ts-podiums,#ts-deco[data-scene=countdown] .ts-podiums,#ts-deco[data-scene=result] .ts-podiums{display:none}
body[data-hostcol="1"] .ts-wrap{left:340px;width:1460px}
body[data-hostcol="1"] .ts-q,body[data-hostcol="1"] .ts-grid,body[data-hostcol="1"] .ts-expl,body[data-hostcol="1"] .ts-teamrow,body[data-hostcol="1"] .ts-lockstrip{width:1460px}
body[data-hostcol="1"] .ts-lockstrip{left:340px}
body[data-hostcol="1"] #ts-deco .ts-host{transform:scale(.82)}
body[data-hostcol="1"] #ts-deco[data-scene=title] .ts-host,body[data-hostcol="1"] #ts-deco[data-scene=countdown] .ts-host{transform:scale(1.02)}
body[data-hostcol="1"] #ts-deco[data-scene=result] .ts-host{transform:scale(.9)}
body[data-hostcol="1"] #ts-bubble{left:70px;bottom:370px}
/* animation must not pin the end transform (variants rotate cards/buttons) */
.enter{animation-fill-mode:backwards}

/* Korean line breaking: break between words (spaces), never inside a word; very long words may still wrap */
#scene,#hud,#ts-bubble,.title,.subtitle,.btn,.choice,.card,.ts-tile{word-break:keep-all;overflow-wrap:break-word;word-wrap:break-word}
/* answer-state text always readable on the state colour (the engine skins force white with !important, so the selector is made stronger) */
body .choice.correct.correct.correct,body .ts-tile.done.done.done,body .ts-lock.open.open.open{color:var(--on-good)!important}
body .choice.wrong.wrong.wrong,body .ts-tile.bad.bad.bad{color:var(--on-bad)!important}

/* ---- phone held sideways (844x390: the 1920x1080 stage is shown at about 0.36x): touch targets >= 44 CSS px, small text lifted ---- */
body[data-device=phone][data-orient=landscape] .icon-btn{width:126px;height:126px;font-size:60px;margin-left:12px}
body[data-device=phone][data-orient=landscape] .hud-top{height:140px}
body[data-device=phone][data-orient=landscape] #ng-ctrl{top:6px!important}
body[data-device=phone][data-orient=landscape] .btn.small,body[data-device=phone][data-orient=landscape] .ts-next{min-height:126px;font-size:48px}
body[data-device=phone][data-orient=landscape] .ts-choice{min-height:126px}
body[data-device=phone][data-orient=landscape] .review li{font-size:38px}
body[data-device=phone][data-orient=landscape] .ts-expltext{font-size:max(var(--t-b),44px)}
body[data-device=phone][data-orient=landscape] .ts-chip{font-size:max(var(--t-s),40px)}
body[data-device=phone][data-orient=landscape] .team .tname{font-size:40px}

/* design system polish (shared/design/system.py): matte surfaces, one falling shadow, no coloured glow, no hollow type */
:root{--glow:none!important;--ds-shadow:0 18px 40px -22px rgba(0,0,0,.55);--ds-press:0 6px 0 rgba(0,0,0,.22)}
body{font-weight:500;font-synthesis:none;font-kerning:normal;line-break:strict;text-spacing-trim:space-first}
:root body .title{font-weight:760;letter-spacing:-.04em;line-height:1.1;-webkit-text-stroke:0;text-shadow:none;text-wrap:balance}
:root body .h1,:root body .h2{font-weight:800;letter-spacing:-.035em;text-wrap:balance;text-shadow:none}
:root body .btn,:root body .choice,:root body .badge,:root body .float,:root body .mark,:root body .tname{font-weight:800;letter-spacing:-.022em}
:root body .choice{text-wrap:balance}
:root body .review li{font-size:var(--t-s,34px);line-height:1.35}
:root body .tscore,:root body .timer,:root body #timer,:root body .ts-count,:root body .score{font-weight:800;font-variant-numeric:tabular-nums;font-feature-settings:'tnum','kern';text-shadow:none}
:root body .card,:root body .choice,:root body .ts-q,:root body .ts-tile,:root body .ts-bin,:root body .ts-explcard{box-shadow:var(--ds-shadow)}
:root body .btn{box-shadow:var(--ds-press)}:root body .btn:active,:root body .btn.pressed{box-shadow:0 2px 0 rgba(0,0,0,.22)}
:root body .btn.secondary{box-shadow:inset 0 0 0 3px var(--cardBorder)}
:root body .choice.correct{box-shadow:0 0 0 6px var(--good),var(--ds-shadow)!important}:root body .choice.wrong{box-shadow:0 0 0 6px var(--bad),var(--ds-shadow)!important}
:root body .badge.good,:root body .badge.bad,:root body .badge.info{box-shadow:var(--ds-shadow)}
:root body .team.turn{box-shadow:0 0 0 4px var(--primary);transform:scale(1.04)}
:root body .ts-pod.on{box-shadow:0 0 0 4px var(--tc)}:root body .ts-lamps i.lit{box-shadow:none}

/* LAYOUTS + COMPONENT VARIANTS - chosen by scripts/layout_auto.py (SPEC.layoutCfg), applied as body[data-*] attributes by core.js.
   Zones: the content area is x = --lx .. --lx+--lw, y = --ty .. 880 (the explanation card sits below at y 900-1020), so text never overlaps. */
body{--lx:160px;--lw:1600px;--ty:190px}
body[data-mech=escape]{--ty:340px}
body[data-hostcol="1"],body[data-lockpos=side]{--lx:340px;--lw:1460px}
body[data-lockpos=side] .ts-wrap{left:340px;width:1460px}
body[data-lockpos=side] .ts-q,body[data-lockpos=side] .ts-grid,body[data-lockpos=side] .ts-expl{width:1460px}
body[data-lockpos=side] .ts-lockstrip{left:50px;top:150px;width:250px;flex-direction:column;gap:8px;align-items:flex-start}
body[data-lockpos=side] .ts-lockstrip .ts-lock{width:200px;height:128px}
/* ---- quiz-like screens (quiz, escape, board question): ten compositions with DIFFERENT footprints ----
   Every layout places the question box (--q*) and the answer box (--a*) as fractions of the content area (x --lx.., y --ty..880), so the
   occupied cells really differ: full (stack, split) · upper band (poster) · lower third (news) · centre column · left / right column ·
   headline + rail · stair (two blocks on the diagonal) · bento. The free part of the stage is left to the scene and the host on purpose.
   Answer arrangement: row = one row of tiles · list = one column of bars · two = 2 x 2. */
body{--lh:calc(880px - var(--ty))}
body[data-layout] .ts-wrap.ts-ask{left:0!important;top:0!important;width:1920px!important;height:1080px!important;margin:0!important;display:block}
body[data-layout] .ts-ask>*{margin:0!important}
body[data-layout] .ts-ask .ts-expl{left:var(--lx)!important;bottom:60px!important;width:var(--lw)!important}
body[data-layout] .ts-ask .ts-q{position:absolute;left:calc(var(--lx) + var(--lw)*var(--qx));top:calc(var(--ty) + var(--lh)*var(--qy));width:calc(var(--lw)*var(--qw));height:calc(var(--lh)*var(--qh));min-height:0}
body[data-layout] .ts-ask .ts-grid,body[data-layout] .ts-ask .ts-oxrow{position:absolute;left:calc(var(--lx) + var(--lw)*var(--ax));top:calc(var(--ty) + var(--lh)*var(--ay));width:calc(var(--lw)*var(--aw));height:calc(var(--lh)*var(--ah))}
body[data-layout] .ts-ask .ts-grid{display:grid;grid-gap:16px}
body[data-layout] .ts-ask .ts-choice{height:100%;min-height:0}
body[data-layout] .ts-ask .ts-oxrow{gap:32px}
body[data-layout] .ts-ask .ts-ox{width:48%;height:100%;font-size:150px}
body[data-layout] .ts-ask .ts-chips{position:absolute;left:calc(var(--lx) + var(--lw)*var(--qx));top:calc(var(--ty) + var(--lh)*var(--qy) - 62px);justify-content:flex-start}
body[data-layout=split]{--qx:0;--qy:0;--qw:.46;--qh:1;--ax:.49;--ay:0;--aw:.51;--ah:1}
body[data-layout=bento]{--qx:0;--qy:0;--qw:.64;--qh:.46;--ax:0;--ay:.5;--aw:1;--ah:.5}
body[data-layout=news]{--qx:0;--qy:.74;--qw:1;--qh:.26;--ax:0;--ay:.34;--aw:1;--ah:.36}
body[data-layout=poster]{--qx:0;--qy:0;--qw:1;--qh:.38;--ax:0;--ay:.44;--aw:1;--ah:.32}
body[data-layout=column]{--qx:.19;--qy:0;--qw:.62;--qh:.44;--ax:.19;--ay:.47;--aw:.62;--ah:.53}
body[data-layout=left]{--qx:0;--qy:0;--qw:.58;--qh:.44;--ax:0;--ay:.47;--aw:.58;--ah:.53}
body[data-layout=right]{--qx:.42;--qy:0;--qw:.58;--qh:.44;--ax:.42;--ay:.47;--aw:.58;--ah:.53}
body[data-layout=rail]{--qx:0;--qy:0;--qw:.62;--qh:.56;--ax:.68;--ay:0;--aw:.32;--ah:1}
body[data-layout=stair]{--qx:0;--qy:0;--qw:.58;--qh:.44;--ax:.42;--ay:.52;--aw:.58;--ah:.48}
/* escape games (150px less height): the side layouts become one 76 % block, a two-line question over 2 x 2 one-line answers */
body[data-mech=escape][data-layout=left]{--qw:.76;--aw:.76;--qh:.4;--ay:.44;--ah:.56}
body[data-mech=escape][data-layout=right]{--qx:.24;--ax:.24;--qw:.76;--aw:.76;--qh:.4;--ay:.44;--ah:.56}
body[data-mech=escape][data-layout=column]{--qx:.12;--ax:.12;--qw:.76;--aw:.76;--qh:.4;--ay:.44;--ah:.56}
body[data-mech=escape][data-layout=column] .ts-ask .ts-chips{width:calc(var(--lw)*.76)}
/* list: one column of answer bars (split, column, left, right, rail) */
body[data-layout=split] .ts-ask .ts-grid,body[data-layout=column] .ts-ask .ts-grid,body[data-layout=left] .ts-ask .ts-grid,body[data-layout=right] .ts-ask .ts-grid,body[data-layout=rail] .ts-ask .ts-grid{grid-template-columns:1fr!important;grid-auto-rows:1fr}
body[data-layout=split] .ts-ask .ts-q,body[data-layout=left] .ts-ask .ts-q,body[data-layout=right] .ts-ask .ts-q,body[data-layout=rail] .ts-ask .ts-q,body[data-layout=stair] .ts-ask .ts-q{text-align:left;justify-content:flex-start}
/* tall narrow answer boxes stack O over X */
body[data-layout=split] .ts-ask .ts-oxrow,body[data-layout=rail] .ts-ask .ts-oxrow{flex-direction:column;gap:20px;justify-content:center}
body[data-layout=split] .ts-ask .ts-ox,body[data-layout=rail] .ts-ask .ts-ox{width:100%;height:calc(50% - 10px)}
/* row: one row of centred tiles (bento, news, poster) */
body[data-layout=bento] .ts-ask .ts-grid.c2,body[data-layout=news] .ts-ask .ts-grid.c2,body[data-layout=poster] .ts-ask .ts-grid.c2{grid-template-columns:1fr 1fr}
body[data-layout=bento] .ts-ask .ts-grid.c3,body[data-layout=news] .ts-ask .ts-grid.c3,body[data-layout=poster] .ts-ask .ts-grid.c3{grid-template-columns:repeat(3,1fr)}
body[data-layout=bento] .ts-ask .ts-grid.c4,body[data-layout=news] .ts-ask .ts-grid.c4,body[data-layout=poster] .ts-ask .ts-grid.c4,body[data-layout=bento] .ts-ask .ts-grid.c5,body[data-layout=news] .ts-ask .ts-grid.c5,body[data-layout=poster] .ts-ask .ts-grid.c5{grid-template-columns:repeat(4,1fr)}
body[data-layout=bento] .ts-ask .ts-choice,body[data-layout=news] .ts-ask .ts-choice{flex-direction:column;justify-content:center;text-align:center}
body[data-layout=bento] .ts-ask .ts-choice .mark,body[data-layout=news] .ts-ask .ts-choice .mark{margin-bottom:8px}
/* the right / wrong mark sits in the tile's corner, so a marked tile is exactly as tall as an unmarked one */
body[data-layout=bento] .ts-ask .ts-sym,body[data-layout=news] .ts-ask .ts-sym{position:absolute;right:16px;top:12px;padding:0;margin:0}
body[data-layout=news] .ts-ask .ts-choice .mark{width:64px;height:64px;font-size:42px}
/* two: 2 x 2 (stair always; column / left / right when the four answers are short: body[data-ans=two], decided from the content by layout_auto) */
body[data-layout=stair] .ts-ask .ts-grid,body[data-ans=two] .ts-ask .ts-grid.c4{grid-template-columns:1fr 1fr!important;grid-auto-rows:1fr}
/* longer answers: four slim bars in one column, in a wider block (70 %); the question card gives up some height (layout_auto allows it for a two-line question) */
body[data-ans=list][data-layout=left]{--qw:.7;--aw:.7;--qh:.3;--ay:.33;--ah:.67}
body[data-ans=list][data-layout=right]{--qx:.3;--ax:.3;--qw:.7;--aw:.7;--qh:.3;--ay:.33;--ah:.67}
body[data-ans=list][data-layout=column]{--qx:.15;--ax:.15;--qw:.7;--aw:.7;--qh:.3;--ay:.33;--ah:.67}
body[data-ans=list][data-layout=column] .ts-ask .ts-chips{width:calc(var(--lw)*.7)}
body[data-ans=list] .ts-ask .ts-grid{grid-gap:12px}
body[data-ans=list] .ts-ask .ts-choice{padding:8px 24px}
body[data-ans=list] .ts-ask .ts-choice .mark{width:56px;height:56px;font-size:38px;margin-right:20px}
/* bento: the info chips become a tile beside the question */
body[data-layout=bento] .ts-ask .ts-chips{left:calc(var(--lx) + var(--lw)*.66);top:var(--ty);width:calc(var(--lw)*.34);flex-direction:column;align-items:stretch;gap:16px}
body[data-layout=bento] .ts-ask .ts-chip{text-align:center}
body[data-mech=escape][data-layout=bento] .ts-ask .ts-q{width:var(--lw)}
/* news: a lower third. The upper part of the stage stays open; the question is the banner under the answers */
body[data-layout=news] .ts-ask .ts-chips{top:calc(var(--ty) + var(--lh)*.34 - 62px)}
body[data-layout=news] .ts-ask .ts-q{text-align:left;justify-content:flex-start;border-radius:8px;border-left:30px solid var(--primary)}
/* poster: the question is type on the paper across the top, answers a pill row under it, the foot stays open */
body[data-layout=poster] .ts-ask .ts-q{text-align:left;justify-content:flex-start;background:transparent!important;background-image:none!important;border:none!important;box-shadow:none!important;color:var(--text)!important;border-bottom:14px solid var(--primary)!important;border-radius:0!important;padding-left:8px}
body[data-layout=poster] .ts-ask .ts-choice{border-radius:40px;justify-content:center;text-align:center;padding:8px 24px}
body[data-layout=poster] .ts-ask .ts-choice .mark{width:64px;height:64px;font-size:42px;margin-right:16px}
/* column: everything on the centre axis */
body[data-layout=column] .ts-ask .ts-chips{width:calc(var(--lw)*.62);justify-content:center}
/* rail: the question is a headline block, the answers a rail down the right edge */
body[data-layout=rail] .ts-ask .ts-q{border-left:14px solid var(--primary)}
/* stair: question up left, answers down right */
body[data-layout=stair] .ts-ask .ts-choice{justify-content:flex-start}
/* ---- answer button styles ---- */
body[data-choice=pill] .choice{border-radius:72px;padding-left:32px;padding-right:32px}
body[data-choice=tile] .choice{border-radius:10px;border-bottom-width:10px}
body[data-choice=stamp] .choice{border:4px solid var(--cardText);border-radius:14px;box-shadow:8px 8px 0 var(--cardText)!important}
/* "neon" = a matte hairline tile with an accent edge (the glowing version was retired) */
body[data-choice=neon] .choice{border:2px solid var(--cardBorder);border-left:8px solid var(--primary);border-radius:8px;box-shadow:none!important}
body[data-choice=note] .choice{border-radius:6px 6px 6px 40px;border-width:3px}
body[data-choice] .choice.correct,body[data-choice] .choice.wrong{transform:none}
/* ---- card styles (question card, match/bingo tiles, sort bins) ---- */
body[data-card=round] .ts-q,body[data-card=round] .ts-tile{border-radius:40px}
body[data-card=ticket] .ts-q,body[data-card=ticket] .ts-tile{border-radius:12px;clip-path:polygon(0 0,100% 0,100% 38%,99% 50%,100% 62%,100% 100%,0 100%,0 62%,1% 50%,0 38%)}
body[data-card=polaroid] .ts-q,body[data-card=polaroid] .ts-tile{border:12px solid #fbfbf8;border-bottom-width:40px}
body[data-card=hex] .ts-tile{clip-path:polygon(7% 0,93% 0,100% 50%,93% 100%,7% 100%,0 50%)}
body[data-card=hex] .ts-q{clip-path:polygon(2% 0,98% 0,100% 50%,98% 100%,2% 100%,0 50%)}
/* ---- scoreboards (HUD) ---- */
/* "led" = a matte scoreboard panel: tabular figures in the primary colour, no glow, no mono face */
body[data-score=led] .team{border-radius:6px;background:#0d0e10;border:2px solid #2c2f34}
body[data-score=led] .team .tscore{color:var(--primary);letter-spacing:.02em}
body[data-score=led] .team .tname{color:#e8e6e0}
body[data-score=chalk] .team{border-radius:14px;background:rgba(255,255,255,.07);border:3px dashed rgba(255,255,255,.75)}
body[data-score=sticker] .team{background:var(--primary);color:var(--btnText);border-radius:14px;box-shadow:0 6px 0 rgba(0,0,0,.22)}
body[data-score=banner] .team{border-radius:0 30px 30px 0;background:var(--card);color:var(--cardText);border-left:14px solid var(--primary)}
/* ---- title treatments ---- */
/* "outline" = a filled title under a short accent rule (hollow outlined type was retired) */
body[data-title=outline] .title:before{content:"";display:block;width:120px;height:8px;margin:0 auto 28px;background:var(--primary)}
/* "stack3d" = ONE flat offset in a neutral tone (the three-layer 3D shadow was retired) */
body[data-title=stack3d] .title{text-shadow:0 .05em 0 rgba(0,0,0,.22)}
body[data-title=stamp] .title{display:inline-block;background:var(--primary);color:var(--btnText);padding:8px 48px 16px;border-radius:calc(var(--radius,16px)*.5)}
body[data-title=underline] .title:after{content:"";display:block;height:8px;margin:24px auto 0;width:160px;background:var(--primary)}
body[data-title-scale=lg] .title{font-size:calc(var(--t-title)*1.18)}
body[data-title-scale=sm] .title{font-size:calc(var(--t-title)*.86)}
body[data-scene=title][data-tpos=left] #scene .screen{align-items:flex-start;padding-left:232px;text-align:left}
body[data-scene=title][data-tpos=left] #scene .row{justify-content:flex-start}
body[data-scene=title][data-tpos=top] #scene .screen{justify-content:flex-start;padding-top:200px}
/* ---- survival team row variants ---- */
body[data-sv=bridge] .ts-teambox:nth-child(odd){transform:translateY(-30px)}
body[data-sv=bridge] .ts-teambox:nth-child(even){transform:translateY(30px)}
body[data-sv=stagger] .ts-teambox:nth-child(odd){transform:rotate(-2deg)}
body[data-sv=stagger] .ts-teambox:nth-child(even){transform:rotate(2deg)}
body[data-sv=arena] .ts-teamrow{background:rgba(0,0,0,.2);border:6px dashed var(--cardBorder);border-radius:150px;padding:24px 40px}
/* ---- shelves, belts ---- */
.ts-plank{position:absolute;height:16px;border-radius:6px;background:linear-gradient(var(--cardBorder),rgba(0,0,0,.45));box-shadow:0 8px 0 rgba(0,0,0,.25)}
.ts-belt{position:absolute;left:150px;top:190px;width:1300px;height:26px;border-radius:14px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.55) 0 40px,rgba(255,255,255,.22) 40px 80px);box-shadow:0 8px 0 rgba(0,0,0,.3);animation:tsbelt 1.4s linear infinite}
@keyframes tsbelt{to{background-position:80px 0}}
.ts-slidein{animation:tsslide .7s cubic-bezier(.22,1,.36,1) both}
@keyframes tsslide{from{margin-left:-900px;opacity:0}to{margin-left:0;opacity:1}}
body[data-sortv=shelves] .ts-bin{border-radius:6px!important;border-top-width:14px!important;background-image:repeating-linear-gradient(0deg,transparent 0 84px,rgba(0,0,0,.18) 84px 90px)}
body[data-sortv=shelves] .ts-bin:before{display:none}
.ts-custom{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.ts-custom svg{width:100%;height:100%}

/* ---- style packs: one per entry of the style taxonomy (shared/design/styles.py). Each is a STRUCTURE (edge, radius, line, shadow rule),
   not a recolour, and every surface is matte: one neutral falling or offset shadow at most, never a coloured glow (shared/design/DESIGN-RULES.md). ---- */
/* 먹빛 테크: hairline tiles, 6px corners, an accent edge on the question, tracked small labels */
body[data-style=neon] .card,body[data-style=neon] .ts-tile,body[data-style=neon] .choice,body[data-style=neon] .ts-bin{border:2px solid var(--cardBorder)!important;border-radius:6px!important;box-shadow:none!important;background-image:none!important}
body[data-style=neon] .ts-q{border-left:8px solid var(--primary)!important}
body[data-style=neon] .team .tname,body[data-style=neon] .ts-meta{letter-spacing:.06em}
body[data-style=neon] .btn{border-radius:6px}
/* 먹과 놋쇠: a brass line + an inset second line, square corners, lighter serif title */
body[data-style=gold] .ts-q,body[data-style=gold] .ts-tile{border:2px solid var(--primary)!important;outline:1px solid rgba(215,172,104,.45);outline-offset:-12px;border-radius:2px!important;box-shadow:none!important}
body[data-style=gold] .choice,body[data-style=gold] .ts-bin{border:2px solid var(--cardBorder)!important;border-radius:2px!important;box-shadow:none!important}
body[data-style=gold] .title{font-weight:600;letter-spacing:-.02em}
body[data-style=gold] .btn{border-radius:2px}
/* 팝 블록: sticker cards, 4px ink line + one ink offset */
body[data-style=pop] .card,body[data-style=pop] .ts-tile,body[data-style=pop] .choice,body[data-style=pop] .ts-bin{border:4px solid var(--cardText)!important;box-shadow:8px 8px 0 var(--cardText)!important;border-radius:20px}
/* 축제 포스터: borderless paper cards with a coral top edge */
body[data-style=party] .card,body[data-style=party] .ts-tile,body[data-style=party] .choice,body[data-style=party] .ts-bin{border:0!important;border-radius:28px}
body[data-style=party] .ts-q{border-top:10px solid var(--primary)!important}
/* 스튜디오 쇼: scoreboard panels, amber left edge on the question */
body[data-style=show] .card,body[data-style=show] .ts-tile,body[data-style=show] .choice,body[data-style=show] .ts-bin{border:2px solid var(--cardBorder)!important;border-radius:10px!important}
body[data-style=show] .ts-q{border-left:14px solid var(--primary)!important}
/* 소프트 뎁스: matte panels lifted by one deep soft shadow (no blur, no translucent glass) */
body[data-style=glass] .card,body[data-style=glass] .ts-tile,body[data-style=glass] .choice,body[data-style=glass] .ts-bin,body[data-style=glass] .ts-explcard{background-image:none!important;border:1px solid rgba(255,255,255,.09)!important;box-shadow:0 34px 60px -34px rgba(0,0,0,.8)!important;border-radius:28px}
body[data-style=glass] .choice.correct,body[data-style=glass] .ts-tile.done{background:var(--good)!important;color:var(--on-good)}
body[data-style=glass] .choice.wrong,body[data-style=glass] .ts-tile.bad{background:var(--bad)!important;color:var(--on-bad)}
/* 만화 컷: comic panels, 4px ink line + ink offset, flat title offset */
body[data-style=anime] .card,body[data-style=anime] .ts-tile,body[data-style=anime] .choice,body[data-style=anime] .ts-bin{border:4px solid var(--cardText)!important;box-shadow:6px 6px 0 var(--cardText)!important;border-radius:12px}
body[data-style=anime] .title{text-shadow:.045em .045em 0 var(--primary)}
/* 파스텔: fully rounded, a soft tonal step under each card */
body[data-style=pastel] .card,body[data-style=pastel] .ts-tile,body[data-style=pastel] .choice,body[data-style=pastel] .ts-bin{border-radius:40px!important;box-shadow:0 8px 0 rgba(149,64,116,.16)!important}
/* 픽셀: square, hard one-step shadow, open tracking */
body[data-style=pixel] .card,body[data-style=pixel] .ts-tile,body[data-style=pixel] .choice,body[data-style=pixel] .ts-bin,body[data-style=pixel] .btn{border-radius:0!important;border-width:4px!important;box-shadow:6px 6px 0 #000!important;clip-path:none}
body[data-style=pixel] .title{letter-spacing:.02em;text-shadow:.05em .05em 0 #000}
/* 에디토리얼: 2px ink line, no shadow, tight title */
body[data-style=minimal] .card,body[data-style=minimal] .ts-tile,body[data-style=minimal] .choice,body[data-style=minimal] .ts-bin{border-width:2px!important;box-shadow:none!important;border-radius:2px!important}
body[data-style=minimal] .title{font-weight:700;letter-spacing:-.04em}
body[data-style=minimal] .btn{box-shadow:none!important;border-radius:2px}
/* 칠판: dashed chalk frames */
body[data-style=chalk] .card,body[data-style=chalk] .ts-tile,body[data-style=chalk] .choice,body[data-style=chalk] .ts-bin{border:3px dashed rgba(233,243,238,.8)!important;border-radius:14px;box-shadow:none!important;background-image:none!important}
/* 자연: quiet 2px line, soft corners, no shadow */
body[data-style=nature] .card,body[data-style=nature] .ts-tile,body[data-style=nature] .choice,body[data-style=nature] .ts-bin{border:2px solid var(--cardBorder)!important;border-radius:20px!important;box-shadow:none!important}

/* TS:JUICE CSS v1 - styles for the Game Wow kit. No animation here flashes: nothing loops faster than 1/s. */
.juice-fx{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:9500}
.juice-flash{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:9400;opacity:0}
.juice-impact{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:9400;opacity:0;
  background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.0) 0deg 5deg,rgba(255,255,255,.22) 5deg 6.5deg);
  -webkit-mask-image:radial-gradient(circle at 50% 50%,transparent 38%,#000 85%);mask-image:radial-gradient(circle at 50% 50%,transparent 38%,#000 85%)}
.juice-live{position:fixed;left:0;top:0;right:0;height:0;pointer-events:none;z-index:9600}
.juice-banner{position:fixed;left:50%;top:15%;transform:translate(-50%,0);padding:12px 40px;border-radius:999px;font-weight:800;font-size:clamp(34px,4vw,76px);line-height:1.2;white-space:nowrap;
  background:var(--card,#fff);color:var(--cardText,#222);border:6px solid var(--accent,#ffd447);box-shadow:0 10px 30px rgba(0,0,0,.28);word-break:keep-all}
.juice-banner.t2{border-color:var(--primary,#4a8);font-size:clamp(40px,4.6vw,88px)}
.juice-banner.t3{border-color:var(--good,#3c8);font-size:clamp(44px,5.2vw,100px);padding:16px 56px}
.juice-paper{position:fixed;left:0;top:0;right:0;bottom:0;z-index:9300;pointer-events:none;filter:drop-shadow(0 0 10px rgba(0,0,0,.3))}
.juice-slash{position:fixed;height:6px;border-radius:3px;background:#fff;box-shadow:0 0 12px #fff;z-index:9100;pointer-events:none;transform-origin:left center}
.juice-orbit,.juice-dial{display:block;color:var(--text,#222)}
.juice-sketch{z-index:1}
/* press feel: hover 1.05 / press 0.95, back-out 120ms. Responds on pointerdown (no JS in the way). */
.juice-on .btn,.juice-on .choice,.juice-on .juice-toggle{transition:transform 120ms cubic-bezier(.34,1.56,.64,1),box-shadow 120ms ease}
@media (hover:hover){.juice-on .btn:hover:not(:active),.juice-on .choice:hover:not(:active):not(.correct):not(.wrong){transform:scale(1.05)}}
.juice-on .btn:active,.juice-on .choice:active,.juice-on .juice-toggle:active{transform:scale(.95)!important}
.juice-on .timer.warn>i{animation:none!important} /* gentle pulse on the number instead of blinking */
.juice-toggles{display:flex;gap:12px;flex-wrap:wrap}
.juice-toggle{min-height:56px;min-width:56px;padding:8px 24px;border-radius:14px;border:3px solid currentColor;background:transparent;color:inherit;font:inherit;font-weight:800;font-size:34px;cursor:pointer}
/* podium (teams only; 3rd -> 2nd -> 1st) */
.juice-podium{display:flex;flex-direction:column;align-items:center;gap:16px}
.jp-stage{display:flex;align-items:flex-end;justify-content:center;gap:28px;min-height:420px}
.jp-rest{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;visibility:hidden}
.jp-chip{padding:8px 24px;border-radius:999px;background:var(--card,#fff);color:var(--cardText,#222);border:3px solid var(--cardBorder,#ccc);font-size:34px;font-weight:800}
.jp-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:260px}
.jp-who{display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:40px;line-height:1.2;margin-bottom:8px;word-break:keep-all}
.jp-ico{font-size:72px;line-height:1}
.jp-block{width:240px;border-radius:18px 18px 6px 6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:16px;color:var(--on-podium,#fff);font-weight:800;box-shadow:inset 0 -10px 0 rgba(0,0,0,.18);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.jp-rank{font-size:64px;line-height:1}
.jp-score{font-size:40px;line-height:1.3}
.jp-col.r1 .jp-who{font-size:48px}
.jp-col.r1 .jp-block{width:280px}
/* reduced motion / "효과 줄이기": nothing moves or loops; effects become still states */
.juice-reduce .juice-banner,.juice-reduce .juice-paper,.juice-reduce .juice-impact{animation:none!important}
.juice-reduce *{scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){.juice-on .btn,.juice-on .choice{transition:none}.juice-on .btn:hover,.juice-on .choice:hover{transform:none}}

  space:    {bpm:100, chords:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]], arp:[0,2,1,2], bass:"long", drums:"soft", wave:"sine"},
  cute:     {bpm:120, chords:[[65,69,72],[62,65,69],[58,62,65],[60,64,67]], arp:[0,1,2,1], bass:"bounce", drums:"soft", wave:"triangle"},
  korean:   {bpm:96,  chords:[[62,64,67],[60,62,67],[57,60,62],[60,62,64]], arp:[0,1,2,1], bass:"long", drums:"janggu", wave:"triangle"},
  sports:   {bpm:140, chords:[[60,64,67],[60,64,67],[65,69,72],[67,71,74]], arp:[0,0,2,1], bass:"oct", drums:"pop"},
  mystery:  {bpm:92,  chords:[[57,60,64],[57,60,65],[56,59,64],[55,58,62]], arp:[0,2,1,2], bass:"long", drums:"soft", wave:"triangle"},
  nature:   {bpm:104, chords:[[60,64,67],[65,69,72],[62,65,69],[67,71,74]], arp:[0,1,2,1], bass:"bounce", drums:"soft", wave:"sine"},
  tension:  {bpm:150, chords:[[57,60,64],[57,60,64],[58,62,65],[56,59,64]], arp:[0,1,0,2], bass:"oct", drums:"pop"}
};
var music = NG.music = {on:false, mood:null, step:0, next:0, timer:null};

  music.stop(); music.mood = MOODS[mood] ? mood : "upbeat"; music.on = true; music.step = 0; music.next = ctx.currentTime + 0.1;

};
music.stop = function(){ music.on = false; if (music.timer) clearInterval(music.timer); music.timer = null; };

  if (!music.on || !A.ctx) return;
  var m = MOODS[music.mood]; var spb = 60 / (m.bpm * (music.tempoMult || 1)) / 4; // 16th note
  while (music.next < A.ctx.currentTime + 0.12){
    if (!NG.paused && !A.muted){

      if (m.bass === "long" && s === 0) tone({type:"triangle", freq:note(ch[0] - 24), dur:spb * 15, vol:0.45, delay:d, jitter:0, bus:A.musicGain, attack:0.05});
      if (m.bass === "bounce" && s % 4 === 0) tone({type:"triangle", freq:note(ch[s % 8 ? 2 : 0] - 24), dur:spb * 2, vol:0.45, delay:d, jitter:0, bus:A.musicGain});
      if (m.drums === "pop"){ if (s % 8 === 0) tone({type:"sine", freq:150, slide:40, dur:0.15, vol:0.7, delay:d, jitter:0, bus:A.musicGain}); if (s % 8 === 4) tone({type:"noise", freq:1800, dur:0.1, vol:0.35, delay:d, bus:A.musicGain}); if (s % 2 === 1) tone({type:"noise", freq:7000, dur:0.03, vol:0.12, delay:d, filter:"highpass", bus:A.musicGain}); }
      if (m.drums === "soft"){ if (s % 8 === 0) tone({type:"sine", freq:110, slide:40, dur:0.2, vol:0.45, delay:d, jitter:0, bus:A.musicGain}); if (s % 4 === 2) tone({type:"noise", freq:6000, dur:0.03, vol:0.08, delay:d, filter:"highpass", bus:A.musicGain}); }

  }
}

NG.button = function(el, fn){

  if (!/^(BUTTON|A|INPUT|SELECT|TEXTAREA)$/.test(el.tagName)){  /* keyboard path: a plain box that acts as a button can be reached with Tab and pressed with Enter / Space */
    if (!el.hasAttribute("tabindex")) el.setAttribute("tabindex", "0");
    if (!el.hasAttribute("role")) el.setAttribute("role", "button");
    el.setAttribute("data-kb", "1");
    el.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " "){ e.preventDefault(); e.stopPropagation(); el.click(); } });
  }

};

function toggleFull(){
  var d = document, el = d.documentElement;
  try {
    if (!d.fullscreenElement && !d.webkitFullscreenElement){ var p = (el.requestFullscreen || el.webkitRequestFullscreen); if (p){ var r = p.call(el); if (r && r.catch) r.catch(function(){ FX.toast("F11 키로 전체 화면을 켜 주세요"); }); } else FX.toast("F11 키로 전체 화면을 켜 주세요"); }
    else { (d.exitFullscreen || d.webkitExitFullscreen).call(d); }
  } catch(e){ FX.toast("F11 키로 전체 화면을 켜 주세요"); }

/* timer: per-question countdown with warning beeps, pause-aware */
var Timer = NG.timer = {left:0, total:0, running:false, onEnd:null, _upd:null, lastSec:-1};
Timer.start = function(sec, onEnd){
  Timer.stop(); if (!sec) return; Timer.total = sec; Timer.left = sec; Timer.running = true; Timer.onEnd = onEnd; Timer.lastSec = -1;
  Timer._upd = NG.onUpdate(function(dt){
    if (!Timer.running) return; Timer.left = Math.max(0, Timer.left - dt);
    var sec2 = Math.ceil(Timer.left); if (sec2 !== Timer.lastSec){ Timer.lastSec = sec2; if (sec2 <= 5 && sec2 > 0) NG.sfx("warn"); }
    Timer._renderInto();
    if (Timer.left <= 0){ Timer.running = false; NG.offUpdate(Timer._upd); var f = Timer.onEnd; Timer.onEnd = null; if (f) f(); }
  });
  Timer._renderInto();
};
Timer.stop = function(){ Timer.running = false; if (Timer._upd) NG.offUpdate(Timer._upd); Timer._upd = null; var t = hudEl.querySelector(".timer"); if (t) t.remove(); var n = hudEl.querySelector(".timer-num"); if (n) n.remove(); };
Timer.add = function(sec){ if (Timer.running){ Timer.left += sec; Timer.total = Math.max(Timer.total, Timer.left); FX.toast("+" + sec + "초"); } };
Timer._renderInto = function(){
  if (!Timer.running || !HUD.show) return;
  var t = hudEl.querySelector(".timer"), n = hudEl.querySelector(".timer-num");
  if (!t){ t = U.h("div", {class:"timer"}, "<i></i>"); n = U.h("div", {class:"timer-num"}); hudEl.appendChild(t); hudEl.appendChild(n); }
  t.firstChild.style.transform = "scaleX(" + (Timer.left / Timer.total).toFixed(3) + ")";
  t.classList.toggle("warn", Timer.left <= 5); n.textContent = Math.ceil(Timer.left);
};

/* ADAPTER juice-game - wires the shared Game Wow kit (shared/juice/juice.js) into the engine, so ALL mechanics get the same feel:
   correct = squash + hit-stop + particles + kick + 3-layer chime (pitch rises with the streak), wrong = one soft shake + icon + text,
   streak tiers 3/5/10, last-5s timer swell, tempo ramp before the last question, final reveal (drumroll -> decelerating number -> burst)
   and a team podium (3rd -> 2nd -> 1st). White-hat only: praise and progress, no loss messaging, no individual ranking of low scores.
   Runs last (after mechanic + theme), only wraps engine hooks, and does nothing when the kit is missing. */
(function(){
  var J = window.Juice; if (!J) return;
  var FX = NG.fx, P = J.params, lastEl = null, suppress = false, streakNow = false;
  J.configure({ sound: { master: 0.3 } });                       /* match the engine's own SFX/music bus balance (SFX about 2x music) */
  J.install({ camera: NG.el.scene });
  J.hooks.reduced = function(){ return !!(NG.reduceMotion || NG.calm); };
  J.hooks.muted = function(){ return !!(NG.audio && NG.audio.muted); };
  J.hooks.lite = function(){ return !!NG.lite; };
  var hs = FX.hitstop; J.hooks.hitstop = function(ms){ hs(ms); };
  function toClient(x, y){ var r = NG.el.stage.getBoundingClientRect(), s = NG.scale || 1; return { x: r.left + x * s, y: r.top + y * s }; }

  FX.wobble = function(el){ J.shakeEl(el, P.wrong.shakePx, P.wrong.ms); };
  FX.pop = function(el){ J.squash(el); };
  FX.press = function(el){ J.press(el); };

      host = document.createElement("div"); host.className = "juice-podium-host"; bars.parentNode.replaceChild(host, bars);
