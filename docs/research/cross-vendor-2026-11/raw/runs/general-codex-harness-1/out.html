:root {
  --ink:#172e2b; --muted:#475e56; --paper:#eff3ec; --white:#fff;
  --line:#c8d4cc; --green:#214e41; --soft:#e2ede6;
  --night:#102a25; --court:#193b32; --light:#f3f8ef; --lime:#d8edac;
  color-scheme:light;
  font-family:"TS Sans","Malgun Gothic",sans-serif;
  color:var(--ink); background:var(--paper);
  word-break:keep-all; line-break:strict; line-height:1.5;
}
*,*::before,*::after { box-sizing:border-box; }
[hidden] { display:none !important; }
body { margin:0; }
button,textarea,select { font:inherit; color:inherit; }
button,select { min-height:44px; }
button { cursor:pointer; font-weight:700; }
button:disabled { cursor:default; opacity:.56; }
button:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible {
  outline:3px solid #ac651f; outline-offset:3px;
}
.shell { max-width:1440px; margin:auto; padding:0 32px; }
.mast { background:var(--night); color:var(--light); border-bottom:4px solid #a9c37b; }
.mast .shell { padding-top:24px; padding-bottom:24px; }
h1,h2,h3,p { margin:0; }
h1 { font-size:clamp(26px,4vw,48px); line-height:1.15; letter-spacing:-.04em; }
h2 { font-size:clamp(24px,3vw,34px); line-height:1.25; letter-spacing:-.03em; }
h3 { font-size:18px; }
.view-nav { display:flex; gap:8px; margin:16px 0; }
.view-nav button,.secondary {
  background:var(--white); border:1px solid var(--line); padding:8px 16px; border-radius:8px;
}
.view-nav [aria-pressed="true"],.primary {
  background:var(--green); color:var(--white); border:1px solid var(--green);
  border-radius:8px; padding:8px 16px;
}
.layout { display:grid; grid-template-columns:264px minmax(0,1fr); gap:24px; align-items:start; padding-bottom:32px; }
.setup,.draw { background:var(--white); border:1px solid var(--line); border-radius:12px; }
.setup { padding:16px; display:grid; gap:12px; }
.setup label { display:block; font-weight:700; }
.setup small,.muted { color:var(--muted); }
.setup small { display:block; }
textarea,select { width:100%; background:white; border:1px solid #879e93; border-radius:8px; padding:8px 12px; }
textarea { display:block; resize:vertical; min-height:88px; }
.control-row { display:flex; gap:8px; flex-wrap:wrap; }
.control-row > * { flex:1 1 auto; }
.error { color:#8e2c22; font-weight:700; overflow-wrap:anywhere; }
.draw { padding:24px; }
.section-top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
.summary { margin:8px 0 16px; color:var(--muted); }
.champion {
  margin:0 0 16px; padding:8px 12px; background:var(--soft);
  border-left:4px solid var(--green); border-radius:4px; font-weight:700; overflow-wrap:anywhere;
}
.rounds { display:grid; grid-template-columns:repeat(var(--rounds,1),minmax(0,1fr)); gap:12px; }
.round { min-width:0; display:flex; flex-direction:column; }
.round h3 { border-bottom:2px solid var(--green); padding-bottom:8px; margin-bottom:12px; }
.matches { display:flex; flex-direction:column; justify-content:space-around; flex:1; gap:8px; }
.match { color:var(--ink); background:#f5f8f4; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
button.match { width:100%; text-align:left; padding:0; }
button.match:hover { border-color:var(--green); background:var(--soft); }
.match-meta { display:flex; justify-content:space-between; flex-wrap:wrap; gap:0 8px; font-size:13px; padding:4px 8px; color:var(--muted); }
.entrant { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:4px 8px; min-height:32px; font-weight:600; border-top:1px solid #dce5de; }
.entrant span:first-child { min-width:0; overflow-wrap:anywhere; }
.entrant.winner { background:var(--soft); font-weight:800; }
.mark { font-size:13px; flex-shrink:0; }
.match-scores { display:block; padding:4px 8px; font-size:13px; border-top:1px solid var(--line); }
.score-view { padding-bottom:24px; }
.scoreboard { background:var(--night); color:var(--light); padding:24px; border-radius:12px; }
.score-head { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
.score-head label { flex:1 1 220px; max-width:560px; font-weight:700; }
.score-head select { margin-top:4px; background:var(--court); color:var(--light); border-color:#8aa89a; }
.score-head button,.score-tools button { background:var(--court); color:var(--light); border:1px solid #8aa89a; }
.score-head button:hover,.score-tools button:hover { background:#2b5547; }
.board-hint { margin:8px 0; }
.scores { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.side { background:var(--court); border:1px solid #5d8271; border-top:4px solid #b7d6c1; border-radius:12px; text-align:center; padding:12px; min-width:0; }
.side:last-child { border-top-color:#ddc299; }
.side h3 { font-size:clamp(19px,3vw,40px); overflow-wrap:anywhere; }
.side .points { display:block; font-size:clamp(76px,18vw,248px); font-weight:700; line-height:.95; letter-spacing:-.05em; font-variant-numeric:tabular-nums; margin:12px 0; }
.side .games { display:block; margin:0 0 12px; font-weight:700; }
.side button { background:var(--lime); color:var(--night); border:0; border-radius:8px; width:100%; min-height:56px; font-size:clamp(18px,2vw,26px); }
.side button:hover { background:#f0ffd3; }
.score-status { margin:12px 0; font-size:clamp(16px,2vw,24px); font-weight:700; overflow-wrap:anywhere; }
.game-scores { margin-bottom:12px; }
.score-tools { display:flex; flex-wrap:wrap; gap:8px; }
.score-tools .action { background:var(--lime); color:var(--night); border-color:var(--lime); }
.score-tools .action:hover { background:#f0ffd3; }
.keys { margin-top:12px; color:#d2e2d9; font-size:14px; }
.scoreboard:fullscreen { border-radius:0; overflow:auto; padding:max(16px,3vh) max(16px,5vw); }
.scoreboard:fullscreen .points { font-size:clamp(76px,min(20vw,35vh),320px); }
dialog { width:min(400px,calc(100% - 32px)); border:1px solid var(--line); border-radius:12px; padding:24px; color:var(--ink); }
dialog::backdrop { background:rgba(7,27,21,.65); }
dialog p { margin-bottom:16px; }
@media (max-width:1000px) {

<body>
<header class="mast"><div class="shell"><h1>배드민턴 월례 대회</h1></div></header>
<main class="shell">
  <nav class="view-nav" aria-label="대회 화면">
    <button id="tab-bracket" type="button" aria-controls="bracket-view" aria-pressed="true">대진표</button>
    <button id="tab-score" type="button" aria-controls="score-view" aria-pressed="false">점수판</button>
  </nav>
  <section id="bracket-view" class="layout" aria-label="대진표 화면">
    <aside class="setup" aria-labelledby="setup-title">
      <h2 id="setup-title">대회 설정</h2>
      <div><label for="teams">참가 팀</label>
        <small id="teams-help">한 줄에 한 팀씩, 2~16팀을 입력하세요.</small>
        <textarea id="teams" rows="5" autocomplete="off" aria-describedby="teams-help" spellcheck="false">1팀
2팀
3팀
4팀
5팀
6팀
7팀
8팀</textarea>
      </div>
      <div><label for="format">경기 방식</label>
        <select id="format"><option value="1">단판</option><option value="3">3게임 중 2선승</option></select>
      </div>
      <div><label for="target">게임당 목표 점수</label>
        <select id="target"><option value="21">21점 (최대 30점)</option><option value="15">15점 (최대 21점)</option></select>
        <small>목표 점수부터 2점 차로 승리하며, 최대 점수에 먼저 닿으면 이깁니다.</small>
      </div>
      <div><label for="order">대진 순서</label>
        <select id="order"><option value="shuffle">무작위 추첨</option><option value="entered">입력 순서대로 시드 배정</option></select>
      </div>

      <p id="summary" class="summary">참가 팀과 경기 방식을 정한 뒤 ‘대진표 만들기’를 누르세요.</p>

            <span id="games-left" class="games"></span>

          </section>
          <section class="side" aria-labelledby="name-right">
            <h3 id="name-right"></h3><output for="point-right" id="points-right" class="points" aria-live="off"></output>
            <span id="games-right" class="games"></span>
            <button id="point-right" type="button">+1점</button>
          </section>
        </div>
        <p id="score-status" class="score-status" role="status" aria-atomic="true"></p>
        <p id="game-scores" class="game-scores"></p>
        <div class="score-tools">
          <button id="undo" class="secondary" type="button">직전 득점 취소</button>
          <button id="advance" class="secondary action" type="button" hidden></button>
          <button id="edit-result" class="secondary" type="button" hidden>결과 정정</button>

<dialog id="replace-dialog" aria-labelledby="replace-title">
  <h3 id="replace-title">새 대진표 만들기</h3>
  <p>새 대진표를 만들면 현재 경기 기록이 지워집니다.</p>
  <div class="control-row">
    <button id="cancel-replace" class="secondary" type="button" autofocus>돌아가기</button>
    <button id="accept-replace" class="primary" type="button">새로 만들기</button>

<script>
'use strict';
const byId = id => document.getElementById(id);
const setText = (id, value) => {
  if (byId(id).textContent !== String(value)) byId(id).textContent = value;
};
const roundNames = {16:'16강', 8:'8강', 4:'준결승', 2:'결승'};
let tournament = null;
let selected = null;
let replacement = null;

function seedOrder(size) {
  let seeds = [1, 2];
  while (seeds.length < size) {
    const sum = seeds.length * 2 + 1;
    seeds = seeds.reduce((next, seed) => next.concat(seed, sum - seed), []);
  }
  return seeds;
}

function makeTournament(names, format, target, randomize) {
  const draw = names.slice();
  if (randomize) {
    for (let i = draw.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [draw[i], draw[j]] = [draw[j], draw[i]];
    }
  }
  let size = 2;
  while (size < draw.length) size *= 2;
  const slots = seedOrder(size).map(seed => draw[seed - 1] || null);
  const rounds = [];
  let number = 1;
  for (let count = size; count >= 2; count /= 2) {
    const round = [];
    const previous = rounds[rounds.length - 1];
    for (let i = 0; i < count / 2; i++) {
      const position = i * 2;
      const match = {
        number: number++, stage: roundNames[count],
        sources: previous ? previous.slice(position, position + 2) : null,
        slots: previous ? null : slots.slice(position, position + 2),
        games: [[]], confirmed: false, next: null
      };
      if (previous) match.sources.forEach(source => { source.next = match; });
      round.push(match);
    }
    rounds.push(round);
  }
  return { rounds, matches: [].concat.apply([], rounds), count: draw.length,
    needed: format === 3 ? 2 : 1, target, cap: target === 21 ? 30 : 21 };
}

function points(rallies) {
  const result = [0, 0];
  for (const side of rallies) result[side]++;
  return result;
}

function gameWinner(score, rules) {
  const leader = score[0] > score[1] ? 0 : 1;
  const high = score[leader];
  const lead = high - score[1 - leader];
  return high >= rules.cap || (high >= rules.target && lead >= 2) ? leader : null;
}

function matchStats(match, rules) {
  const scores = match.games.map(points);
  const wins = [0, 0];
  scores.forEach(score => {
    const winner = gameWinner(score, rules);
    if (winner !== null) wins[winner]++;
  });
  const current = scores[scores.length - 1];
  const winner = wins.indexOf(rules.needed);
  return {scores, wins, current, gameWinner:gameWinner(current, rules), winner:winner < 0 ? null : winner};
}

function entrants(match) {
  return match.slots || match.sources.map(winnerName);
}

function bye(match) {
  return match.slots && match.slots.includes(null);
}

function winnerName(match) {
  if (bye(match)) return match.slots.find(Boolean);
  if (match.confirmed) return entrants(match)[matchStats(match, tournament).winner];
  return null;
}

function played(match) {
  return match.games.some(game => game.length > 0);
}

function ruleText() {
  return (tournament.needed === 1 ? '단판' : '3게임 중 2선승') +
    ' · ' + tournament.target + '점 · 최대 ' + tournament.cap + '점';
}

function gameLine(stats, completedOnly) {
  return stats.scores.map((score, i) => {
    if (completedOnly && gameWinner(score, tournament) === null) return '';
    return (i + 1) + '게임 ' + score.join('–');
  }).filter(Boolean).join(' · ');
}

function span(className, content) {
  const node = document.createElement('span');
  node.className = className;
  node.textContent = content;
  return node;
}

function renderBracket() {
  const final = tournament.rounds[tournament.rounds.length - 1][0];
  const champion = winnerName(final);
  const complete = tournament.matches.filter(match => match.confirmed).length;
  setText('summary', tournament.count + '팀 · ' + ruleText() + ' · ' + complete + '/' + (tournament.count - 1) + '경기 확정');
  byId('champion').hidden = !champion;
  setText('champion', champion ? '우승  ' + champion : '');
  const container = byId('rounds');
  container.textContent = '';
  container.style.setProperty('--rounds', tournament.rounds.length);
  container.style.setProperty('--compact-rounds', Math.min(2, tournament.rounds.length));
  tournament.rounds.forEach(round => {
    const column = document.createElement('section');
    column.className = 'round';
    const heading = document.createElement('h3');
    heading.textContent = round[0].stage;
    column.appendChild(heading);
    const matches = document.createElement('div');
    matches.className = 'matches';
    round.forEach(match => {
      const names = entrants(match);
      const automatic = bye(match);
      const ready = names.every(Boolean);
      const winner = winnerName(match);
      const clickable = ready && !automatic;
      const card = document.createElement(clickable ? 'button' : 'div');
      card.className = 'match';
      const stats = matchStats(match, tournament);
      const status = automatic ? '부전승' : match.confirmed ? '확정' :
        !ready ? '대기' : stats.winner !== null ? '확정 대기' : played(match) ? '진행 중' : '점수판 열기';
      if (clickable) {
        card.type = 'button';
        card.setAttribute('aria-label', match.number + '경기 ' + names.join(' 대 ') + ', ' + status);
        card.addEventListener('click', () => {
          selected = match;
          changeView(true);
          byId('scoreboard').focus();
        });
      }
      const meta = span('match-meta', '');
      meta.append(span('', match.number + '경기'), span('', status));
      card.appendChild(meta);
      names.forEach((name, side) => {
        const won = Boolean(winner && name === winner);
        const label = name || (automatic ? '빈 자리' : match.sources[side].number + '경기 승자');
        const row = span('entrant' + (won ? ' winner' : ''), '');
        row.appendChild(span('', label));
        if (won) row.appendChild(span('mark', '승'));
        card.appendChild(row);
      });
      if (!automatic && played(match)) card.appendChild(span('match-scores', gameLine(stats, false)));
      matches.appendChild(card);
    });
    column.appendChild(matches);
    container.appendChild(column);
  });
}

function changeView(showScore) {
  byId('bracket-view').hidden = showScore;
  byId('score-view').hidden = !showScore;
  byId('tab-bracket').setAttribute('aria-pressed', String(!showScore));
  byId('tab-score').setAttribute('aria-pressed', String(showScore));
  if (showScore) renderScore();
  else if (tournament) renderBracket();
}

function renderScore(message) {
  const selector = byId('match-select');
  const options = tournament ? tournament.matches.filter(match => entrants(match).every(Boolean)) : [];
  if (!options.includes(selected)) selected = options.find(match => !match.confirmed) || options[0] || null;
  const labels = options.map(match => match.stage + ' · ' + match.number + '경기 · ' +
    entrants(match).join(' vs ') + (match.confirmed ? ' (확정)' : ''));
  if (labels.join('\n') !== Array.from(selector.options).map(option => option.textContent).join('\n')) {
    selector.textContent = '';
    options.forEach((match, index) => {
      const option = document.createElement('option');
      option.value = match.number;
      option.textContent = labels[index];
      selector.appendChild(option);
    });
  }
  selector.disabled = !selected;
  byId('fullscreen').disabled = !selected || !document.fullscreenEnabled;
  byId('score-content').hidden = !selected;
  setText('board-hint', selected ? ruleText() : '대진표를 만들면 경기별 점수판을 열 수 있습니다.');
  if (!selected) return;
  selector.value = selected.number;

  const names = entrants(selected);
  const stats = matchStats(selected, tournament);
  const gameNumber = selected.games.length;
  ['left', 'right'].forEach((position, side) => {
    setText('name-' + position, names[side]);
    setText('points-' + position, stats.current[side]);
    setText('games-' + position, '이긴 게임 ' + stats.wins[side]);
    const button = byId('point-' + position);
    button.disabled = selected.confirmed || stats.gameWinner !== null;
    button.setAttribute('aria-label', names[side] + ' 1점 추가');
  });
  byId('undo').disabled = selected.confirmed || !played(selected);
  byId('edit-result').hidden = !selected.confirmed;
  byId('advance').hidden = selected.confirmed || stats.gameWinner === null;
  setText('advance', stats.winner === null ? '다음 게임' : '결과 확정');
  const score = names[0] + ' ' + stats.current[0] + ' 대 ' + stats.current[1] + ' ' + names[1];
  let status = gameNumber + '게임 · ' + score;
  if (selected.confirmed) status = names[stats.winner] + ' 승리 · 결과 확정';
  else if (stats.winner !== null) status = names[stats.winner] + ' 승리 · 결과를 확정하세요';
  else if (stats.gameWinner !== null) status += ' · ' + names[stats.gameWinner] + ' 게임 승리';
  else if (stats.current[0] === stats.current[1] && stats.current[0] >= tournament.target - 1) status += ' · 듀스';
  setText('score-status', message || status);
  setText('game-scores', gameLine(stats, true));
  byId('game-scores').hidden = !byId('game-scores').textContent;
}

function scorePoint(side) {
  if (!selected || selected.confirmed || matchStats(selected, tournament).gameWinner !== null) return;
  selected.games[selected.games.length - 1].push(side);
  renderScore();
}

function undoPoint() {
  if (!selected || selected.confirmed || !played(selected)) return;
  if (selected.games[selected.games.length - 1].length === 0) selected.games.pop();
  selected.games[selected.games.length - 1].pop();
  renderScore();
}

function advanceMatch() {
  if (!selected || selected.confirmed) return;
  const stats = matchStats(selected, tournament);
  if (stats.gameWinner === null) return;
  if (stats.winner === null) {
    selected.games.push([]);
    renderScore();
    byId('point-left').focus();
    return;
  }
  selected.confirmed = true;
  renderScore();
  byId('back-to-draw').focus();
}

function correctResult() {
  if (!selected || !selected.confirmed) return;
  if (selected.next && played(selected.next)) {
    renderScore('다음 라운드에 점수가 입력되어 있습니다. 다음 경기의 점수를 먼저 취소하세요.');
    return;
  }
  selected.confirmed = false;
  renderScore('결과 확정을 취소했습니다. ‘직전 득점 취소’를 눌러 점수를 정정하세요.');
  byId('undo').focus();
}

function startTournament(next) {
  tournament = next;
  selected = null;
  byId('print').disabled = false;
  renderBracket();
}

byId('build').addEventListener('click', () => {
  const names = byId('teams').value.split(/\r?\n/).map(name => name.trim()).filter(Boolean);
  let error = '';
  if (names.length < 2 || names.length > 16) error = '참가 팀을 2~16팀 입력하세요.';
  else if (new Set(names).size !== names.length) error = '같은 팀 이름이 있습니다. 팀마다 다른 이름을 입력하세요.';
  else if (names.some(name => Array.from(name).length > 32)) error = '팀 이름은 32자 이내로 입력하세요.';
  byId('error').hidden = !error;
  setText('error', error);
  if (error) {
    byId('teams').setAttribute('aria-invalid', 'true');
    byId('teams').focus();
    return;
  }
  byId('teams').removeAttribute('aria-invalid');
  const next = makeTournament(names, Number(byId('format').value), Number(byId('target').value),
    byId('order').value === 'shuffle');
  if (tournament && tournament.matches.some(played)) {
    replacement = next;
    byId('replace-dialog').showModal();
  } else startTournament(next);
});
byId('accept-replace').addEventListener('click', () => {
  startTournament(replacement);
  byId('replace-dialog').close();
});
byId('cancel-replace').addEventListener('click', () => byId('replace-dialog').close());
byId('replace-dialog').addEventListener('close', () => { replacement = null; });

byId('tab-bracket').addEventListener('click', () => changeView(false));
byId('tab-score').addEventListener('click', () => changeView(true));
byId('back-to-draw').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  changeView(false);
  byId('tab-bracket').focus();
});
byId('match-select').addEventListener('change', event => {
  selected = tournament.matches.find(match => match.number === Number(event.target.value));
  renderScore();
});
byId('fullscreen').addEventListener('click', () => {
  const transition = document.fullscreenElement ? document.exitFullscreen() : byId('scoreboard').requestFullscreen();
  transition.catch(() => setText('score-status', '전체화면을 열 수 없습니다. 브라우저의 전체화면 단축키를 사용하세요.'));
});
document.addEventListener('fullscreenchange', () => {
  setText('fullscreen', document.fullscreenElement ? '전체화면 닫기' : '전체화면');
});
byId('print').addEventListener('click', () => window.print());
window.addEventListener('beforeprint', () => { if (tournament) renderBracket(); });
byId('point-left').addEventListener('click', () => scorePoint(0));
byId('point-right').addEventListener('click', () => scorePoint(1));
byId('undo').addEventListener('click', undoPoint);
byId('advance').addEventListener('click', advanceMatch);
byId('edit-result').addEventListener('click', correctResult);
document.addEventListener('keydown', event => {
  if (byId('score-view').hidden || event.repeat || event.ctrlKey || event.altKey || event.metaKey ||
      /^(SELECT|INPUT|TEXTAREA)$/.test(event.target.tagName || '')) return;
  const key = event.key.toLowerCase();
  if (key === 'a') scorePoint(0);
  else if (key === 'l') scorePoint(1);
  else if (key === 'u') undoPoint();
});
window.addEventListener('beforeunload', event => {
  if (tournament && tournament.matches.some(played)) {
    event.preventDefault();
    event.returnValue = '';
  }
});
</script>
</body>
</html>
