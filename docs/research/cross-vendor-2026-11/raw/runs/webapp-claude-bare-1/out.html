<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경우의 수 탐험대 - 중2 수학</title>
<style>
:root{--bg:#f4f7ff;--card:#fff;--ink:#1f2a44;--sub:#4a5675;--pri:#2f5bea;--pri-d:#1f43b8;--acc:#ff8a1f;--ok:#12805c;--bad:#c62828;--line:#cfd8f3;--soft:#e8eeff;--g:#e6f6ee;--o:#fff1de}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
body.big{font-size:1.35rem}
header{background:linear-gradient(120deg,#2f5bea,#6a4cff);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:1.35rem}
header small{opacity:.9}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;background:#fff;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:5}
nav button{border:2px solid var(--line);background:#fff;color:var(--ink);padding:8px 12px;border-radius:999px;cursor:pointer;font:inherit;font-weight:700;font-size:.9rem}
nav button[aria-selected=true]{background:var(--pri);border-color:var(--pri);color:#fff}
button,input,select{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{max-width:1050px;margin:0 auto;padding:14px}
.panel h2{margin:.2em 0 .5em;color:var(--pri-d)}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}
.card h3{margin:.1em 0 .4em}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:9px 16px;font-weight:700;cursor:pointer;margin:3px}
.btn:hover{background:var(--pri-d)}
.btn.sec{background:#fff;color:var(--pri-d);border:2px solid var(--pri)}
.btn.orange{background:var(--acc);color:#1b1b1b}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.note{background:var(--o);border-left:6px solid var(--acc);padding:8px 12px;border-radius:8px;margin:8px 0}
.good{background:var(--g);border-left:6px solid var(--ok);padding:8px 12px;border-radius:8px;margin:8px 0}
.formula{font-size:1.15em;font-weight:800;color:var(--pri-d);background:var(--soft);padding:6px 12px;border-radius:10px;display:inline-block;margin:4px 0}
.chip{display:inline-block;border:2px solid var(--pri);background:#fff;color:var(--pri-d);border-radius:999px;padding:5px 14px;margin:3px;cursor:pointer;font-weight:700;user-select:none}
.chip[aria-pressed=true],.chip.on{background:var(--pri);color:#fff}
.chip.static{cursor:default;border-color:var(--line);color:var(--ink);font-weight:500;padding:2px 10px;font-size:.88rem}
.chip.hl{background:#fff3b0;border-color:var(--acc)}
.slot{display:inline-block;min-width:76px;min-height:42px;border:2px dashed var(--sub);border-radius:10px;text-align:center;padding:6px;margin:3px;font-weight:800}
.slot.f{border-style:solid;background:var(--soft);border-color:var(--pri)}
.slot small{display:block;color:var(--sub);font-weight:500;font-size:.75rem}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:4px 8px;text-align:center}
th{background:var(--soft)}
canvas{width:100%;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:10px}
.svgbox{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;max-height:620px}
input[type=range]{width:200px;accent-color:var(--pri)}
input[type=number],input[type=text]{border:2px solid var(--line);border-radius:10px;padding:7px 10px;width:130px}
label{font-weight:600}
.coin,.die{display:inline-flex;align-items:center;justify-content:center;font-weight:900;margin:4px;width:62px;height:62px}
.coin{border-radius:50%;background:radial-gradient(#ffe27a,#e0a915);border:3px solid #b8860b;color:#5a3d00}
.coin.t{background:radial-gradient(#eee,#aab);border-color:#778;color:#334}
.die{border-radius:14px;background:#fff;border:3px solid var(--ink);font-size:1.7rem}
.spin{animation:flip .5s ease-in-out}
.shake{animation:shake .5s ease-in-out}
@keyframes flip{0%{transform:rotateY(0) translateY(0)}50%{transform:rotateY(540deg) translateY(-26px)}100%{transform:rotateY(1080deg) translateY(0)}}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-25deg) translateY(-8px)}40%{transform:rotate(22deg)}60%{transform:rotate(-18deg) translateY(-6px)}80%{transform:rotate(12deg)}}
@media (prefers-reduced-motion:reduce){.spin,.shake{animation:none}}
.list{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px;background:#fcfdff}
.ok{color:var(--ok);font-weight:800}.bad{color:var(--bad);font-weight:800}
.sr{position:absolute;left:-9999px}
.qbox{font-size:1.1em}
.choice{display:block;margin:6px 0;padding:8px 12px;border:2px solid var(--line);border-radius:10px;cursor:pointer}
.tbadge{background:var(--soft);color:var(--pri-d);border-radius:8px;padding:2px 8px;font-size:.8rem;font-weight:700}
.ex{background:#f8faff;border:1px dashed var(--pri);border-radius:12px;padding:8px 12px;margin:6px 0}
.hidden-ans{display:none}
body.teacher .hidden-ans{display:block}
@media (max-width:600px){html{font-size:15px}input[type=range]{width:150px}}
@media print{header,nav,.noprint,.btn{display:none!important}body{background:#fff}.card{border:1px solid #888;break-inside:avoid}.panel[hidden]{display:none!important}.hidden-ans{display:block}}
</style>
</head>
<body>
<header>
  <div><h1>🎲 경우의 수 탐험대</h1><small>중학교 2학년 수학 · 직접 해 보며 익히기</small></div>
  <div class="row noprint">
    <button class="btn orange" id="bigBtn" aria-pressed="false">큰 글씨 모드</button>

  <section class="panel" id="p1" role="tabpanel" hidden></section>

  <section class="panel" id="p3" role="tabpanel" hidden></section>

<!-- ===== 순수 계산 로직 (노드에서도 검증) ===== -->
<script id="logic">
var L=(function(){
  function fact(n){var r=1;for(var i=2;i<=n;i++)r*=i;return r;}
  function nPr(n,r){if(r<0||r>n)return 0;var x=1;for(var i=0;i<r;i++)x*=n-i;return x;}
  function nCr(n,r){if(r<0||r>n)return 0;var x=1;for(var i=1;i<=r;i++)x=x*(n-r+i)/i;return Math.round(x);}
  // 순열 나열 (limit개까지 담고, 총 개수는 공식으로)
  function perms(items,r,limit){
    var out=[],used=[],cur=[];
    (function rec(){
      if(out.length>=limit)return;
      if(cur.length===r){out.push(cur.slice());return;}
      for(var i=0;i<items.length;i++){if(used[i])continue;used[i]=true;cur.push(items[i]);rec();cur.pop();used[i]=false;if(out.length>=limit)return;}
    })();
    return {list:out,total:nPr(items.length,r)};
  }
  function combos(items,r,limit){
    var out=[],cur=[];
    (function rec(s){
      if(out.length>=limit)return;
      if(cur.length===r){out.push(cur.slice());return;}
      for(var i=s;i<items.length;i++){cur.push(items[i]);rec(i+1);cur.pop();if(out.length>=limit)return;}
    })(0);
    return {list:out,total:nCr(items.length,r)};
  }
  // 서로 다른 숫자 카드로 r자리 정수 (맨 앞 0 불가)
  function makeIntegers(digits,r,evenOnly){
    var res=[],used=[],cur=[];
    (function rec(){
      if(cur.length===r){
        if(r>1&&cur[0]===0)return;
        if(evenOnly&&cur[r-1]%2!==0)return;
        res.push(Number(cur.join('')));return;
      }
      for(var i=0;i<digits.length;i++){if(used[i])continue;used[i]=true;cur.push(digits[i]);rec();cur.pop();used[i]=false;}
    })();
    return res;
  }
  // n명을 한 줄로 세울 때 group(이름 배열)이 이웃하는 경우
  function adjacentArrangements(items,group,limit){
    var n=items.length,k=group.length,list=[],count=0;
    var all=perms(items,n,Infinity).list;
    for(var a=0;a<all.length;a++){
      var p=all[a],pos=[];
      for(var i=0;i<n;i++)if(group.indexOf(p[i])>=0)pos.push(i);
      if(pos[pos.length-1]-pos[0]===k-1){count++;if(list.length<limit)list.push(p);}
    }
    return {count:count,list:list,formula:fact(n-k+1)*fact(k)};
  }
  function gridPaths(a,b){return nCr(a+b,a);}
  // DP로 (0,0)->(a,b) 오른쪽/위쪽 최단경로 수, via 지점 필수
  function gridPathsDP(a,b,via){
    var f=[];for(var x=0;x<=a;x++){f.push([]);for(var y=0;y<=b;y++){
      var v=(x===0&&y===0)?1:((x>0?f[x-1][y]:0)+(y>0?f[x][y-1]:0));
      f[x].push(v);}}
    if(!via)return f[a][b];
    var g=[];for(var x2=0;x2<=a;x2++){g.push([]);for(var y2=0;y2<=b;y2++){
      var w;
      if(x2<via[0]||y2<via[1])w=0;
      else if(x2===via[0]&&y2===via[1])w=f[x2][y2];
      else w=(x2>0?g[x2-1][y2]:0)+(y2>0?g[x2][y2-1]:0);
      g[x2].push(w);}}
    return g[a][b];
  }
  function pathsVia(a,b,x,y){return nCr(x+y,x)*nCr(a-x+b-y,a-x);}
  function stairs(n){var f=[1,1];for(var i=2;i<=n;i++)f.push(f[i-1]+f[i-2]);return f[n];}
  function diceSumWays(n){
    var w={0:1};
    for(var d=0;d<n;d++){var nw={};for(var s in w){for(var f=1;f<=6;f++){var t=Number(s)+f;nw[t]=(nw[t]||0)+w[s];}}w=nw;}
    return w;
  }
  function product(a){return a.reduce(function(x,y){return x*y;},1);}
  // 수형도: levels = [[라벨...],[라벨...]] -> 모든 경로
  function treePaths(levels){
    var res=[[]];
    levels.forEach(function(lv){var nx=[];res.forEach(function(p){lv.forEach(function(o){nx.push(p.concat(o));});});res=nx;});
    return res;
  }
  function countDice(n,pred){ // n개 주사위 모든 경우 중 pred(눈 배열)을 만족하는 수
    var c=0;(function rec(cur){if(cur.length===n){if(pred(cur))c++;return;}for(var f=1;f<=6;f++){cur.push(f);rec(cur);cur.pop();}})([]);return c;
  }

  /* ---------- 문제 은행 ---------- */
  var rnd=function(a,b){return a+Math.floor(Math.random()*(b-a+1));};
  var pick=function(arr){return arr[rnd(0,arr.length-1)];};
  var G=[];
  function add(cat,make){G.push({cat:cat,make:make});}

  add('합의 법칙',function(){var a=rnd(2,7),b=rnd(2,7);
    return {type:'num',text:'집에서 학교까지 가는 버스 노선이 '+a+'가지, 지하철 노선이 '+b+'가지 있다. 버스 또는 지하철 중 한 가지만 이용하여 갈 때, 가는 방법은 모두 몇 가지인가?',ans:a+b,
    hints:['버스와 지하철을 동시에 이용하지는 않아요. 두 사건이 동시에 일어나나요?','동시에 일어나지 않으므로 합의 법칙을 써요.'],
    exp:'버스와 지하철은 동시에 이용할 수 없으므로 합의 법칙을 사용합니다. '+a+' + '+b+' = '+(a+b)+'(가지)'};});
  add('곱의 법칙',function(){var a=rnd(2,6),b=rnd(2,6);
    return {type:'num',text:'티셔츠 '+a+'벌과 바지 '+b+'벌이 있다. 티셔츠 한 벌과 바지 한 벌을 짝지어 입는 방법은 모두 몇 가지인가?',ans:a*b,
    hints:['티셔츠를 고르는 일과 바지를 고르는 일은 이어서(그리고) 일어나요.','곱의 법칙: (티셔츠 수) × (바지 수)'],
    exp:'티셔츠를 고르는 방법이 '+a+'가지이고 각각에 대해 바지를 고르는 방법이 '+b+'가지이므로 '+a+' × '+b+' = '+(a*b)+'(가지)'};});
  add('곱의 법칙',function(){var a=rnd(2,5),b=rnd(2,5);
    return {type:'num',text:'A 마을에서 B 마을로 가는 길이 '+a+'가지, B 마을에서 C 마을로 가는 길이 '+b+'가지 있다. A 마을에서 B 마을을 거쳐 C 마을로 가는 방법은 모두 몇 가지인가? (같은 길을 되돌아오지 않는다)',ans:a*b,
    hints:['A→B를 정한 다음 B→C를 정해요. 두 일이 연달아 일어나요.','곱의 법칙을 사용해요.'],
    exp:'A→B가 '+a+'가지, 각각에 대해 B→C가 '+b+'가지이므로 '+a+' × '+b+' = '+(a*b)+'(가지)'};});
  add('동전·주사위',function(){
    var s1=rnd(2,6),s2=pick([8,9,10,11,12]);
    var c=countDice(2,function(d){var s=d[0]+d[1];return s===s1||s===s2;});
    var w=diceSumWays(2);
    return {type:'num',text:'서로 다른 주사위 2개를 동시에 던질 때, 나오는 눈의 합이 '+s1+' 또는 '+s2+'인 경우의 수는?',ans:c,
    hints:['합이 '+s1+'인 경우와 합이 '+s2+'인 경우를 따로 나열해 보세요.','두 경우는 동시에 일어나지 않으므로 더해요.'],
    exp:'합이 '+s1+'인 경우 '+w[s1]+'가지, 합이 '+s2+'인 경우 '+w[s2]+'가지. 동시에 일어나지 않으므로 '+w[s1]+' + '+w[s2]+' = '+c+'(가지)'};});
  add('동전·주사위',function(){var n=rnd(2,4);
    return {type:'num',text:'서로 다른 동전 '+n+'개를 동시에 던질 때, 일어나는 모든 경우의 수는?',ans:Math.pow(2,n),
    hints:['동전 한 개는 앞면 또는 뒷면, 2가지예요.','동전마다 2가지씩 이어서 일어나니 곱의 법칙!'],
    exp:'각 동전마다 2가지씩이므로 '+Array(n).fill(2).join(' × ')+' = '+Math.pow(2,n)+'(가지)'};});
  add('동전·주사위',function(){var a=rnd(1,2),b=rnd(1,2);
    return {type:'num',text:'동전 '+a+'개와 주사위 '+b+'개를 동시에 던질 때, 일어나는 모든 경우의 수는?',ans:Math.pow(2,a)*Math.pow(6,b),
    hints:['동전 '+a+'개의 경우의 수와 주사위 '+b+'개의 경우의 수를 각각 구해 보세요.','두 결과를 곱해요.'],
    exp:'동전 '+a+'개: '+Math.pow(2,a)+'가지, 주사위 '+b+'개: '+Math.pow(6,b)+'가지 → '+Math.pow(2,a)+' × '+Math.pow(6,b)+' = '+(Math.pow(2,a)*Math.pow(6,b))+'(가지)'};});
  add('동전·주사위',function(){
    var t=rnd(0,2),k=pick([3,4,5]),text,pred,name;
    if(t===0){name='눈의 곱이 짝수';pred=function(d){return d[0]*d[1]%2===0;};}
    else if(t===1){name='눈의 곱이 홀수';pred=function(d){return d[0]*d[1]%2===1;};}
    else{name='눈의 합이 '+k+'의 배수';pred=function(d){return (d[0]+d[1])%k===0;};}
    var c=countDice(2,pred);
    return {type:'num',text:'서로 다른 주사위 2개를 던질 때, '+name+'가 되는 경우의 수는?',ans:c,
    hints:['표(6×6)를 그려 조건에 맞는 칸을 세어 보세요.',t<2?'곱이 홀수이려면 두 눈이 모두 홀수여야 해요. 전체에서 빼는 방법도 있어요.':'합이 가능한 값('+k+', '+(2*k)+', ...)별로 나누어 세어 보세요.'],
    exp:'36가지 중 조건에 맞는 경우를 빠짐없이 중복 없이 세면 '+c+'가지입니다.'};});
  add('동전·주사위',function(){var d=rnd(1,4);
    var c=countDice(2,function(x){return Math.abs(x[0]-x[1])===d;});
    return {type:'num',text:'서로 다른 주사위 2개를 던질 때, 나온 두 눈의 차가 '+d+'인 경우의 수는?',ans:c,
    hints:['(큰 눈, 작은 눈)이 아니라 (첫째 주사위, 둘째 주사위)로 순서쌍을 생각해 보세요.','(a,b)와 (b,a)는 서로 다른 경우예요.'],
    exp:'(첫째, 둘째)의 순서쌍을 나열하면 '+c+'가지입니다. 차가 '+d+'인 두 눈의 쌍이 '+(6-d)+'쌍이고 각각 순서가 2가지이므로 '+(6-d)+' × 2 = '+c+'(가지)'};});
  add('동전·주사위',function(){var type=rnd(0,2);
    var name=['짝수','소수(2, 3, 5)','3의 배수'][type];
    var pred=[function(f){return f%2===0;},function(f){return [2,3,5].indexOf(f)>=0;},function(f){return f%3===0;}][type];
    var c=0;for(var f=1;f<=6;f++)if(pred(f))c++;
    return {type:'num',text:'동전 1개와 주사위 1개를 동시에 던질 때, 동전은 앞면이 나오고 주사위는 '+name+'의 눈이 나오는 경우의 수는?',ans:c,
    hints:['동전이 앞면인 경우는 몇 가지인가요?','주사위가 '+name+'인 눈을 나열해 보세요. 그리고(동시에)이므로 곱해요.'],
    exp:'동전 앞면 1가지 × 주사위 '+name+' '+c+'가지 = '+c+'(가지)'};});
  add('순열',function(){var n=rnd(4,8),r=rnd(2,3);
    return {type:'num',text:'서로 다른 '+n+'명의 학생 중에서 '+r+'명을 뽑아 한 줄로 세우는 경우의 수는?',ans:nPr(n,r),
    hints:['첫 번째 자리에 세울 수 있는 사람은 몇 명인가요?','뽑힌 사람은 다시 뽑을 수 없으니 한 명씩 줄어요: '+n+'P'+r],
    exp:Array.from({length:r},function(_,i){return n-i;}).join(' × ')+' = '+nPr(n,r)+'(가지)  (= '+n+'P'+r+')'};});
  add('순열',function(){var n=rnd(3,6);
    return {type:'num',text:n+'명의 학생을 한 줄로 세우는 경우의 수는?',ans:fact(n),
    hints:['첫째 자리는 '+n+'명 중 하나, 둘째 자리는 남은 사람 중 하나...','n! = n × (n−1) × … × 1'],
    exp:Array.from({length:n},function(_,i){return n-i;}).join(' × ')+' = '+fact(n)+'(가지)'};});

var exp={kind:'coin',n:1,counts:{},total:0,last:null};
function expCats(){
  var n=exp.n;
  if(exp.kind==='coin'){var out=[];(function rec(p){if(p.length===n){out.push({key:p.join(''),ways:1,label:p.join('')});return;}['앞','뒤'].forEach(function(s){rec(p.concat(s));});})([]);return out;}
  var w=L.diceSumWays(n);
  return Object.keys(w).map(Number).sort(function(a,b){return a-b;}).map(function(s){return {key:String(s),ways:w[s],label:String(s)};});
}
function expAll(){return exp.kind==='coin'?Math.pow(2,exp.n):Math.pow(6,exp.n);}
function expRoll(){
  var r=[],i;
  if(exp.kind==='coin'){for(i=0;i<exp.n;i++)r.push(Math.random()<0.5?'앞':'뒤');return {items:r,key:r.join('')};}
  var s=0;for(i=0;i<exp.n;i++){var f=1+Math.floor(Math.random()*6);r.push(f);s+=f;}
  return {items:r,key:String(s)};
}
function expShow(res,animate){
  var box=$('xres');
  box.innerHTML=res.items.map(function(v){return exp.kind==='coin'?'<span class="coin'+(v==='뒤'?' t':'')+(animate?' spin':'')+'">'+v+'</span>':'<span class="die'+(animate?' shake':'')+'">'+v+'</span>';}).join('')+
   '<div>결과: <b>'+res.items.join(exp.kind==='coin'?' · ':' + ')+(exp.kind==='dice'&&exp.n>1?' = '+res.key:'')+'</b></div>';
}
function expThrow(times){
  var res;
  for(var i=0;i<times;i++){res=expRoll();exp.counts[res.key]=(exp.counts[res.key]||0)+1;exp.total++;}
  exp.last=res;
  expShow(res,times===1);
  if(times===1){$('xthrow1').disabled=true;setTimeout(function(){$('xthrow1').disabled=false;},520);}
  expTable();drawChart();
}
function expTable(){
  var cats=expCats(),all=expAll(),h='<table><caption class="sr">이론과 실험 비교표</caption><tr><th>결과</th><th>이론 경우의 수</th><th>이론 확률</th><th>나온 횟수</th><th>나온 비율</th></tr>';
  cats.forEach(function(c){var o=exp.counts[c.key]||0;
    h+='<tr><td>'+esc(c.label)+'</td><td>'+c.ways+' / '+all+'</td><td>'+(c.ways/all*100).toFixed(1)+'%</td><td>'+o+'</td><td>'+(exp.total?(o/exp.total*100).toFixed(1)+'%':'-')+'</td></tr>';});
  h+='<tr><th>합계</th><th>'+all+'</th><th>100%</th><th>'+exp.total+'</th><th>'+(exp.total?'100%':'-')+'</th></tr></table>';
  $('xtable').innerHTML=h;
  $('xsum').innerHTML='누적 던진 횟수: <b>'+exp.total+'</b>회 · 이론적 모든 경우의 수: <b>'+all+'</b>가지'+(exp.kind==='dice'&&exp.n>1?' (눈의 합으로 묶어 보여 줘요)':'');
}
function drawChart(){
  var cv=$('xcanvas');if(!cv)return;
  var cats=expCats(),W=Math.max(300,cv.clientWidth||700),H=260,dpr=window.devicePixelRatio||1;
  cv.width=W*dpr;cv.height=H*dpr;
  var g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  var all=expAll(),maxv=1,exps=cats.map(function(c){return exp.total*c.ways/all;});
  cats.forEach(function(c,i){maxv=Math.max(maxv,exp.counts[c.key]||0,exps[i]);});
  maxv=Math.ceil(maxv*1.15)||1;
  var L0=44,R0=10,T0=18,B0=34,pw=W-L0-R0,ph=H-T0-B0,bw=pw/cats.length;
  g.font='12px sans-serif';g.fillStyle='#4a5675';g.strokeStyle='#e3e8f7';g.textAlign='right';
  for(var k=0;k<=4;k++){var y=T0+ph-ph*k/4;g.beginPath();g.moveTo(L0,y);g.lineTo(W-R0,y);g.stroke();g.fillText(String(Math.round(maxv*k/4)),L0-5,y+4);}
  g.textAlign='center';
  cats.forEach(function(c,i){
    var o=exp.counts[c.key]||0,x=L0+i*bw,h=ph*o/maxv;
    g.fillStyle='#2f5bea';g.fillRect(x+bw*0.15,T0+ph-h,bw*0.7,h);
    g.fillStyle='#1f2a44';if(o)g.fillText(String(o),x+bw/2,T0+ph-h-3);
    var ey=T0+ph-ph*exps[i]/maxv;g.strokeStyle='#ff8a1f';g.lineWidth=3;g.beginPath();g.moveTo(x+bw*0.05,ey);g.lineTo(x+bw*0.95,ey);g.stroke();g.lineWidth=1;
    g.fillStyle='#4a5675';g.fillText(c.label,x+bw/2,H-14);
  });
  g.textAlign='left';g.fillStyle='#2f5bea';g.fillRect(L0,2,10,10);g.fillStyle='#1f2a44';g.fillText('실제로 나온 횟수',L0+14,11);
  g.fillStyle='#ff8a1f';g.fillRect(L0+120,5,16,4);g.fillStyle='#1f2a44';g.fillText('이론상 기대 횟수',L0+140,11);
}

var ITEMS={coin:{name:'동전',opts:['앞','뒤']},dice:{name:'주사위',opts:['1','2','3','4','5','6']},rps:{name:'가위바위보',opts:['가위','바위','보']},menu:{name:'메뉴(밥/면)',opts:['밥','면']},drink:{name:'음료',opts:['물','주스','우유']}};
var tree={steps:['coin','coin'],depth:0};
function treeSvg(){
  var steps=tree.steps,D=tree.depth,sizes=steps.map(function(k){return ITEMS[k].opts.length;});
  var total=L.product(sizes),leaves=L.product(sizes.slice(0,D)),rowH=leaves>24?20:(leaves>10?28:40),colW=96,nw=62,nh=Math.min(22,rowH-2);
  var Hh=Math.max(1,leaves)*rowH+20,Wd=(D+1)*colW+(D===steps.length?150:30);
  var s='<svg xmlns="http://www.w3.org/2000/svg" width="'+Wd+'" height="'+Hh+'" role="img" aria-label="수형도">';
  function yOf(k,i){var block=L.product(sizes.slice(k,D));return 10+(i*block+block/2)*rowH;}
  function xOf(k){return 40+k*colW;}
  var cnt=1,k,i,j;
  for(k=0;k<=D;k++){
    var num=L.product(sizes.slice(0,k));
    for(i=0;i<num;i++){
      var x=xOf(k),y=yOf(k,i),label=k===0?'시작':ITEMS[steps[k-1]].opts[i%sizes[k-1]];
      if(k>0){var pi=Math.floor(i/sizes[k-1]);s+='<line x1="'+(xOf(k-1)+nw/2)+'" y1="'+yOf(k-1,pi)+'" x2="'+(x-nw/2)+'" y2="'+y+'" stroke="#8a97c4" stroke-width="1.6"/>';}
    }
  }
  for(k=0;k<=D;k++){
    var num2=L.product(sizes.slice(0,k));
    for(i=0;i<num2;i++){
      var lab=k===0?'시작':ITEMS[steps[k-1]].opts[i%sizes[k-1]];
      var x2=xOf(k),y2=yOf(k,i),last=(k===D);
      s+='<rect x="'+(x2-nw/2)+'" y="'+(y2-nh/2)+'" width="'+nw+'" height="'+nh+'" rx="'+(nh/2)+'" fill="'+(k===0?'#ff8a1f':(last?'#e6f6ee':'#e8eeff'))+'" stroke="'+(last&&k>0?'#12805c':'#2f5bea')+'" stroke-width="1.5"/>';
      s+='<text x="'+x2+'" y="'+(y2+4)+'" text-anchor="middle" font-size="'+(nh<18?11:13)+'" font-weight="700" fill="#1f2a44">'+esc(lab)+'</text>';
      if(k===D&&D===steps.length&&D>0){
        var path=[],idx=i;for(j=D;j>=1;j--){path.unshift(ITEMS[steps[j-1]].opts[idx%sizes[j-1]]);idx=Math.floor(idx/sizes[j-1]);}
        s+='<text x="'+(x2+nw/2+8)+'" y="'+(y2+4)+'" font-size="12" fill="#12805c">'+esc('('+path.join(', ')+')')+'</text>';
      }
    }
  }
  s+='</svg>';return {svg:s,leaves:leaves,total:total,sizes:sizes};
}

var NAMES=['민수','지아','하준','서연','도윤','예은','시우'];
var pc={mode:'line',n:5,r:3,picked:[],digits:[0,1,2,3],ir:2,even:false,adj:['민수','지아'],showAll:false,pn:5};
var ROLES=['회장','부회장','총무','서기','회계','홍보','도우미'];
function pcInfo(){
  var n=pc.n,r=pc.r,m=pc.mode,items=NAMES.slice(0,n),h='';
  var isP=m!=='comb',total=isP?L.nPr(n,r):L.nCr(n,r);
  if(isP){
    var terms=[];for(var i=0;i<r;i++)terms.push(n-i);
    h+='<span class="formula">'+n+'P'+r+' = '+terms.join(' × ')+' = '+total+'</span>';
    h+='<p>'+(m==='role'?'회장·부회장처럼 <b>자격(역할)이 구분</b>되므로 같은 사람들이 뽑혀도 역할이 다르면 다른 경우 → 순열':'<b>순서를 생각</b>하여 한 줄로 세우므로 순열')+'</p>';
  }else{
    h+='<span class="formula">'+n+'C'+r+' = '+n+'P'+r+' ÷ '+r+'! = '+L.nPr(n,r)+' ÷ '+L.fact(r)+' = '+total+'</span>';
    h+='<p><b>자격 구분이 없는 뽑기</b>예요. 같은 '+r+'명을 줄 세우는 방법이 '+r+'! = '+L.fact(r)+'가지씩 있어서, 순열의 수를 '+L.fact(r)+'로 나눠요.</p>';
  }
  return {html:h,total:total};
}
function pcRender(){
  var n=pc.n,r=pc.r,m=pc.mode,items=NAMES.slice(0,n);

  $('plist').innerHTML=res.list.map(function(c,i){var k=order(c).join(',');var hl=cur!==null&&(m==='comb'?order(pc.picked).join(',')===k:cur===k);

  $('pcount').innerHTML='총 <b>'+res.total+'</b>가지'+(res.total>res.list.length?' 중 '+res.list.length+'가지만 보여 줘요.':' 모두 나열했어요 (빠짐없이, 중복 없이).');

  }

  var show=nums.slice().sort(function(a,b){return a-b;}).slice(0,120);

function adjRender(){

}

/* ===== 6. 문제 풀기 ===== */
var stats=store.get('gs-stats',{tries:0,correct:0,byCat:{},wrong:[]});
var qs={q:null,mode:'normal',cat:'전체',hint:0,done:false};
function saveStats(){store.set('gs-stats',stats);}
function newQ(){
  if(qs.mode==='retry'){
    qs.q=stats.wrong.length?stats.wrong[Math.floor(Math.random()*stats.wrong.length)]:null;
  }else{
    var pool=L.bank.filter(function(g){return qs.cat==='전체'||g.cat===qs.cat;});
    var g=L.pick(pool),q=g.make();q.cat=g.cat;qs.q=q;
  }
  qs.hint=0;qs.done=false;
}
function qRender(){
  var q=qs.q,rate=stats.tries?Math.round(stats.correct/stats.tries*100):0;
  var cats=['전체'].concat(L.bank.map(function(g){return g.cat;}).filter(function(c,i,a){return a.indexOf(c)===i;}));
  var h='<div class="card"><div class="row"><label>단원 <select id="qcat">'+cats.map(function(c){return '<option'+(c===qs.cat?' selected':'')+'>'+c+'</option>';}).join('')+'</select></label>'+
   '<button class="btn '+(qs.mode==='retry'?'':'sec')+'" id="qretry">틀린 문제 다시 풀기 ('+stats.wrong.length+')</button>'+
   (qs.mode==='retry'?'<button class="btn sec" id="qnormal">일반 문제로</button>':'')+'</div>'+
   '<div>푼 문제 <b>'+stats.tries+'</b> · 맞힌 문제 <b>'+stats.correct+'</b> · 정답률 <b>'+rate+'%</b> <button class="btn sec" id="qreset">기록 지우기</button></div></div>';
  if(!q){h+='<div class="good">🎉 다시 풀 틀린 문제가 없어요!</div>';$('p5').innerHTML='<h2>6. 문제 풀기</h2>'+h;bindQ();return;}
  h+='<div class="card"><div class="row"><span class="tbadge">'+esc(q.cat)+'</span><span class="tbadge">'+(q.type==='num'?'주관식':'객관식')+'</span>'+(qs.mode==='retry'?'<span class="tbadge">다시 풀기</span>':'')+'</div>'+
   '<p class="qbox">'+esc(q.text)+'</p><form id="qform">';
  if(q.type==='num')h+='<label>정답 <input type="number" id="qin" step="1" inputmode="numeric" '+(qs.done?'disabled':'')+'></label> ';
  else h+=q.choices.map(function(c,i){return '<label class="choice"><input type="radio" name="qc" value="'+i+'" '+(qs.done?'disabled':'')+'> '+(i+1)+'. '+esc(c)+'</label>';}).join('');
  h+='<button class="btn" type="submit" '+(qs.done?'disabled':'')+'>채점하기</button></form>'+
   '<div class="row"><button class="btn sec" id="qhint" '+(qs.done||qs.hint>=q.hints.length?'disabled':'')+'>💡 힌트 보기 ('+qs.hint+'/'+q.hints.length+')</button><button class="btn orange" id="qnext">다음 문제 ▶</button></div>'+
   '<div id="qhints">'+q.hints.slice(0,qs.hint).map(function(t,i){return '<div class="note"><b>힌트 '+(i+1)+'.</b> '+esc(t)+'</div>';}).join('')+'</div>'+
   '<div id="qfb" aria-live="polite"></div>'+
   '<div class="hidden-ans"><div class="note"><b>[교사용] 정답:</b> '+esc(q.type==='num'?q.ans:(q.ans+1)+'번')+' / '+esc(q.exp)+'</div></div></div>';
  $('p5').innerHTML='<h2>6. 문제 풀기</h2>'+h;bindQ();
}
function bindQ(){
  $('qcat').onchange=function(){qs.cat=this.value;qs.mode='normal';newQ();qRender();};
  $('qretry').onclick=function(){qs.mode='retry';newQ();qRender();};
  if($('qnormal'))$('qnormal').onclick=function(){qs.mode='normal';newQ();qRender();};
  $('qreset').onclick=function(){if(confirm('모든 기록을 지울까요?')){stats={tries:0,correct:0,byCat:{},wrong:[]};saveStats();if(qs.mode==='retry')qs.mode='normal';newQ();qRender();}};
  if(!qs.q)return;
  $('qnext').onclick=function(){newQ();qRender();};
  $('qhint').onclick=function(){qs.hint++;qRender();var b=$('qhint');if(b&&!b.disabled)b.focus();};
  $('qform').onsubmit=function(e){e.preventDefault();grade();};
  if($('qin')&&!qs.done)$('qin').focus();
}
function grade(){
  var q=qs.q,val,ok;
  if(q.type==='num'){var s=$('qin').value.trim();if(s===''){$('qfb').innerHTML='<div class="note">답을 입력해 주세요.</div>';return;}val=Number(s);ok=val===q.ans;}
  else{var r=document.querySelector('input[name=qc]:checked');if(!r){$('qfb').innerHTML='<div class="note">보기를 골라 주세요.</div>';return;}val=Number(r.value);ok=val===q.ans;}
  qs.done=true;stats.tries++;
  var c=stats.byCat[q.cat]||(stats.byCat[q.cat]={t:0,c:0});c.t++;
  var idx=stats.wrong.findIndex(function(w){return w.text===q.text;});
  if(ok){stats.correct++;c.c++;if(qs.mode==='retry'&&idx>=0)stats.wrong.splice(idx,1);}
  else if(idx<0){stats.wrong.push(q);if(stats.wrong.length>50)stats.wrong.shift();}
  saveStats();
  var rate=Math.round(stats.correct/stats.tries*100);
  var fb='<div class="'+(ok?'good':'note')+'"><p class="'+(ok?'ok':'bad')+'">'+(ok?'⭕ 정답입니다!':'❌ 아쉬워요. 정답은 '+(q.type==='num'?q.ans:(q.ans+1)+'번')+'입니다.')+'</p><p><b>풀이.</b> '+esc(q.exp)+'</p></div>';
  qRender();$('qfb').innerHTML=fb;$('qnext').focus();
}
renders[5]=function(){if(!qs.q&&!(qs.mode==='retry'))newQ();qRender();};

/* ===== 7. 교사용 ===== */
var tsamples=null;
renders[6]=function(){
  if(!tsamples)tsamples=L.bank.map(function(g){var q=g.make();q.cat=g.cat;return q;});
  $('p6').innerHTML='<h2>7. 교사용 수업 도우미</h2><div class="card noprint"><div class="row">'+
   '<button class="btn" id="tans" aria-pressed="'+settings.teacher+'">'+(settings.teacher?'정답·해설 숨기기':'모든 정답·해설 보기')+'</button>'+
   '<button class="btn orange" id="tbig" aria-pressed="'+settings.big+'">'+(settings.big?'큰 글씨 끄기':'큰 글씨(프로젝터) 모드')+'</button>'+
   '<button class="btn sec" id="tnew">문제 숫자 새로 만들기</button><button class="btn sec" id="tprint">🖨 인쇄하기</button></div>'+
   '<p>정답 보기를 켜면 「문제 풀기」 탭에서도 정답과 해설이 표시돼요. 문제 숫자는 매번 무작위로 만들어지고 정답은 코드로 계산돼요. 인쇄할 때는 메뉴가 빠지고 이 페이지만 깔끔하게 출력돼요.</p></div>'+
   '<div class="card"><h3>수업 진행 팁</h3><ul><li>실험 탭에서 100~1000번을 던져 이론과 비교하며 「동전·주사위를 구별한다」는 약속을 강조하세요.</li><li>수형도는 단계별 펼치기로 「빠짐없이, 중복 없이」를 시각적으로 확인시키세요.</li><li>합의 법칙은 「동시에 일어나지 않음」 조건, 곱의 법칙은 「잇달아」 조건을 꼭 확인하세요.</li><li>순열과 조합은 「순서·자격 구분이 있는가?」로 먼저 판단하게 하세요.</li></ul></div>'+
   '<h3>문제 은행 샘플 ('+tsamples.length+'문항)</h3>'+
   tsamples.map(function(q,i){return '<div class="card"><span class="tbadge">'+esc(q.cat)+'</span> <b>'+(i+1)+'.</b> '+esc(q.text)+
     (q.type==='choice'?'<ol>'+q.choices.map(function(c){return '<li>'+esc(c)+'</li>';}).join('')+'</ol>':'')+
     '<div class="hidden-ans"><div class="good"><b>정답:</b> '+esc(q.type==='num'?q.ans:(q.ans+1)+'번')+'<br><b>해설:</b> '+esc(q.exp)+'<br><b>힌트:</b> '+q.hints.map(esc).join(' / ')+'</div></div></div>';}).join('');
  $('tans').onclick=function(){settings.teacher=!settings.teacher;applySettings();renders[6]();};
  $('tbig').onclick=function(){settings.big=!settings.big;applySettings();renders[6]();};
  $('tnew').onclick=function(){tsamples=null;renders[6]();};
  $('tprint').onclick=function(){window.print();};
};

applySettings();
var start=parseInt((location.hash||'').replace('#t',''),10);
show(isNaN(start)||start<0||start>6?0:start);
})();
