<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공공 기관 마을 지키기</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:20px;color:#1d2b4f;background:linear-gradient(180deg,#bfe6ff 0%,#e8f7ff 45%,#c9f0c0 100%);background-attachment:fixed;-webkit-tap-highlight-color:transparent}
#wrap{max-width:980px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.top h1{font-size:clamp(22px,4.5vw,34px);margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
.btn{border:0;border-radius:18px;padding:14px 22px;min-height:60px;font-weight:bold;font-size:22px;background:#ffd23f;color:#3b2a00;box-shadow:0 5px 0 #c99a00;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c99a00}
.btn:focus-visible,.choice:focus-visible,.card:focus-visible,.bld:focus-visible,.mbtn:focus-visible{outline:4px solid #1d5bff;outline-offset:2px}
.btn.green{background:#4cd27a;box-shadow:0 5px 0 #229a4c;color:#05301a}
.btn.blue{background:#5aa7ff;box-shadow:0 5px 0 #2a6fc9;color:#02193a}
.btn.gray{background:#fff;box-shadow:0 5px 0 #b8c4dc;border:2px solid #b8c4dc;min-height:48px;font-size:18px;padding:8px 16px}
.panel{background:#fff;border-radius:24px;padding:18px;box-shadow:0 6px 0 rgba(29,43,79,.15);margin-bottom:16px}
.title{text-align:center}
.title .big{font-size:clamp(30px,7vw,52px);font-weight:900;margin:6px 0;color:#d9461f;text-shadow:0 3px 0 #fff}
.title p{margin:4px 0}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0}
.mbtn{border:0;border-radius:22px;padding:16px;min-height:130px;text-align:center;font-weight:bold;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.mbtn:active{transform:translateY(3px)}
.mbtn .ic{font-size:42px;display:block}
.mbtn .nm{font-size:23px;display:block;margin:4px 0}
.mbtn small{font-size:15px;font-weight:normal;display:block;opacity:.95}
.m1{background:#f0523d}.m2{background:#2f8fe6}.m3{background:#2fa65a}.m4{background:#8e5bd6}.m5{background:#e07a00}
.town{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.bld{position:relative;border:3px solid #9fb3d9;background:#f4f7ff;border-radius:18px;padding:10px 6px;text-align:center;min-height:106px;font-weight:bold}
.bld .e{font-size:38px;display:block;filter:grayscale(1);opacity:.55}
.bld .n{font-size:16px;display:block}
.bld.got{border-color:#ffb800;background:#fff6cf}
.bld.got .e{filter:none;opacity:1}
.bld .st{position:absolute;top:-8px;right:-6px;font-size:26px}
.hud{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:bold}
.pill{background:#fff;border-radius:999px;padding:6px 16px;box-shadow:0 3px 0 rgba(29,43,79,.15)}
.bar{height:14px;background:#dbe6f7;border-radius:8px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4cd27a,#ffd23f);width:0;transition:width .3s}
.qbox{font-size:clamp(22px,4vw,30px);font-weight:bold;line-height:1.5;text-align:center;padding:10px}
.qbox .sit{display:block;font-size:56px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:10px}
.choice{border:3px solid #7aa7e8;background:#eef5ff;border-radius:18px;padding:14px 16px;min-height:68px;font-size:22px;font-weight:bold;text-align:left;display:flex;gap:12px;align-items:center}
.choice .k{background:#2f6fd6;color:#fff;border-radius:50%;min-width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.choice.big{justify-content:center;font-size:30px;min-height:96px}
.choice:hover:not([disabled]){background:#dcebff}
.choice.ok{background:#c8f5d5;border-color:#1f9d4d}
.choice.no{background:#ffd9d4;border-color:#d6402b}
.choice[disabled]{cursor:default}
.fb{margin-top:14px;border-radius:18px;padding:14px;font-size:20px;line-height:1.55;display:none}
.fb.show{display:block}
.fb.ok{background:#e0f9e8;border:3px solid #1f9d4d}
.fb.no{background:#fff0ed;border:3px solid #d6402b}
.fb b.t{font-size:24px;display:block}
.center{text-align:center;margin-top:14px}
.stars{font-size:60px;letter-spacing:6px}
.stars .off{filter:grayscale(1);opacity:.3}
.miss{text-align:left;background:#fff8e6;border-radius:14px;padding:10px 14px;margin:8px 0;line-height:1.5}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:3px solid #7aa7e8;background:#eef5ff;border-radius:16px;padding:10px;min-height:76px;font-size:19px;font-weight:bold;text-align:center;display:flex;align-items:center;justify-content:center;width:100%;margin-bottom:10px}
.card.sel{background:#fff1a8;border-color:#e0a800;transform:scale(1.03)}
.card.done{background:#c8f5d5;border-color:#1f9d4d;opacity:.8;cursor:default}
.card.shake{animation:sh .35s;background:#ffd9d4;border-color:#d6402b}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.modal{position:fixed;inset:0;background:rgba(20,30,60,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .box{background:#fff;border-radius:24px;padding:22px;max-width:520px;width:100%;text-align:center;line-height:1.6}
.hint{font-size:16px;color:#3d4d78}
.tip{background:#fff;border-radius:16px;padding:10px 14px;font-size:17px;margin-top:10px;line-height:1.5}
@media (max-width:560px){body{font-size:18px}.cols{gap:8px}.card{font-size:16px;padding:6px}}
</style>
</head>
<body>
<div id="wrap">
  <div class="top">
    <h1>🏘️ 공공 기관 마을 지키기</h1>
    <button class="btn gray" id="mute" aria-label="소리 켜기 끄기">🔊 소리 켜짐</button>
  </div>
  <div id="app"></div>
</div>
<script>

const BY = Object.fromEntries(INST.map(x=>[x.id,x]));

/* 미션 퀴즈: 상황 -> 기관 */
const MISSION = [

/* 소리 */
let actx=null;
function beep(freqs){
 if(DB.muted)return;
 try{
  actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  let t=actx.currentTime;
  freqs.forEach(f=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.17);t+=.13;});
 }catch(e){}
}

/* ===== 공통 ===== */
let G=null;
function start(mode){
 if(mode==='match')return startMatch();
 const M=MODES[mode];let pool=[];
 if(mode==='mission'){
  pool=MISSION.map(q=>{const a=BY[q[2]].s;const others=shuffle(INST.filter(i=>i.id!==q[2])).slice(0,3).map(i=>i.s);
   return {sit:q[0],t:q[1],a,c:shuffle([a,...others]),e:q[3],i:q[2]};});
 }else if(mode==='ox'){
  pool=OX.map(q=>({t:q[0],a:q[1]?'O':'X',c:['O','X'],e:q[2],i:q[3],big:true}));
 }else if(mode==='classify'){
  pool=CLASSIFY.map(q=>({sit:'🔎',t:`"${q[0]}"은(는) 공공 기관일까요, 민간 기업일까요?`,a:q[1]?'공공 기관':'민간 기업',c:['공공 기관','민간 기업'],e:q[2],big:true}));
 }else{
  pool=PART.map(q=>({t:q[0],a:q[1],c:shuffle(q[2]),e:q[3]}));
 }
 G={mode,qs:shuffle(pool).slice(0,M.n),idx:0,lives:M.lives,score:0,combo:0,maxCombo:0,right:0,missed:[],answered:false};
 showQ();
}
function hearts(n,t){return '❤️'.repeat(n)+'🤍'.repeat(t-n);}
function showQ(){
 const M=MODES[G.mode],q=G.qs[G.idx];G.answered=false;
 let h=`<div class="panel"><div class="hud"><span class="pill">${M.icon} ${M.name}</span><span class="pill">${G.idx+1} / ${G.qs.length}</span><span class="pill" aria-label="목숨">${hearts(G.lives,M.lives)}</span><span class="pill">⭐ ${G.score}점</span><span class="pill">🔥 연속 ${G.combo}</span></div>
 <div class="bar"><i style="width:${G.idx/G.qs.length*100}%"></i></div>
 <div class="qbox">${q.sit?`<span class="sit">${q.sit}</span>`:''}${q.t}</div>
 <div class="choices" id="ch">`;
 q.c.forEach((c,i)=>{h+=`<button class="choice ${q.big?'big':''}" data-c="${i}"><span class="k">${q.big&&G.mode==='ox'?c:i+1}</span><span>${q.big&&G.mode==='ox'?(c==='O'?'맞아요':'틀려요'):c}</span></button>`;});
 h+=`</div><div class="fb" id="fb" aria-live="polite"></div><div class="center" id="nx"></div></div>
 <div class="center"><button class="btn gray" id="home">🏠 처음으로</button></div>`;
 app.innerHTML=h;
 app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(+b.dataset.c));
 $('#home').onclick=()=>{if(confirm('게임을 그만두고 처음으로 갈까요?'))showMenu();};
 keyHandler=k=>{
  if(G.answered){if(k==='Enter'||k===' '){next();return true;}return false;}
  let n=parseInt(k,10)-1;
  if(G.mode==='ox'){const u=k.toUpperCase();if(u==='O')n=0;else if(u==='X')n=1;}
  if(n>=0&&n<q.c.length){answer(n);return true;}
 };
}
function answer(i){
 if(G.answered)return;G.answered=true;
 const q=G.qs[G.idx];const ok=q.c[i]===q.a;
 const bs=app.querySelectorAll('.choice');
 bs.forEach((b,j)=>{b.disabled=true;if(q.c[j]===q.a)b.classList.add('ok');else if(j===i)b.classList.add('no');});
 const fb=$('#fb');fb.classList.add('show',ok?'ok':'no');
 if(ok){
  G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);G.right++;
  const gain=100+Math.min(G.combo-1,5)*20;G.score+=gain;
  if(q.i){DB.stamps[q.i]=1;saveStore(DB);}
  fb.innerHTML=`<b class="t">🎉 정답! +${gain}점${G.combo>=2?' (콤보 🔥'+G.combo+')':''}</b>${q.e}${q.i?`<br>${BY[q.i].e} ${BY[q.i].s} 도장 획득!`:''}`;
  beep([660,880]);
 }else{
  G.combo=0;G.lives--;G.missed.push(q);
  fb.innerHTML=`<b class="t">😢 아쉬워요! 정답: ${q.a}</b>${q.e}`;
  beep([300,220]);
 }
 const last=G.idx>=G.qs.length-1||G.lives<=0;
 $('#nx').innerHTML=`<button class="btn green" id="nb">${last?'결과 보기 (Enter)':'다음 문제 (Enter)'}</button>`;
 $('#nb').onclick=next;$('#nb').focus();
 const pills=app.querySelectorAll('.hud .pill');pills[2].textContent=hearts(G.lives,MODES[G.mode].lives);pills[3].textContent='⭐ '+G.score+'점';pills[4].textContent='🔥 연속 '+G.combo;
}
function next(){
 if(!G||!G.answered)return;
 G.answered=false;
 if(G.idx>=G.qs.length-1||G.lives<=0){return finish(G.qs.length,G.right,G.lives<=0?G.idx+1:G.qs.length);}
 G.idx++;showQ();
}
function starsFor(r){return r>=0.9?3:r>=0.6?2:1;}
function finish(total,right,done,matchInfo){
 const mode=G.mode;const stars=matchInfo?matchInfo.stars:starsFor(right/total);
 const prev=DB.best[mode];const isBest=prev==null||G.score>prev;
 if(isBest){DB.best[mode]=G.score;saveStore(DB);}
 const over=!matchInfo&&G.lives<=0&&right<total;
 let h=`<div class="panel center"><h2>${over?'💔 목숨을 모두 잃었어요':'🏁 결과'}</h2>

 <p style="font-size:28px;font-weight:bold">${G.score}점</p>
 <p>${matchInfo?`틀린 횟수 ${matchInfo.mistakes}번`:`맞힌 문제 ${right} / ${done}`} · 최고 연속 정답 ${G.maxCombo}</p>
 <p>${isBest?'🏆 새로운 최고 점수예요!':'🏆 최고 점수 '+DB.best[mode]+'점'}</p>
 <p>${stars===3?'정말 훌륭해요! 우리 마을의 수호자예요!':stars===2?'잘했어요! 조금만 더 하면 별 3개!':'괜찮아요, 다시 도전하면 더 잘할 수 있어요!'}</p>`;
 const missed=G.missed;
 if(missed.length){h+=`<h3>📝 다시 살펴볼 문제</h3>`;
  missed.forEach(q=>{h+=`<div class="miss"><b>${q.t}</b><br>✅ 정답: ${q.a}<br>💬 ${q.e}</div>`;});}
 else h+='<p>🎊 틀린 문제가 없어요!</p>';
 h+=`<div class="center"><button class="btn green" id="rt">🔄 다시 도전</button> <button class="btn blue" id="mn">🏠 마을로 가기</button></div></div>`;
 app.innerHTML=h;
 $('#rt').onclick=()=>start(mode);$('#mn').onclick=showMenu;
 keyHandler=k=>{if(k==='Enter'){start(mode);return true;}if(k==='Escape'){showMenu();return true;}};
 beep(stars>=2?[523,659,784]:[392,330]);
}

 h+=`</div></div><div class="fb ${msg?'show '+msg.c:''}" id="fb">${msg?msg.t:''}</div></div>
 <div class="center"><button class="btn gray" id="home">🏠 처음으로</button></div>`;

 keyHandler=null;
 app.querySelectorAll('.card').forEach(b=>b.onclick=()=>pickMatch(b));
 $('#home').onclick=()=>{if(confirm('게임을 그만두고 처음으로 갈까요?'))showMenu();};
}
function pickMatch(b){
 const id=b.dataset.id,side=b.dataset.s;
 if(G.done.has(id))return;
 if(!G.sel||G.sel.side===side){G.sel={id,side};renderMatch();return;}
 const first=G.sel;G.sel=null;
 if(first.id===id){
  G.done.add(id);G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
  const gain=100+Math.min(G.combo-1,5)*20;G.score+=gain;DB.stamps[id]=1;saveStore(DB);beep([660,880]);
  if(G.done.size===G.pairs.length){
   const stars=G.mistakes<=1?3:G.mistakes<=4?2:1;
   G.score=Math.max(0,G.score-G.mistakes*30);
   G.missed=[...G.missedIds].map(k=>({t:BY[k].s+'이(가) 하는 일은?',a:BY[k].job,e:BY[k].info}));
   return finish(G.pairs.length,G.pairs.length,G.pairs.length,{stars,mistakes:G.mistakes});
  }
  renderMatch({c:'ok',t:`🎉 정답! ${BY[id].e} ${BY[id].n} 도장 획득!<br>${BY[id].info}`});
 }else{
  G.mistakes++;G.combo=0;G.missedIds.add(first.id);if(first.side==='R')G.missedIds.delete(first.id),G.missedIds.add(first.id);
  beep([300,220]);
  renderMatch({c:'no',t:'😢 짝이 아니에요. 다시 생각해 봐요!'});
  app.querySelectorAll('.card').forEach(c=>{if(c.dataset.id===id&&c.dataset.s===side)c.classList.add('shake');});
 }
}

showMenu();
</script>
</body>
</html>
