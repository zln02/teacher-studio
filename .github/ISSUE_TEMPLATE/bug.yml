name: 🐞 안 되는 부분 알리기
description: 화면이 이상하거나 멈췄어요
title: "[안 돼요] "
labels: ["안 돼요"]
body:
  - type: dropdown
    id: where
    attributes:
      label: 어디서 쓰셨나요?
      options: ["Claude 앱·웹", "Claude Code", "Codex", "모르겠어요"]
    validations: { required: true }
  - type: dropdown
    id: device
    attributes:
      label: 어떤 화면에서요?
      options: ["전자칠판", "교실 컴퓨터", "태블릿", "휴대폰", "기타"]
  - type: textarea
    id: what
    attributes:
      label: 무엇이 안 되나요?
      placeholder: "예) 방탈출 3단계에서 카드를 끌어도 안 움직여요"
    validations: { required: true }
  - type: textarea
    id: shot
    attributes:
      label: 캡처 (있으면 끌어다 놓아 주세요)
  - type: markdown
    attributes:
      value: "⚠️ 학생 이름·얼굴이 보이는 캡처는 올리지 말아 주세요."
