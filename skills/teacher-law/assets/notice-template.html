<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
@page { size: A4; margin: 16mm; }
* { box-sizing: border-box; }
body { margin: 0; background: #eef0f3; color: #1d2530; font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; line-height: 1.6; }
.page { width: 210mm; min-height: 297mm; margin: 12px auto; padding: 16mm; background: #fff; }
h1 { font-size: 22pt; margin: 0 0 4mm; border-bottom: 3px solid #2d5bd0; padding-bottom: 3mm; }
h2 { font-size: 12pt; color: #2d5bd0; margin: 6mm 0 2mm; }
.q { font-size: 12pt; background: #f3f6fd; padding: 3mm 4mm; border-radius: 3mm; }
.concl { font-size: 14pt; font-weight: bold; border: 2px solid #2d5bd0; padding: 4mm; border-radius: 3mm; }
ul, ol { margin: 0; padding-left: 6mm; }
li { margin-bottom: 1.5mm; }
.src li { font-size: 10pt; word-break: break-all; }
.note { margin-top: 8mm; padding: 3mm 4mm; background: #fff7e0; border: 1px solid #e0b84a; border-radius: 3mm; font-size: 10.5pt; }
.date { margin-top: 3mm; font-size: 10.5pt; color: #55606e; text-align: right; }
@media print { body { background: #fff; } .page { margin: 0; padding: 0; width: auto; min-height: 0; } }
</style>
</head>
<body>
<div class="page">
<h1>{{TITLE}}</h1>
<h2>질문</h2>
<div class="q">{{QUESTION}}</div>
<h2>한 줄 결론</h2>
<div class="concl">{{CONCLUSION}}</div>
<h2>왜 그런가요?</h2>
<ul>{{REASONS}}</ul>
<h2>근거</h2>
<ul class="src">{{SOURCES}}</ul>
<h2>이렇게 하면 안전해요</h2>
<ol>{{SAFE_OPTIONS}}</ol>
<div class="note">법률 자문이 아니에요. 최종 판단과 책임은 선생님께 있어요. 애매하면 학교 관리자·교육청(법무 담당)에 확인하세요.</div>
<div class="date">법은 바뀔 수 있어요 — 확인한 날: {{CHECKED_DATE}}</div>
</div>
</body>
</html>
